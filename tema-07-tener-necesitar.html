function chooseVoice(){
  if(!("speechSynthesis" in window)) return null;
  const voices=speechSynthesis.getVoices();
  const spanish=voices.filter(v=>/^es([-_]|$)/i.test(v.lang));
  return spanish.find(v=>/CO|colomb/i.test(v.lang+" "+v.name)) || spanish.find(v=>/MX|US|419|latin/i.test(v.lang+" "+v.name)) || spanish[0] || null;
}
function speak(text,slow=false){
  if(!("speechSynthesis" in window)){alert("La síntesis de voz no está disponible en este navegador.");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="es-CO";u.rate=slow?.72:.94;const v=chooseVoice();if(v)u.voice=v;speechSynthesis.speak(u);
}

   $("#checkBar").style.width=pct+"%";
   $("#checkCount").textContent=`${completed} de ${checks.length} completados`;
   const track=document.querySelector('.check-track'); if(track)track.setAttribute('aria-valuenow',String(pct));
   const all=completed===checks.length;$("#ready").classList.toggle('hidden',!all);
 }));
 document.querySelectorAll(".prev").forEach((b,i)=>b.addEventListener("click",()=>showSection(i-1)));
 document.querySelectorAll(".next").forEach((b,i)=>b.addEventListener("click",()=>showSection(i+1)));
 document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>showSection(+b.dataset.go)));
}
function updateBuilder(){const sels=[...document.querySelectorAll('.builder-select')];if(!sels.length)return;const text=sels.map(s=>s.value).join(' ');$("#builderResult").textContent=text;$("#builderAudio").innerHTML=level==='a2'?audioButtons(text):'';$("#builderAudio").querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.speak,!!b.dataset.slow)))}
function checkMC(b){const i=+b.dataset.i,j=+b.dataset.j,e=contenido[level].ejercicios[i],box=b.closest('.exercise'),f=box.querySelector('.feedback');box.querySelectorAll('.ex-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(j===e.correct){f.textContent="Esta opción funciona bien. "+e.exp;f.className='feedback good';mark('ex-'+i)}else{f.textContent="Esta opción no es la más adecuada aquí. "+e.exp;f.className='feedback warn'}}
function checkFill(i){const e=contenido[level].ejercicios[i],box=document.querySelector(`[data-ex="${i}"]`),input=box.querySelector('.fill-input'),f=box.querySelector('.feedback'),v=input.value.trim().toLowerCase();const ok=e.answers.some(a=>a.toLowerCase()===v);f.textContent=(ok?"La forma funciona. ":"Revisa la estructura. ")+e.exp;f.className='feedback '+(ok?'good':'warn');if(ok)mark('ex-'+i)}
function retry(i){const box=document.querySelector(`[data-ex="${i}"]`);box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));const input=box.querySelector('input');if(input)input.value='';const f=box.querySelector('.feedback');f.className='feedback hidden';f.textContent=''}
function showSection(i){i=Math.max(0,Math.min(sectionsMeta.length-1,i));current=i;document.querySelectorAll('.section').forEach((s,j)=>s.classList.toggle('active',j===i));document.querySelectorAll('[data-go]').forEach((b,j)=>b.classList.toggle('active',j===i));mark('section-'+i);window.scrollTo({top:document.querySelector('.hero').offsetTop+document.querySelector('.hero').offsetHeight-10,behavior:'smooth'})}
function start(l){level=l;done.clear();$("#levelScreen").classList.add('hidden');$("#module").classList.remove('hidden');render()}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.level)));
$("#changeLevel").addEventListener('click',()=>{if("speechSynthesis" in window)speechSynthesis.cancel();$("#module").classList.add('hidden');$("#levelScreen").classList.remove('hidden');window.scrollTo(0,0)});
</script>
</body>

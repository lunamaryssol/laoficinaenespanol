b1:{ruta:"💼 B1 — Intermedio",objetivo:"Al terminar esta semana podrás explicar desplazamientos profesionales con claridad, combinar salida, destino, llegada y regreso, y escoger entre ir, venir, volver, acercarse, desplazarse y pasar por según el punto de referencia y el registro.",situacion:{resumen:"Coordinas una jornada con visitas a dos sedes. Debes actualizar a tu responsable sobre tu itinerario, justificar un cambio y dejar claro cuándo estarás de vuelta para una reunión interna.",datos:[["Quién habla","Tú, responsable de una visita"],["Con quién","Tu responsable o equipo"],["Contexto","Actualización logística durante la jornada"],["Objetivo","Comunicar movimientos y cambios con precisión"],["Dificultad","Mantener claro el punto de referencia y evitar verbos demasiado genéricos"]]},vocab:[{w:"desplazarse",ex:"Mañana me desplazo a la planta norte para la inspección.",extra:"Más formal y neutro que «ir» cuando interesa destacar el traslado."},{w:"acercarse",ex:"Puedo acercarme a tu oficina después de la reunión.",extra:"Sugiere un desplazamiento relativamente breve o hacia el interlocutor."},{w:"trasladarse",ex:"El equipo se trasladará temporalmente a la sede sur.",extra:"Más formal; frecuente para cambios de ubicación o movimientos organizados."},{w:"pasar por",ex:"Antes de ir al cliente, pasaré por el almacén.",extra:"Indica una parada intermedia."},{w:"regresar",ex:"Regresaré a la oficina sobre las cuatro.",extra:"Alternativa más formal a «volver»."},{w:"dirigirse a",ex:"Después de la visita, me dirigiré a la segunda sede.",extra:"Registro formal; útil en informes o instrucciones."}],phrases:[{g:"Informar un itinerario",items:[{t:"Salgo de la oficina a las ocho y me dirijo directamente a la planta norte.",u:"Combina salida y destino con un registro profesional."},{t:"Después pasaré por el almacén antes de volver a la sede central.",u:"«Pasar por» introduce una parada intermedia."}]},{g:"Actualizar un cambio",items:[{t:"Finalmente no voy a la sede sur; me desp let level=null;const state={visited:new Set(),actions:new Set(),checks:new Set()};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function speak(text,rate=1){if(!('speechSynthesis'in window)){alert('La reproducción de voz no está disponible en este navegador.');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-CO';u.rate=rate;const voices=window.speechSynthesis.getVoices();const spanish=voices.filter(v=>/^es/i.test(v.lang));u.voice=spanish.find(v=>/CO|colomb/i.test(v.lang+v.name))||spanish.find(v=>/MX|US|419|AR|CL|PE/i.test(v.lang))||spanish[0]||null;window.speechSynthesis.speak(u);}
function audio(text){if(level!=='a2')return'';const t=esc(text);return `<div class="audio-row"><button class="audio-btn" data-speak="${t}" data-rate="1" aria-label="Escuchar: ${t}">🔊 Escuchar / Listen</button><button class="audio-btn" data-speak="${t}" data-rate="0.72" aria-label="Escuchar lento: ${t}">🐢 Lento / Slow</button></div>`}
function markAction(id){state.actions.add(id);updateProgress();}
function hasAction(prefix){return [...state.actions].some(x=>x===prefix||x.startsWith(prefix));}
function actionMilestones(){
  if(!level)return {done:0,total:0};
  const d=contenido[level];
  let done=0,total=0;
  const milestone=(ok)=>{total++;if(ok)done++;};
  milestone(hasAction('vocab-'));
  milestone(hasAction('detail-'));
  milestone(hasAction('builder'));
  milestone(hasAction('register'));
  milestone(hasAction('annotation'));
  d.exercises.forEach((_,i)=>milestone(state.actions.has('quiz-'+i)));
  milestone(state.actions.has('practice'));
  milestone(state.actions.has('model'));
  if(level==='a2'){
    milestone(state.actions.has('retrieval'));
    milestone(hasAction('audio-')||state.actions.has('builder-audio'));
  }
  return {done,total};
}
function updateProgress(){
  if(!level)return;
  const a=actionMilestones();
  const total=contenido.meta.secciones.length+a.total+contenido[level].check.length;
  const done=state.visited.size+a.done+state.checks.size;
  const p=Math.min(100,Math.round(done/total*100));
  $('#progressBar').style.width=p+'%';
  $('#progressText').textContent=p+'%';
}
function nav(){const sb=$('#sidebar');sb.innerHTML='';contenido.meta.secciones.forEach((n,i)=>{const b=document.createElement('button');b.className='nav-btn';b.textContent=n;b.onclick=()=>document.getElementById('sec'+i).scrollIntoView({behavior:'smooth',block:'start'});sb.appendChild(b);});}
function move(i){return `<div class="section-move"><button class="btn secondary" data-go="${Math.max(0,i-1)}" ${i===0?'disabled':''}>← Anterior</button><button class="btn" data-go="${Math.min(11,i+1)}" ${i===11?'disabled':''}>Siguiente →</button></div>`}
function section(i,title,body){return `<section id="sec${i}" class="panel" data-section="${i}"><h2>${title}</h2>${body}${move(i)}</section>`}

html+=section(3,contenido.meta.secciones[3],d.phrases.map((g,gi)=>`<div class="group"><h3>${g.g}</h3>${g.items.map((x,pi)=>`<div class="phrase"><strong>${x.t}</strong>${audio(x.t)}<button class="details-btn" data-detail="${gi}-${pi}">Ver cuándo usarla</button><div class="details" id="det-${gi}-${pi}">${x.u}</div></div>`).join('')}</div>`).join(''));
html+=section(4,contenido.meta.secciones[4],`<p>${level==='a2'?'Construye primero una ruta breve con bloques que ya practicaste. / Build a short route with familiar blocks.':'Combina las piezas y después adapta el resultado a una situación real.'}</p><div class="builder"><div class="builder-grid">${d.builder.choices.map((arr,i)=>`<label><strong>${d.builder.labels[i]}</strong><select class="build-select">${arr.map(x=>`<option>${x}</option>`).join('')}</select></label>`).join('')}</div><div id="buildOut" class="output"></div><div id="buildAudio"></div></div>`);

html+=section(8,contenido.meta.secciones[8],d.exercises.map((q,i)=>quizHTML(q,i)).join(''));
html+=section(9,contenido.meta.secciones[9],`<p>${d.practice.situacion}</p><h3>Requisitos</h3><ul>${d.practice.req.map(x=>`<li>${x}</li>`).join('')}</ul><div class="support-list">${d.practice.support.map(x=>`<button class="support-chip" data-support="${esc(x)}">${x}</button>`).join('')}</div>${level==='a2'?d.practice.support.map(x=>audio(x)).join(''):''}<label for="practiceText"><strong>Tu respuesta</strong></label><textarea id="practiceText" placeholder="${esc(d.practice.placeholder)}"></textarea><div class="quiz-actions"><button class="btn" id="savePractice">He terminado mi respuesta</button></div><div id="practiceFeedback" class="feedback">Respuesta registrada para tu progreso. Compárala ahora con una posible respuesta, pero no la sustituyas automáticamente.</div>`);
html+=section(10,contenido.meta.secciones[10],`<p>Primero intenta tu propia respuesta. Después puedes comparar decisiones lingüísticas.</p><button class="btn secondary" id="showModel">Ver una posible respuesta</button><div id="modelBox" class="model"><strong>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</strong><p>${d.practice.model}</p>${audio(d.practice.model)}</div>`);
html+=section(11,contenido.meta.secciones[11],`<p>Antes de terminar, comprueba qué puedes hacer ahora.</p><div class="checklist">${d.check.map((x,i)=>`<label class="check-item"><input type="checkbox" data-check="${i}"><span>${x}</span></label>`).join('')}</div><div id="ready" class="ready"><h3>🎯 Ya estás listo para practicar</h3><p>No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p><!-- Inserta aquí la URL real del reto diario cuando esté disponible. --><a class="challenge" href="#">🔥 Ir al reto de hoy</a></div>`);
$('#sections').innerHTML=html;bind();updateBuilder();observe();updateProgress();}
function retrievalHTML(d){
  const target=d.vocab[2];
  const distractors=[d.vocab[0],d.vocab[3]].filter(Boolean);
  const options=[target,...distractors].sort((a,b)=>a.w.localeCompare(b.w,'es'));
  return `<div class="retrieval-box"><h3>Recupera el vocabulario / Recall the vocabulary</h3><p class="retrieval-prompt">¿Qué palabra significa <strong>"${target.en}"</strong>? Intenta recordarla antes de abrir las tarjetas. / Which Spanish word matches this meaning?</p><div class="retrieval-options">${options.map(v=>`<button type="button" class="option" data-retrieval="${esc(v.w)}" data-answer="${esc(target.w)}">${v.w}</button>`).join('')}</div>${audio(target.w)}<div id="retrievalFeedback" class="feedback retrieval-feedback" role="status" aria-live="polite"></div></div>`;
}
function quizHTML(q,i){if(q.type==='mc')return `<div class="quiz" data-quiz="${i}"><h3>${q.q}</h3><div class="options">${q.opts.map((o,j)=>`<div><button class="option" data-q="${i}" data-opt="${j}">${o}</button>${level==='a2'?audio(o):''}</div>`).join('')}</div><div class="feedback" id="qfb${i}"></div></div>`;if(q.type==='text')return `<div class="quiz" data-quiz="${i}"><h3>${q.q}</h3><input type="text" id="qin${i}" aria-label="Respuesta"><div class="quiz-actions"><button class="btn" data-checktext="${i}">Comprobar</button><button class="btn secondary" data-reset="${i}">Intentar de nuevo</button></div><div class="feedback" id="qfb${i}"></div></div>`;return `<div class="quiz" data-quiz="${i}"><h3>${q.q}</h3><div class="token-bank">${q.tokens.map((t,j)=>`<button class="token" data-token="${i}-${j}" data-qi="${i}" data-text="${esc(t)}">${t}</button>`).join('')}</div><div class="order-output" id="order${i}"></div><div class="quiz-actions"><button class="btn" data-checkorder="${i}">Comprobar</button><button class="btn secondary" data-resetorder="${i}">Reiniciar</button></div><div class="feedback" id="qfb${i}"></div></div>`}
function bind(){
$$('[data-speak]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();speak(b.dataset.speak,Number(b.dataset.rate));markAction('audio-'+b.dataset.speak);}));
$$('[data-vocab-toggle]').forEach(b=>b.onclick=()=>{const card=b.closest('.flip');card.classList.toggle('open');b.setAttribute('aria-expanded',card.classList.contains('open')?'true':'false');markAction('vocab-'+b.dataset.vocabToggle)});
$$('[data-detail]').forEach(b=>b.onclick=()=>{const x=$('#det-'+b.dataset.detail);x.classList.toggle('show');markAction('detail-'+b.dataset.detail)});
$$('.build-select').forEach(s=>s.onchange=()=>{updateBuilder();markAction('builder')});
$$('[data-retrieval]').forEach(b=>b.onclick=()=>{const ok=b.dataset.retrieval===b.dataset.answer;const f=$('#retrievalFeedback');f.textContent=ok?'Sí. «'+b.dataset.retrieval+'» corresponde a ese significado. Ahora intenta decirla sin mirar la tarjeta. / Correct. Try saying it once without looking.':'Todavía no. Esa opción no corresponde a ese significado. Vuelve a intentarlo y después abre la tarjeta si necesitas apoyo. / Not yet. Try again, then reveal the card if you need support.';f.className='feedback retrieval-feedback show '+(ok?'good':'warn');if(ok)markAction('retrieval')});
$$('[data-reg]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.reg);$$('[data-reg]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const f=$('#regFeedback');f.textContent=contenido[level].register.feedback[i];f.className='feedback show '+(i===contenido[level].register.best?'good':'warn');markAction('register')});
$$('[data-ann]').forEach(b=>b.onclick=()=>{$('#annotation').textContent=contenido[level].example.parts[Number(b.dataset.ann)].e;markAction('annotation')});
$$('[data-q]').forEach(b=>b.onclick=()=>{const qi=Number(b.dataset.q),oi=Number(b.dataset.opt),q=contenido[level].exercises[qi],f=$('#qfb'+qi),ok=oi===q.a;f.textContent=(ok?'Esta opción funciona. ':'Revísalo y vuelve a intentarlo. ')+q.fb;f.className='feedback show '+(ok?'good':'warn');if(ok)markAction('quiz-'+qi)});
$$('[data-checktext]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.checktext),q=contenido[level].exercises[i],v=$('#qin'+i).value.trim().toLowerCase(),f=$('#qfb'+i),ok=v===q.a.toLowerCase();f.textContent=(ok?'La respuesta encaja. ':'Todavía no encaja. Inténtalo otra vez. ')+q.fb;f.className='feedback show '+(ok?'good':'warn');if(ok)markAction('quiz-'+i)});
$$('[data-reset]').forEach(b=>b.onclick=()=>{$('#qin'+b.dataset.reset).value='';$('#qfb'+b.dataset.reset).className='feedback'});
const orders={};$$('[data-token]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.qi);orders[i]=orders[i]||[];if(b.classList.contains('used'))return;orders[i].push(b.dataset.text);b.classList.add('used');$('#order'+i).textContent=orders[i].join(' ')});
$$('[data-checkorder]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.checkorder),q=contenido[level].exercises[i],arr=orders[i]||[],ok=JSON.stringify(arr)===JSON.stringify(q.order),f=$('#qfb'+i);f.textContent=(ok?'El orden funciona. ':'El orden todavía necesita un ajuste. Reinicia o prueba otra secuencia. ')+q.fb;f.className='feedback show '+(ok?'good':'warn');if(ok)markAction('quiz-'+i)});
$$('[data-resetorder]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.resetorder);orders[i]=[];$('#order'+i).textContent='';$$(`[data-qi="${i}"]`).forEach(x=>x.classList.remove('used'));$('#qfb'+i).className='feedback'});
$$('[data-support]').forEach(b=>b.onclick=()=>{const ta=$('#practiceText');ta.value+=(ta.value?' ':'')+b.dataset.support;ta.focus();markAction('support')});
$('#savePractice').onclick=()=>{const f=$('#practiceFeedback'),txt=$('#practiceText').value.trim();if(txt.length>20){f.textContent='Respuesta registrada para tu progreso. Compárala ahora con una posible respuesta, pero no la sustituyas automáticamente.';f.className='feedback show good';markAction('practice')}else{f.textContent='Tu respuesta todavía es muy breve para esta práctica. Añade la información solicitada antes de marcarla como terminada.';f.className='feedback show warn'}};
$('#showModel').onclick=()=>{$('#modelBox').classList.toggle('show');markAction('model')};
$$('[data-check]').forEach(c=>c.onchange=()=>{const id='check-'+c.dataset.check;c.checked?state.checks.add(id):state.checks.delete(id);updateProgress();const all=$$('[data-check]').every(x=>x.checked);$('#ready').classList.toggle('show',all)});
$$('[data-go]').forEach(b=>b.onclick=()=>document.getElementById('sec'+b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'}));}
function updateBuilder(){const sels=$$('.build-select');if(!sels.length)return;const text=sels.map(s=>s.value).join(' ');$('#buildOut').textContent=text;$('#buildAudio').innerHTML=level==='a2'?audio(text):'';$$('#buildAudio [data-speak]').forEach(b=>b.onclick=()=>{speak(b.dataset.speak,Number(b.dataset.rate));markAction('builder-audio')});}
function observe(){const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=Number(e.target.dataset.section);state.visited.add('s'+i);updateProgress();$$('.nav-btn').forEach((b,j)=>b.classList.toggle('active',j===i));}}),{threshold:.35});$$('[data-section]').forEach(s=>obs.observe(s));}
$$('.level-card').forEach(b=>b.onclick=()=>{level=b.dataset.level;$('#levelScreen').classList.add('hidden');$('#app').classList.remove('hidden');render();window.scrollTo(0,0)});$('#changeLevel').onclick=()=>{window.speechSynthesis?.cancel();$('#app').classList.add('hidden');$('#levelScreen').classList.remove('hidden');window.scrollTo(0,0)};
</script>
</body>
</html>

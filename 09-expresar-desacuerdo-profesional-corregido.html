let level=null, current=0, visited=new Set(), completed=new Set();

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function audioControls(text){
 if(level!=="a2") return "";
 const safe=esc(text);
 return `<div class="audio"><button type="button" aria-label="Escuchar a velocidad normal: ${safe}" onclick='speak(${JSON.stringify(text)},1)'>🔊 Escuchar / Listen</button><button type="button" aria-label="Escuchar lentamente: ${safe}" onclick='speak(${JSON.stringify(text)},0.72)'>🐢 Lento / Slow</button></div>`;
}
function speak(text,rate=1){
 if(!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)){alert("La síntesis de voz no está disponible en este navegador.");return}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text); u.lang="es-CO";u.rate=rate;
 const voices=window.speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
 const pref=voices.find(v=>/es-(CO|MX|US|AR|CL|PE)/i.test(v.lang))||voices[0];
 if(pref)u.voice=pref;window.speechSynthesis.speak(u);
}
function cardV(v){
 const [t,en,exp,ej,extra]=v;
 return `<div class="card"><button class="card-head" type="button">${esc(t)} <span>＋</span></button><div class="card-body">${level==="a2"&&en?`<p><b>English:</b> ${esc(en)}</p>`:""}<p>${esc(exp)}</p><p><b>Ejemplo:</b> ${esc(ej)}</p><p class="micro">${esc(extra||"")}</p>${audioControls(t)}${audioControls(ej)}</div></div>`;
}
function phrasesHtml(groups){
 return groups.map(g=>`<div class="group"><div class="group-label">${esc(g[0])}</div>${g[1].map(p=>`<div class="phrase"><div class="phrase-main"><div><div class="phrase-text">${esc(p[0])}</div>${audioControls(p[0])}</div><button class="small when-btn" type="button">Ver cuándo usarla</button></div><div class="when">${esc(p[1])}</div></div>`).join("")}</div>`).join("");
}
function builderHtml(d){
 return `<div class="builder"><p class="micro">${level==="a2"?"Elige un bloque de cada columna. Después cambia una parte para adaptarlo a tu situación. / Choose one block from each column, then adapt it.":"Combina las piezas y después reformula el resultado para que suene natural en tu contexto."}</p><div class="builder-grid">${d.labels.map((l,i)=>`<label>${esc(l)}<select class="build-select" data-i="${i}">${d.opts[i].map(o=>`<option>${esc(o)}</option>`).join("")}</select></label>`).join("")}</div><div id="buildResult" class="result"></div><div id="buildAudio"></div></div>`;
}
function grammarHtml(arr){return arr.map((g,i)=>`<div class="accordion"><button type="button">${esc(g[0])}<span>＋</span></button><div class="acc-panel">${g[1]}${level==="a2"?audioControls(g[1].replace(/<[^>]+>/g,"")):""}</div></div>`).join("")}
function quizHtml(arr){return arr.map((q,i)=>`<div class="quiz" data-q="${i}"><h3>${esc(q.q)}</h3><div class="options">${q.opts.map((o,j)=>`<button class="option" type="button" data-choice="${j}">${esc(o)}</button>`).join("")}</div><div class="feedback"></div></div>`).join("")}
function controls(i){return `<div class="controls"><button class="navbtn prev" type="button" ${i===0?"disabled":""}>← Anterior</button><button class="navbtn next" type="button" ${i===11?"disabled":""}>Siguiente →</button></div>`}
function section(i,title,body){return `<section class="section ${i===current?"active":""}" data-section="${i}"><div class="title-row"><div class="num">${i+1}</div><h2>${title}</h2></div>${body}${controls(i)}</section>`}

function render(){
 const d=data[level]; document.getElementById("route").textContent="Tu ruta: "+d.route;document.getElementById("heroIntro").textContent=d.intro;
 document.getElementById("nav").innerHTML=meta.sections.map((s,i)=>`<button class="chip ${i===current?"active":""}" data-go="${i}">${i+1}. ${s}</button>`).join("");
 let h="";
 h+=section(0,meta.sections[0],`<p class="lead">${esc(d.objective)}</p><div class="callout">Al final del módulo comprobarás si ya puedes hacerlo.</div>`);
 h+=section(1,meta.sections[1],`<p class="lead">${esc(d.situation.text)}</p><div class="info-grid">${d.situation.facts.map(x=>`<div class="info"><strong>${esc(x[0])}</strong><br>${esc(x[1])}</div>`).join("")}</div>`);
 h+=section(2,meta.sections[2],`<p class="sub">Pulsa cada tarjeta para revelar significado, ejemplo y nota de uso.</p><div class="cards">${d.vocab.map(cardV).join("")}</div>${level==="a2"?`<div class="quiz"><h3>Recuperación rápida / Quick recall</h3><p>¿Cuál expresión significa <b>to disagree</b>?</p><div class="options"><button class="option recall" data-ok="0">estar de acuerdo</button><button class="option recall" data-ok="1">no estar de acuerdo</button><button class="option recall" data-ok="0">alternativa</button></div><div class="feedback"></div></div>`:""}`);
 h+=section(3,meta.sections[3],`<p class="sub">${level==="a2"?"Escucha, reconoce la función y practica las frases clave. / Listen, identify the function and practice.":"Observa cómo cambia el efecto según la función comunicativa."}</p>${phrasesHtml(d.phrases)}`);
 h+=section(4,meta.sections[4],builderHtml(d));
 h+=section(5,meta.sections[5],`<p class="sub">Solo aparece la gramática que necesitas para ejecutar esta habilidad profesional.</p>${grammarHtml(d.grammar)}`);
 h+=section(6,meta.sections[6],`<p>Estás hablando con <b>${esc(d.register.who)}</b>. Elige la formulación más adecuada.</p><div id="regOptions" class="options">${d.register.options.map((o,i)=>`<div class="register-row"><button class="option reg" type="button" data-r="${i}">${esc(o[0])}</button>${level==="a2"?audioControls(o[0]):""}</div>`).join("")}</div><div id="regFeedback" class="feedback" aria-live="polite"></div>`);
 const ex=d.example;
 const parts=ex.split(/(?<=[.!?])\s+/);
 h+=section(7,meta.sections[7],`<div class="example">${parts.map((p,i)=>`<button class="annotated" type="button" data-ann="${i}">${esc(p)}</button> `).join("")}${audioControls(ex)}<div id="ann" class="annotation"></div></div><p class="micro">Pulsa una parte del ejemplo para ver qué función cumple.</p>`);
 h+=section(8,meta.sections[8],`<p class="sub">Responde, revisa el feedback y vuelve a intentar si lo necesitas.</p>${quizHtml(d.quiz)}`);
 h+=section(9,meta.sections[9],`<p class="lead">${esc(d.practice.text)}</p><div class="requirements"><b>Tu respuesta debe:</b><ul>${d.practice.req.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><p><b>Estructuras de apoyo:</b></p><div class="audio">${d.practice.supports.map(x=>`<button class="small support" type="button" data-text="${esc(x)}">${esc(x)}</button>`).join("")}</div><label for="practiceText">Tu respuesta${level==="a2"?" / Your response":""}</label><textarea id="practiceText" placeholder="${level==="a2"?"Escribe 3–4 frases. / Write 3–4 sentences.":level==="b1"?"Escribe una respuesta de 5–7 frases.":"Redacta una intervención completa y estratégica."}"></textarea><button id="practiceDoneBtn" class="btn primary" type="button">He preparado mi respuesta${level==="a2"?" / I prepared my response":""}</button><div id="practiceDoneFeedback" class="feedback" aria-live="polite"></div>`);
 h+=section(10,meta.sections[10],`<button id="modelBtn" class="btn primary" type="button">Ver una posible respuesta</button><div id="model" class="model"><p><b>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</b></p><p>${esc(d.model)}</p>${audioControls(d.model)}${level!=="a2"?`<p class="micro">Compárala con la tuya: observa qué parte reconoce la posición contraria, dónde aparece el desacuerdo, cómo se justifica y qué recurso se utiliza para proponer una salida.</p>`:""}</div>`);
 h+=section(11,meta.sections[11],`<p>Antes de terminar, comprueba:</p><div class="checklist">${d.checks.map((x,i)=>`<label class="check"><input type="checkbox" class="checkin"><span>${esc(x)}</span></label>`).join("")}</div><div class="checktrack"><div id="checkbar" class="checkbar"></div></div><p id="checktext" class="micro">0 de ${d.checks.length} completados</p><div id="ready" class="ready"><h3>🎯 Ya estás listo para practicar</h3><p>Durante los próximos siete días encontrarás retos relacionados con esta habilidad. No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.${level==="a2"?" / During the next seven days, you will find challenges related to this skill. You do not need to memorize everything. Repetition and adaptation are part of the training.":""}</p><!-- Inserta aquí la URL real del reto diario cuando esté disponible --><a class="btn red" href="#">🔥 Ir al reto de hoy</a></div>`);
 document.getElementById("lesson").innerHTML=h; bind(); updateProgress(); updateBuilder();
}
function annText(i){
 const notes={
  a2:["Reconoce primero la idea de la otra persona.","Expresa el desacuerdo y da una razón concreta.","Propone una alternativa para que la conversación avance."],
  b1:["Reconoce el objetivo compartido antes de discrepar.","Introduce una reserva clara sin rechazar toda la propuesta.","Justifica la posición mediante una consecuencia concreta.","Propone una alternativa viable y orientada a la decisión."],
  b2:["Establece terreno común y reconoce el valor del objetivo contrario.","Delimita exactamente el objeto del desacuerdo.","Explica la consecuencia estratégica de aceptar la propuesta tal como está.","Reformula el marco y condiciona la decisión a criterios verificables."]
 };
 const A=notes[level]||[]; return A[Math.min(i,Math.max(0,A.length-1))]||"Observa qué función cumple esta parte dentro de la intervención.";
}
function updateBuilder(){
 const sels=[...document.querySelectorAll(".build-select")];if(!sels.length)return;
 const txt=sels.map(s=>s.value).join(" ");document.getElementById("buildResult").textContent=txt;
 const ba=document.getElementById("buildAudio"); if(ba) ba.innerHTML=audioControls(txt);
}
function markCompleted(id){ completed.add(id); updateProgress(); }
function updateProgress(){
 visited.add(current);
 const sectionActions=[...visited].map(i=>`section-${i}`);
 sectionActions.forEach(id=>completed.add(id));
 const total=level==="a2"?29:28;
 const p=Math.min(100,Math.round(completed.size/total*100));
 document.getElementById("bar").style.width=p+"%";
 document.getElementById("pct").textContent=p+"%";
}
function go(i){current=Math.max(0,Math.min(11,i));render();window.scrollTo({top:0,behavior:"smooth"})}
function bind(){
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>go(+b.dataset.go));
 document.querySelectorAll(".prev").forEach(b=>b.onclick=()=>go(current-1));document.querySelectorAll(".next").forEach(b=>b.onclick=()=>go(current+1));
 document.querySelectorAll(".card-head").forEach(b=>b.onclick=()=>{b.parentElement.classList.toggle("open");if(b.parentElement.classList.contains("open")) markCompleted("vocabulario");});
 document.querySelectorAll(".when-btn").forEach(b=>b.onclick=()=>{b.closest(".phrase").querySelector(".when").classList.toggle("show");markCompleted("frases");});
 document.querySelectorAll(".accordion>button").forEach(b=>b.onclick=()=>{b.parentElement.classList.toggle("open");if(b.parentElement.classList.contains("open")) markCompleted("gramatica");});
 document.querySelectorAll(".build-select").forEach(s=>s.onchange=()=>{updateBuilder();markCompleted("constructor");});
 document.querySelectorAll(".reg").forEach(b=>b.onclick=()=>{
   const d=data[level],i=+b.dataset.r;document.querySelectorAll(".reg").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
   const f=document.getElementById("regFeedback");f.textContent=d.register.options[i][1];f.className="feedback show "+(i===d.register.best?"good":"warn");markCompleted("registro");
 });
 document.querySelectorAll(".annotated").forEach(b=>b.onclick=()=>{const a=document.getElementById("ann");a.textContent=annText(+b.dataset.ann);a.classList.add("show");markCompleted("ejemplo")});
 document.querySelectorAll(".quiz .option[data-choice]").forEach(b=>b.onclick=()=>{
   const card=b.closest(".quiz"),q=data[level].quiz[+card.dataset.q],choice=+b.dataset.choice;card.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
   const ok=choice===q.best||(Array.isArray(q.also)&&q.also.includes(choice));
   const f=card.querySelector(".feedback");f.textContent=(ok?"Esta formulación funciona bien. ":"Revisa el efecto de esta formulación. ")+q.fb;f.className="feedback show "+(ok?"good":"warn");if(ok)markCompleted(`quiz-${card.dataset.q}`);
 });
 document.querySelectorAll(".recall").forEach(b=>b.onclick=()=>{const f=b.closest(".quiz").querySelector(".feedback");f.textContent=b.dataset.ok==="1"?"Sí: «no estar de acuerdo» = to disagree.":"Intenta otra vez. Busca la expresión para indicar una opinión diferente.";f.className="feedback show "+(b.dataset.ok==="1"?"good":"warn");if(b.dataset.ok==="1")markCompleted("recall")});
 document.querySelectorAll(".support").forEach(b=>{if(level==="a2")b.onclick=()=>speak(b.dataset.text,1)});
 const mb=document.getElementById("modelBtn");if(mb)mb.onclick=()=>{const m=document.getElementById("model");m.classList.toggle("show");if(m.classList.contains("show"))markCompleted("modelo");};
 const pdb=document.getElementById("practiceDoneBtn");if(pdb)pdb.onclick=()=>{const t=document.getElementById("practiceText").value.trim(),f=document.getElementById("practiceDoneFeedback");if(!t){f.textContent=level==="a2"?"Escribe primero tu respuesta. / Write your response first.":"Escribe primero tu respuesta.";f.className="feedback show warn";return}f.textContent=level==="a2"?"Respuesta preparada. Ahora compárala con el modelo. / Response prepared. Now compare it with the model.":"Respuesta preparada. Ahora compárala con el modelo.";f.className="feedback show good";markCompleted("practica");};
 const checks=[...document.querySelectorAll(".checkin")];checks.forEach((c,i)=>c.onchange=()=>{if(c.checked)completed.add(`check-${i}`);else completed.delete(`check-${i}`);const n=checks.filter(x=>x.checked).length,p=Math.round(n/checks.length*100);document.getElementById("checkbar").style.width=p+"%";document.getElementById("checktext").textContent=`${n} de ${checks.length} completados`;document.getElementById("ready").classList.toggle("show",n===checks.length);updateProgress();});
}
document.querySelectorAll(".level-btn").forEach(b=>b.onclick=()=>{level=b.dataset.level;current=0;visited=new Set();completed=new Set();document.getElementById("gate").classList.add("hidden");document.getElementById("app").classList.remove("hidden");render()});
document.getElementById("change").onclick=()=>{window.speechSynthesis?.cancel?.();document.getElementById("app").classList.add("hidden");document.getElementById("gate").classList.remove("hidden");window.scrollTo(0,0)};
</script>

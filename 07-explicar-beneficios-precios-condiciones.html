function audioButtons(text){
  if(currentLevel!=="a2") return "";
  const safe=esc(text);
  return `<div class="audio-row"><button type="button" class="audio-btn" data-speak="${safe}" data-rate="0.96" aria-label="Escuchar a velocidad normal: ${safe}">🔊 Escuchar / Listen</button><button type="button" class="audio-btn" data-speak="${safe}" data-rate="0.72" aria-label="Escuchar lentamente: ${safe}">🐢 Lento / Slow</button></div>`;
}

function selectSpanishVoice(){
  if(!("speechSynthesis" in window)) return null;
  const voices=window.speechSynthesis.getVoices()||[];
  const exact=["es-CO","es-MX","es-US","es-419"];
  for(const lang of exact){
    const found=voices.find(v=>(v.lang||"").toLowerCase()===lang.toLowerCase());
    if(found) return found;
  }
  return voices.find(v=>/^es[-_]/i.test(v.lang||""))||null;
}
function refreshVoices(){availableVoice=selectSpanishVoice();}
if("speechSynthesis" in window){
  refreshVoices();
  window.speechSynthesis.addEventListener?.("voiceschanged",refreshVoices);
}
function showAudioStatus(message){
  const box=$("#audioStatus");
  if(!box) return;
  box.textContent=message;
  box.classList.remove("hidden");
  clearTimeout(audioStatusTimer);
  audioStatusTimer=setTimeout(()=>box.classList.add("hidden"),3500);
}
function speak(text,rate=0.96){
  if(!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance!=="function"){
    showAudioStatus("El audio no está disponible en este navegador. El resto del módulo funciona normalmente.");
    return;
  }
  window.speechSynthesis.cancel();
  const u=new window.SpeechSynthesisUtterance(text);
  refreshVoices();
  u.lang=availableVoice?.lang||"es-CO";
  if(availableVoice) u.voice=availableVoice;
  u.rate=rate;
  window.speechSynthesis.speak(u);
}

function buildTargets(){
  targets.clear();

  sectionsMeta.forEach(([id])=>targets.add(`section:${id}`));

  d.phrases.forEach((_,i)=>targets.add(`phrase:${i}`));
  if(currentLevel==="a2") targets.add("vocab:recovery");
  targets.add("builder");
  targets.add("register");
  d.quiz.forEach((_,i)=>targets.add(`quiz:${i}`));
  targets.add("practice");
  targets.add("model-answer");
  d.checklist.forEach((_,i)=>targets.add(`check:${i}`));
}
function resetState(){
  completed.clear();
  selectedBuilder=[];
  quizDone.clear();
  buildTargets();
  updateProgress();
}
function mark(key){
  if(targets.has(key)) completed.add(key);
  updateProgress();
}
function unmark(key){
  completed.delete(key);
  updateProgress();
}
function updateProgress(){
  const total=targets.size||1;
  const pct=Math.round((completed.size/total)*100);
  if($("#progressBar")) $("#progressBar").style.width=pct+"%";
  if($("#progressLabel")) $("#progressLabel").textContent=pct+" %";
}

  const groups={};
  d.phrases.forEach(p=>(groups[p.group]??=[]).push(p));
  const phraseHtml=Object.entries(groups).map(([g,items])=>`<div class="phrase-group"><h3>${esc(g)}</h3>${items.map(p=>{const idx=phraseIndex++;return `<div class="phrase"><div class="phrase-line">${esc(p.text)}</div>${currentLevel==='a2'&&p.en?`<div class="small">${esc(p.en)}</div>`:''}${audioButtons(p.text)}<button type="button" class="use-btn" data-phrase="${idx}" aria-expanded="false">Ver cuándo usarla</button><div class="reveal hidden">${esc(p.use)}</div></div>`}).join("")}</div>`).join("");
  html+=sec("frases",sectionsMeta[3][1],"Expresiones según su función",phraseHtml);

  const builderRows=d.builder.rows.map((r,ri)=>`<div class="builder-row"><strong>${esc(r.label)}</strong><div class="token-wrap">${r.options.map(o=>`<button type="button" class="token builder-token" data-row="${ri}" data-value="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("");
  html+=sec("construye",sectionsMeta[4][1],"Organiza tu explicación",`<p>${esc(d.builder.intro)}</p><div class="builder">${builderRows}<div id="builderOutput" class="builder-output" aria-live="polite">Selecciona una opción en cada paso.</div><div id="builderAudio"></div></div>`);

  html+=sec("gramatica",sectionsMeta[5][1],"Solo la gramática que necesitas para esta habilidad",d.grammar.map(g=>`<details class="grammar-item"><summary>${esc(g.title)}</summary><p>${g.body}</p>${g.audio?audioButtons(g.audio):''}</details>`).join(""));
  html+=sec("registro",sectionsMeta[6][1],"¿Qué formulación encaja mejor?",`<div class="scenario"><p><strong>Situación:</strong> ${esc(d.register.prompt)}</p><div>${d.register.options.map((o,i)=>`<button type="button" class="choice-btn register-option" data-index="${i}">${esc(o.text)}</button>`).join("")}</div><div id="registerAudio">${currentLevel==='a2'?d.register.options.map(o=>audioButtons(o.text)).join(''):''}</div><div id="registerFeedback" class="feedback hidden" aria-live="polite"></div></div>`);

  const modelBlocks=d.modelo.blocks&&currentLevel==='a2'?`<div class="meaning-blocks">${d.modelo.blocks.map(b=>`<div class="meaning-block">${esc(b)}${audioButtons(b)}</div>`).join("")}</div>`:'';
  html+=sec("modelo",sectionsMeta[7][1],"Una explicación profesional completa",`<div class="callout">${esc(d.modelo.text)}</div>${audioButtons(d.modelo.text)}${modelBlocks}`);
  html+=sec("comprueba",sectionsMeta[8][1],"Mini práctica antes de producir",`<div id="quizArea">${d.quiz.map((q,i)=>renderQuiz(q,i)).join("")}</div>`);
  html+=sec("practica",sectionsMeta[9][1],"Escribe tu propia respuesta",`<div class="practice-box">${d.practica}${currentLevel==='a2'?`<div class="audio-row">${["El servicio incluye","Esto le permite","El precio es de","Puede cancelar"].map(x=>audioButtons(x)).join("")}</div>`:''}<label for="practiceText"><strong>Tu respuesta</strong></label><textarea id="practiceText" placeholder="Escribe aquí..."></textarea><p class="status-note">Tu respuesta es abierta: compárala con el modelo, no se evaluará automáticamente.</p></div>`);
  html+=sec("modelo-respuesta",sectionsMeta[10][1],"Compara tus decisiones",`<button type="button" id="showModel" class="primary-btn" aria-expanded="false">Ver una posible respuesta</button><div id="modelAnswer" class="model-box hidden"><p class="meta"><strong>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</strong></p><div class="callout">${esc(d.modelAnswer)}</div>${audioButtons(d.modelAnswer)}</div>`);
  html+=sec("checklist",sectionsMeta[11][1],"Antes de terminar, comprueba",`<div class="checklist">${d.checklist.map((x,i)=>`<label class="check-item"><input type="checkbox" data-check="${i}"><span>${esc(x)}</span></label>`).join("")}</div><div id="finalReady" class="final-box hidden"><h2>🎯 Ya estás listo para practicar</h2><p>No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p><!-- Sustituir href cuando exista la URL específica del reto de hoy --><a class="cta-link" href="#" onclick="return false;">🔥 Ir al reto de hoy</a></div>`);

  $("#sections").innerHTML=html;
  wire();
  setupObserver();
  updateProgress();
}

function renderQuiz(q,i){
  const questionAudio=currentLevel==='a2' && q.audio ? audioButtons(q.audio) : '';
  if(q.type==='mc'){
    return `<div class="quiz-item" data-q="${i}"><p><strong>${i+1}. ${esc(q.q)}</strong></p>${questionAudio}${q.options.map((o,j)=>`<div class="quiz-option-row"><button type="button" class="choice-btn quiz-choice" data-q="${i}" data-opt="${j}">${esc(o)}</button>${currentLevel==='a2'?audioButtons(o):''}</div>`).join("")}<div class="feedback hidden" id="qfb${i}" aria-live="polite"></div></div>`;
  }
  return `<div class="quiz-item" data-q="${i}"><p><strong>${i+1}. ${esc(q.q)}</strong></p>${questionAudio}<div class="fill-row"><label class="sr-only" for="fill${i}">Respuesta ${i+1}</label><input aria-label="Respuesta ${i+1}" id="fill${i}"><button type="button" class="primary-btn fill-check" data-q="${i}">Comprobar</button></div><div class="feedback hidden" id="qfb${i}" aria-live="polite"></div></div>`;
}

function wire(){
  document.querySelectorAll('.vocab-toggle').forEach(b=>b.addEventListener('click',()=>{
    const card=b.closest('.flip-card');
    const r=card.querySelector('.reveal');
    r.classList.toggle('hidden');
    b.setAttribute('aria-expanded',String(!r.classList.contains('hidden')));
    mark(`vocab:${card.dataset.vocab}`);
  }));
  document.querySelectorAll('.use-btn').forEach(b=>b.addEventListener('click',()=>{
    const r=b.nextElementSibling;
    r.classList.toggle('hidden');
    b.setAttribute('aria-expanded',String(!r.classList.contains('hidden')));
    mark(`phrase:${b.dataset.phrase}`);
  }));
  document.querySelectorAll('.audio-btn').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.speak,Number(b.dataset.rate))));
  document.querySelectorAll('.vocab-recovery').forEach(b=>b.addEventListener('click',()=>{
    const fb=$("#vocabFeedback");
    fb.classList.remove('hidden');
    const ok=b.dataset.ok==='true';
    fb.textContent=ok?'Sí. «Coste adicional» corresponde a “additional cost”.':'Prueba otra vez. Piensa en un importe que se paga aparte.';
    if(ok) mark('vocab:recovery');
  }));
  document.querySelectorAll('.builder-token').forEach(b=>b.addEventListener('click',()=>{
    const r=Number(b.dataset.row);
    selectedBuilder[r]=b.dataset.value;
    document.querySelectorAll(`.builder-token[data-row="${r}"]`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderBuilder();
  }));
  document.querySelectorAll('.register-option').forEach(b=>b.addEventListener('click',()=>{
    const o=contenido[currentLevel].register.options[Number(b.dataset.index)];
    document.querySelectorAll('.register-option').forEach(x=>x.classList.remove('selected','good','warn'));
    b.classList.add('selected',o.kind);
    const fb=$("#registerFeedback");
    fb.classList.remove('hidden');
    fb.textContent=o.feedback;
    mark('register');
  }));
  document.querySelectorAll('.quiz-choice').forEach(b=>b.addEventListener('click',()=>checkMC(b)));
  document.querySelectorAll('.fill-check').forEach(b=>b.addEventListener('click',()=>checkFill(Number(b.dataset.q))));
  $("#practiceText").addEventListener('input',e=>{
    if(e.target.value.trim().length>=20) mark('practice'); else unmark('practice');
  });
  $("#showModel").addEventListener('click',e=>{
    const box=$("#modelAnswer");
    box.classList.toggle('hidden');
    e.currentTarget.setAttribute('aria-expanded',String(!box.classList.contains('hidden')));
    if(!box.classList.contains('hidden')) mark('model-answer');
  });
  document.querySelectorAll('.check-item input').forEach(c=>c.addEventListener('change',()=>{
    const key=`check:${c.dataset.check}`;
    c.checked?mark(key):unmark(key);
    const all=[...document.querySelectorAll('.check-item input')];
    $("#finalReady").classList.toggle('hidden',!all.every(x=>x.checked));
  }));
  document.querySelectorAll('.next-sec').forEach((b,i)=>b.addEventListener('click',()=>{
    const n=sectionsMeta[i+1];
    if(n) document.getElementById(n[0]).scrollIntoView({behavior:'smooth',block:'start'});
  }));
  document.querySelectorAll('.prev-sec').forEach((b,i)=>b.addEventListener('click',()=>{
    const p=sectionsMeta[i-1];
    if(p) document.getElementById(p[0]).scrollIntoView({behavior:'smooth',block:'start'});
  }));
}

function renderBuilder(){
  const d=contenido[currentLevel];
  let text='';
  d.builder.rows.forEach((r,i)=>{if(selectedBuilder[i]) text+=r.prefix+selectedBuilder[i]});
  const out=$("#builderOutput");
  out.textContent=text||'Selecciona una opción en cada paso.';
  if(text&&currentLevel==='a2') $("#builderAudio").innerHTML=audioButtons(text); else $("#builderAudio").innerHTML='';
  document.querySelectorAll('#builderAudio .audio-btn').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.speak,Number(b.dataset.rate))));
  if(selectedBuilder.filter(Boolean).length===d.builder.rows.length) mark('builder'); else unmark('builder');
}

function checkMC(b){
  const qi=Number(b.dataset.q),oi=Number(b.dataset.opt),q=contenido[currentLevel].quiz[qi],fb=$("#qfb"+qi);
  const valid=Array.isArray(q.answer)?q.answer.includes(oi):oi===q.answer;
  document.querySelectorAll(`.quiz-choice[data-q="${qi}"]`).forEach(x=>x.classList.remove('good','warn'));
  b.classList.add(valid?'good':'warn');
  fb.classList.remove('hidden');
  fb.textContent=(valid?'Puede funcionar. ':'Prueba otra vez. ')+q.exp;
  if(valid){quizDone.add(qi);mark(`quiz:${qi}`)}
}
function normalizeAnswer(value){return value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function checkFill(qi){
  const q=contenido[currentLevel].quiz[qi],val=normalizeAnswer($("#fill"+qi).value),ans=normalizeAnswer(q.answer),fb=$("#qfb"+qi);
  fb.classList.remove('hidden');
  if(val===ans){fb.textContent='Funciona. '+q.exp;quizDone.add(qi);mark(`quiz:${qi}`)}else fb.textContent='Prueba otra vez. '+q.exp;
}
function setupObserver(){
  if(window._obs) window._obs.disconnect();
  window._obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        mark(`section:${e.target.id}`);
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.target===e.target.id));
      }
    });
  },{threshold:.35});
  document.querySelectorAll('.trackable').forEach(s=>window._obs.observe(s));
}
function choose(level){
  currentLevel=level;
  resetState();
  $("#levelScreen").classList.add('hidden');
  $("#module").classList.remove('hidden');
  render();
  window.scrollTo({top:0,behavior:'auto'});
}
document.querySelectorAll('.level-btn').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.level)));
$("#changeLevel").addEventListener('click',()=>{
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  $("#module").classList.add('hidden');
  $("#levelScreen").classList.remove('hidden');
  currentLevel=null;
  completed.clear();
  targets.clear();
  window.scrollTo({top:0,behavior:'auto'});
  document.querySelector('.level-btn[data-level="a2"]')?.focus();
});
</script>
</body>
</html>

.hero-card{max-width:1120px;margin:auto}

main{max-width:1120px;margin:auto;padding:14px 18px 60px}
.section{scroll-margin-top:96px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:18px 0;box-shadow:0 4px 18px rgba(14,32,73,.04)}

.context-grid,.cards,.phrase-grid,.grammar-grid,.example-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.context-item{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:14px}

.flip{border:1px solid var(--line);border-radius:16px;background:#fff;padding:0;overflow:hidden}

.audio-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.audio-btn{border:1px solid #bfd0ee;background:#eef4ff;color:#153e7d;border-radius:10px;padding:7px 10px;font-size:.9rem}

.reveal{margin-top:9px;border:0;background:#eef4ff;color:var(--blue);border-radius:9px;padding:7px 9px}

label{font-weight:700}
select,input[type=text],textarea{width:100%;border:1px solid #bfc9d9;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}

.output{background:#fff;border:2px dashed #9db4db;border-radius:12px;padding:14px;min-height:56px}

.exercise{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}

.exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.practice-box{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:16px}
.requirements{padding-left:20px}
.supports{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.support-chip{background:#eef4ff;color:#163c7b;border:1px solid #c9d7ed;border-radius:999px;padding:7px 10px}

.model{display:none;margin-top:14px;border-left:4px solid var(--blue);background:#f4f7fd;padding:14px;border-radius:10px}

.checklist{display:grid;gap:10px}
.check-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:11px}
.check-item input{margin-top:4px;transform:scale(1.25)}
.check-progress{height:12px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin:14px 0}
.check-progress>div{height:100%;width:0;background:var(--blue);transition:.2s}
.finish{display:none;text-align:center;background:linear-gradient(135deg,#edf3ff,#fff7c9);border:1px solid #cddaf1;border-radius:16px;padding:22px;margin-top:16px}
.finish.show{display:block}
.challenge{display:inline-block;margin-top:10px;text-decoration:none;background:var(--red);color:#fff;font-weight:900;padding:11px 16px;border-radius:10px}

@media(max-width:760px){
  .level-grid,.context-grid,.cards,.phrase-grid,.grammar-grid,.example-grid,.builder-row{grid-template-columns:1fr}
  .level-card{padding:24px 18px}.level-btn{min-height:auto}
  .progress-wrap{width:100%;min-width:0;margin-left:0}
  .section{padding:18px}
  .topbar-inner{align-items:stretch}
}
</style>

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  const rank = voice => {
    const lang = (voice.lang || '').toLowerCase();
    const name = (voice.name || '').toLowerCase();
    if(lang.startsWith('es-co')) return 100;
    if(lang.startsWith('es-419') || lang.startsWith('es-mx') || lang.startsWith('es-us')) return 90;
    if(lang.startsWith('es-')) return 75;
    if(lang === 'es') return 65;
    if(name.includes('spanish') || name.includes('español')) return 50;
    return 0;
  };
  spanishVoice = voices.filter(v => rank(v) > 0).sort((a,b) => rank(b)-rank(a))[0] || null;
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speakSpanish(text, rate=1){
  const status = $('#audioStatus');
  if(!('speechSynthesis' in window)){
    if(status) status.textContent = 'La síntesis de voz no está disponible en este navegador.';
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = spanishVoice?.lang || 'es-CO';
  utterance.rate = Number(rate) || 1;
  if(spanishVoice) utterance.voice = spanishVoice;
  utterance.onstart = () => { if(status) status.textContent = 'Reproduciendo audio…'; };
  utterance.onend = () => { if(status) status.textContent = ''; };
  utterance.onerror = () => { if(status) status.textContent = 'No fue posible reproducir el audio.'; };
  window.speechSynthesis.speak(utterance);
}

function audioControls(text, key){
  if(currentLevel !== 'a2') return '';
  const safeText = escapeHTML(text);
  const safeKey = escapeHTML(key);
  return `<div class="audio-row">
    <button class="audio-btn" data-speak="${safeText}" data-rate="1" data-progress-key="${safeKey}"
      aria-label="Escuchar: ${safeText}">🔊 Escuchar / Listen</button>
    <button class="audio-btn" data-speak="${safeText}" data-rate="0.76" data-progress-key="${safeKey}"
      aria-label="Escuchar lento: ${safeText}">🐢 Lento / Slow</button>
  </div>`;
}

function markProgress(key){
  if(!completed.has(key)){
    completed.add(key);
    updateProgress();
  }
}
function updateProgress(){
  const pct = Math.min(100, Math.round((completed.size / totalProgressActions) * 100));
  progressBar.style.width = pct + '%';
  progressText.textContent = pct + '%';
}

function section(id, title, body){
  return `<section id="${id}" class="section tracked-section"><h2>${title}</h2>${body}</section>`;
}

function selectLevel(level){
  currentLevel = level;
  completed = new Set();
  const data = contenido[level];
  routePill.textContent = 'Tu ruta: ' + data.ruta;
  $('#heroTitle').textContent = contenido.meta.habilidad;
  $('#heroIntro').textContent = contenido.meta.intro;
  levelScreen.classList.add('hidden');
  app.classList.remove('hidden');
  renderLesson(data);
  window.scrollTo(0,0);
}

      <p id="checkProgressText" class="small">0 de ${data.checklist.length} completados</p>
      <div id="finishBox" class="finish">
        <h3>🎯 Ya estás listo para practicar</h3>
        <p>No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p>
        <!-- Sustituir # por la URL real del reto diario cuando esté disponible. -->
        <a class="challenge" href="#">🔥 Ir al reto de hoy</a>
      </div>
    `);

  sectionNav.innerHTML = contenido.meta.secciones
    .map((name,i)=>`<a href="#s${i+1}">${escapeHTML(name)}</a>`).join('');

  updateProgress();
  bindInteractions(data);
  setupSectionObserver();
}

function extractExample(text){
  const match = text.match(/«([^»]+)»/g);
  if(!match || !match.length) return text;
  return match[match.length-1].replace(/[«»]/g,'');
}

function fillBuilderSecond(data){
  const first = $('#builderFirst').value;
  $('#builderSecond').innerHTML = data.builder.second[first]
    .map(v=>`<option>${escapeHTML(v)}</option>`).join('');
}

function bindInteractions(data){
  $$('[data-flip]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const card=btn.closest('.flip');
      const open=card.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      if(open) markProgress(btn.dataset.progressKey);
    });
  });

  $$('[data-reveal]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      btn.nextElementSibling.classList.toggle('show');
      markProgress(btn.dataset.progressKey);
    });
  });

  $('#builderFirst').addEventListener('change',()=>fillBuilderSecond(data));
  $('#buildMessage').addEventListener('click',()=>{
    const first=$('#builderFirst').value;
    const second=$('#builderSecond').value;
    const template=data.builder.templates[first];
    const result=template.replace('{x}',second);
    $('#builderOutput').textContent=result;
    $('#builderAudio').innerHTML=audioControls(result,'audio-builder-result');
    bindAudioButtons($('#builderAudio'));
    markProgress('builder');
  });

  $$('[data-register]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      $$('[data-register]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      const option=data.registro.opciones[Number(btn.dataset.register)];
      const fb=$('#registerFeedback');
      fb.textContent=option.fb;
      fb.classList.toggle('good',Boolean(option.good));
      markProgress('register');
    });
  });

  $$('[data-example-part]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const part=data.ejemplo.partes[Number(btn.dataset.examplePart)];
      $('#examplePartFeedback').textContent=`«${part[0]}» → ${part[1]}.`;
    });
  });

  $$('[data-check-ex]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.checkEx);
      const picked=$(`input[name="ex-${i}"]:checked`);
      const fb=$(`#feedback-${i}`);
      if(!picked){
        fb.textContent='Selecciona una opción antes de comprobar.';
        fb.classList.remove('good');
        return;
      }
      const chosen=Number(picked.value);
      const ex=data.ejercicios[i];
      if(chosen===ex.correct){
        fb.textContent='Funciona. '+ex.why;
        fb.classList.add('good');
        markProgress(`exercise-${i}`);
      }else{
        fb.textContent='Revisa la relación que quieres expresar. '+ex.why;
        fb.classList.remove('good');
      }
    });
  });

  $$('[data-reset-ex]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.resetEx);
      $$(`input[name="ex-${i}"]`).forEach(r=>r.checked=false);
      const fb=$(`#feedback-${i}`);
      fb.textContent='Elige una opción y comprueba tu respuesta.';
      fb.classList.remove('good');
    });
  });

  $('#savePractice').addEventListener('click',()=>{
    const text=$('#practiceText').value.trim();
    const fb=$('#practiceFeedback');
    if(text.length<12){
      fb.textContent='Escribe una respuesta un poco más completa antes de marcar la práctica.';
      fb.classList.remove('good');
      return;
    }
    fb.textContent='Práctica registrada en este módulo. Ahora compárala con una posible respuesta.';
    fb.classList.add('good');
    markProgress('practice');
  });

  $('#showModel').addEventListener('click',()=>{
    $('#modelBox').classList.add('show');
    markProgress('model');
  });

  $$('[data-check]').forEach(box=>{
    box.addEventListener('change',()=>{
      const checked=$$('[data-check]:checked').length;
      const total=data.checklist.length;
      $('#checkProgressBar').style.width=Math.round(checked/total*100)+'%';
      $('#checkProgressText').textContent=`${checked} de ${total} completados`;
      if(box.checked) markProgress(`check-${box.dataset.check}`);
      $('#finishBox').classList.toggle('show',checked===total);
    });
  });

  bindAudioButtons(document);
}

function bindAudioButtons(root){
  $$('[data-speak]',root).forEach(btn=>{
    const activate=()=>{
      speakSpanish(btn.dataset.speak,btn.dataset.rate);
      if(currentLevel==='a2'){
        const audioKeys=[...completed].filter(x=>x.startsWith('audio-'));
        if(audioKeys.length<8) markProgress(btn.dataset.progressKey);
      }
    };
    if(btn.tagName==='BUTTON'){
      btn.addEventListener('click',activate);
    }else{
      btn.addEventListener('click',e=>{e.stopPropagation();activate();});
      btn.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();activate();}
      });
    }
  });
}

function setupSectionObserver(){
  observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) markProgress(`section-${entry.target.id}`);
    });
  },{threshold:0.35});
  $$('.tracked-section').forEach(sec=>observer.observe(sec));
}

$$('.level-btn').forEach(btn=>btn.addEventListener('click',()=>selectLevel(btn.dataset.level)));
$('#changeLevel').addEventListener('click',()=>{
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  if(observer) observer.disconnect();
  app.classList.add('hidden');
  levelScreen.classList.remove('hidden');
  currentLevel=null;
  window.scrollTo(0,0);
});
</script>
</body>

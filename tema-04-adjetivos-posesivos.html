<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Módulo interactivo de Business Spanish sobre adjetivos posesivos aplicado al trabajo.">
<title>04 · Adjetivos posesivos | La Oficina en Español</title>
<style>
:root{
  --blue:#003893;--blue-2:#062b6f;--yellow:#FCD116;--red:#CE1126;--white:#fff;--black:#111;
  --ink:#172033;--muted:#5e6878;--bg:#f5f7fb;--line:#dfe5ef;--soft:#eef4ff;--ok:#176b43;--warn:#8a5a00;
  --radius:18px;--shadow:0 12px 34px rgba(0,56,147,.11);
  --title:"Arial Black","Arial Bold",Arial,sans-serif;--body:Montserrat,Inter,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.55}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select{outline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(0,56,147,.35)}
a{color:var(--blue)}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===== PANTALLA DE NIVEL ===== */
#levelGate{min-height:100vh;display:grid;place-items:center;padding:28px;background:
  radial-gradient(circle at 15% 10%,rgba(252,209,22,.24),transparent 34%),
  radial-gradient(circle at 90% 82%,rgba(0,56,147,.18),transparent 40%),#f6f8fc}
.gate-shell{width:min(1120px,100%)}
.brandline{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--blue);font-weight:900;letter-spacing:.01em}
.brandmark{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--title);box-shadow:inset 0 -5px 0 var(--yellow)}
.gate-panel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,4vw,48px)}
.gate-panel h1{font-family:var(--title);color:var(--blue);font-size:clamp(2rem,4vw,3.5rem);line-height:1.05;margin:0 0 12px}
.gate-panel>p{color:var(--muted);max-width:760px;margin:0 0 28px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.level-choice{appearance:none;border:2px solid var(--line);background:#fff;border-radius:20px;padding:22px;text-align:left;cursor:pointer;min-height:220px;transition:.2s ease;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.level-choice:hover,.level-choice:focus-visible{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,56,147,.1)}
.level-choice .emoji{font-size:2rem}.level-choice strong{font-size:1.18rem;color:var(--blue)}.level-choice span:last-child{color:var(--muted)}

/* ===== APP ===== */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1220px;margin:auto;padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.mini-brand{font-weight:900;color:var(--blue);white-space:nowrap}.mini-brand a{text-decoration:none;color:inherit}
.progress-area{display:grid;gap:4px}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted)}
.progress-track{height:9px;border-radius:999px;background:#e7ebf2;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#2e65c1);transition:width .3s ease}
.route-actions{display:flex;align-items:center;gap:10px}.route-chip{border-radius:999px;background:var(--soft);color:var(--blue);font-size:.82rem;font-weight:800;padding:8px 10px;white-space:nowrap}.change-level{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.layout{max-width:1220px;margin:0 auto;padding:26px 18px 56px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}
.sidebar{position:sticky;top:86px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 20px rgba(25,40,65,.04);max-height:calc(100vh - 110px);overflow:auto}
.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;color:#3b4657;font-size:.88rem}.nav-btn:hover{background:#f4f7fb}.nav-btn.active{background:var(--soft);color:var(--blue);font-weight:800}
.main{min-width:0}.hero{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;border-radius:24px;padding:clamp(24px,4vw,42px);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:22px}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(252,209,22,.17);right:-60px;top:-70px}.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-weight:800;font-size:.78rem;color:#dce7ff}.hero h1{font-family:var(--title);font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.04;margin:.35rem 0 .7rem;max-width:820px}.hero p{max-width:820px;color:#e7efff;font-size:1.02rem;margin:0}.hero .topic-pill{display:inline-block;background:var(--yellow);color:#141414;font-weight:900;border-radius:999px;padding:7px 11px;margin-top:18px}
.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3.5vw,32px);margin-bottom:18px;box-shadow:0 8px 26px rgba(25,40,65,.04);scroll-margin-top:92px}
.section h2{font-family:var(--title);color:var(--blue);font-size:clamp(1.35rem,2.5vw,1.8rem);margin:0 0 8px}.section h3{color:var(--blue);margin:1.2rem 0 .5rem}.lede{color:var(--muted);margin-top:0}.note{border-left:4px solid var(--yellow);background:#fffbe8;padding:12px 14px;border-radius:8px;margin:14px 0}.level-note{background:var(--soft);border:1px solid #cddcf5;border-radius:14px;padding:14px;margin:14px 0}.level-note strong{color:var(--blue)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px}.fact b{display:block;color:var(--blue);margin-bottom:3px}

/* Interactive cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vocab-card{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.vocab-head{width:100%;border:0;background:#f8fafc;padding:16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--ink)}.vocab-head strong{font-size:1.05rem;color:var(--blue)}.vocab-body{display:none;padding:0 16px 16px}.vocab-card.open .vocab-body{display:block}.reveal-symbol{font-weight:900;color:var(--blue)}
.tag{display:inline-block;background:#eef4ff;color:var(--blue);border-radius:999px;padding:4px 8px;font-size:.78rem;font-weight:800;margin:2px 3px 2px 0}
.audio-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.audio-btn{border:1px solid #cbd8ef;background:#fff;color:var(--blue);padding:7px 10px;border-radius:9px;cursor:pointer;font-size:.82rem;font-weight:800}.audio-btn:hover{background:var(--soft)}
.phrase-group{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.phrase-item{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.phrase-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.phrase-text{font-weight:850}.why-btn,.small-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;cursor:pointer;color:var(--blue);font-weight:800;font-size:.8rem}.phrase-why{display:none;color:var(--muted);padding-top:10px}.phrase-item.open .phrase-why{display:block}
.builder{border:1px solid #cbd8ef;background:#f8fbff;border-radius:16px;padding:16px}.builder-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:.82rem;font-weight:800;color:#465064;margin-bottom:5px}.field select,.field input,.practice textarea{width:100%;border:1px solid #cbd3df;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}.built-output{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:56px;font-weight:800}.primary-btn{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.primary-btn:hover{background:#002e79}.secondary-btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.danger-accent{border-left:4px solid var(--red)}
.grammar-box details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}.grammar-box summary{cursor:pointer;font-weight:850;color:var(--blue)}
.table-wrap{overflow:auto;margin:12px 0}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f6f8fc;color:var(--blue)}

/* activities */
.activity{border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;background:#fff}.activity legend{font-weight:900;color:var(--blue);padding:0 4px}.option{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid transparent;margin:6px 0;cursor:pointer}.option:hover{background:#f8fafc}.option input{margin-top:4px}.feedback{display:none;margin-top:10px;padding:11px 12px;border-radius:10px;background:#f4f7fb;border:1px solid var(--line)}.feedback.show{display:block}.feedback.good{background:#eef8f3;border-color:#b9dfca;color:#155c3b}.feedback.neutral{background:#fff8e8;border-color:#ecd08a;color:#704a00}.retry-btn{margin-top:10px}
.example-box{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:18px}.example-line{padding:8px 10px;border-radius:10px;margin:6px 0;background:#fff;border:1px solid #e5eaf2;cursor:pointer}.example-line .function{display:none;color:var(--muted);font-size:.86rem;margin-top:5px}.example-line.open .function{display:block}
.quiz-block{margin-top:10px}.quiz-question{border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.quiz-question h4{margin:0 0 8px}.quiz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.text-answer{width:100%;border:1px solid #cbd3df;border-radius:10px;padding:10px 11px}.inline-feedback{margin-top:8px;font-size:.9rem;font-weight:750;min-height:1.3em}
.practice textarea{min-height:180px;resize:vertical}.requirements{display:grid;gap:8px;margin:12px 0}.req{display:flex;gap:8px}.support-pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.support-pill{border:1px solid #cbd8ef;background:#eef4ff;color:var(--blue);padding:7px 9px;border-radius:999px;font-size:.82rem;font-weight:800;cursor:pointer}.model{display:none;margin-top:14px;padding:16px;background:#f6f8fc;border:1px solid var(--line);border-radius:14px}.model.open{display:block}
.checklist{display:grid;gap:10px}.check-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px}.check-item input{transform:scale(1.2);margin-top:5px}.ready-box{display:none;margin-top:18px;background:#eef4ff;border:1px solid #cbd8ef;border-radius:16px;padding:18px}.ready-box.show{display:block}.challenge-link{display:inline-flex;margin-top:10px;text-decoration:none;background:var(--red);color:#fff;border-radius:11px;padding:10px 14px;font-weight:900}
.section-footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
footer{max-width:1220px;margin:0 auto 36px;padding:0 18px;text-align:center;color:var(--muted);font-size:.85rem}
.toast{position:fixed;right:18px;bottom:18px;z-index:60;background:#172033;color:#fff;padding:10px 13px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:320px;display:none}.toast.show{display:block}

@media(max-width:960px){
  .level-grid{grid-template-columns:1fr}.level-choice{min-height:auto}
  .layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;max-height:none}.nav-btn{min-width:max-content;width:auto}
  .topbar-inner{grid-template-columns:1fr auto}.progress-area{grid-column:1/-1;grid-row:2}.route-chip{display:none}
}
@media(max-width:680px){
  #levelGate{padding:14px}.gate-panel{border-radius:20px;padding:22px 16px}.level-choice{padding:16px}
  .layout{padding:16px 10px 44px}.section,.hero{border-radius:17px}.cards,.grid-2,.grid-3,.builder-grid{grid-template-columns:1fr}
  .phrase-top{display:block}.why-btn{margin-top:8px}.section-footer{flex-direction:column}.section-footer button{width:100%}
  .mini-brand{font-size:.83rem}.change-level{font-size:.78rem}.topbar-inner{gap:8px;padding:9px 10px}
  .audio-row{display:grid;grid-template-columns:1fr 1fr}.audio-btn{width:100%}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<section id="levelGate" aria-labelledby="levelTitle">
  <div class="gate-shell">
    <div class="brandline"><div class="brandmark" aria-hidden="true">LO</div><span>La Oficina en Español · Español para trabajar</span></div>
    <div class="gate-panel">
      <h1 id="levelTitle">¿Cuál es tu nivel de español?</h1>
      <p>Selecciona tu ruta. Todos trabajan el mismo tema: cambia la cantidad de apoyo, la complejidad, la autonomía y la precisión esperada.</p>
      <div class="level-grid">
        <button class="level-choice" type="button" data-level="a2"><span class="emoji" aria-hidden="true">🌱</span><strong>A2 — Principiante</strong><span>Ya puedo comprender y usar expresiones frecuentes y frases sencillas. Necesito vocabulario, estructuras, ejemplos y apoyo para comunicarme en situaciones profesionales.</span></button>
        <button class="level-choice" type="button" data-level="b1"><span class="emoji" aria-hidden="true">💼</span><strong>B1 — Intermedio</strong><span>Ya puedo comunicarme en situaciones habituales y quiero responder con más precisión, libertad y naturalidad en el trabajo.</span></button>
        <button class="level-choice" type="button" data-level="b2"><span class="emoji" aria-hidden="true">🚀</span><strong>B2 — Avanzado</strong><span>Puedo comunicarme con bastante autonomía y quiero trabajar precisión, matiz, registro, reacción y situaciones profesionales más exigentes.</span></button>
      </div>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="mini-brand"><a href="https://laoficinaenespanol.com" target="_blank" rel="noopener">La Oficina en Español</a></div>
      <div class="progress-area" aria-label="Progreso del módulo">
        <div class="progress-meta"><span>Tu progreso</span><span id="progressText">0%</span></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
      <div class="route-actions"><span id="routeChip" class="route-chip"></span><button id="changeLevel" class="change-level" type="button">Cambiar nivel</button></div>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Secciones del módulo"></nav>
    <main class="main">
      <section class="hero" id="hero"></section>
      <div id="sections"></div>
    </main>
  </div>
  <footer>La Oficina en Español · <a href="https://laoficinaenespanol.com" target="_blank" rel="noopener">laoficinaenespanol.com</a></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

// ===== CONTENIDO EDITABLE DE LA SEMANA =====
const contenido = {
  meta: {
    tema: "Tema 4 · Adjetivos posesivos",
    habilidad: "Hablar con claridad de tu equipo, tu empresa, tus responsabilidades y tus proyectos",
    contexto: "Identificar con claridad la relación entre personas, equipos, tareas, documentos, ideas y proyectos dentro de situaciones profesionales.",
    topicLabel: "Adjetivos posesivos aplicados al trabajo"
  },
  a2: {
    ruta: "🌱 A2 — Principiante",
    objetivo: "Al terminar esta semana podrás indicar a quién corresponde un proyecto, un documento o una responsabilidad y hablar de tu equipo usando posesivos sencillos como mi, mis, tu, tus, su, sus, nuestro y nuestra.",
    objetivoEn: "By the end of this week, you can indicate who a project, document or responsibility belongs to and talk about your team using simple Spanish possessives.",
    situacion: {
      quien: "Tú, como miembro de un equipo.",
      conQuien: "Una compañera nueva que necesita orientarse.",
      contexto: "Una reunión breve de incorporación a un proyecto.",
      objetivo: "Explicar qué personas forman parte de cada equipo y a quién corresponden los documentos y las tareas.",
      dificultad: "En español, el posesivo cambia según la cosa o las cosas que posees: mi informe / mis informes; nuestra reunión / nuestros proyectos. Además, su puede tener varios significados."
    },
    vocabulario: [
      {term:"mi equipo", en:"my team", stress:"e-QUI-po", meaning:"El equipo al que pertenezco.", example:"Mi equipo trabaja con clientes de México.", extra:"mi + nombre singular"},
      {term:"mis responsabilidades", en:"my responsibilities", stress:"res-pon-sa-bi-li-DA-des", meaning:"Las tareas o funciones que me corresponden.", example:"Mis responsabilidades incluyen revisar los pedidos.", extra:"mis + nombre plural"},
      {term:"tu proyecto", en:"your project", stress:"pro-YEC-to", meaning:"El proyecto de la persona con quien hablas de tú.", example:"Tu proyecto empieza el lunes.", extra:"tu + nombre singular"},
      {term:"su propuesta", en:"your / his / her / their proposal", stress:"pro-PUES-ta", meaning:"Una propuesta de usted, él, ella, ustedes, ellos o ellas. El contexto indica de quién.", example:"Su propuesta está lista para la reunión.", extra:"su puede ser ambiguo; en A2 usa el contexto para identificar a la persona."},
      {term:"nuestro cliente", en:"our client", stress:"CLI-en-te", meaning:"Un cliente relacionado con nosotros.", example:"Nuestro cliente necesita una respuesta hoy.", extra:"nuestro cambia para concordar con el nombre: nuestro cliente / nuestra empresa."},
      {term:"nuestra reunión", en:"our meeting", stress:"reu-NIÓN", meaning:"Una reunión de nosotros.", example:"Nuestra reunión es a las diez.", extra:"nuestra + nombre femenino singular"}
    ],
    recall: {
      prompt:"Elige la expresión en español que corresponde a “our meeting”.",
      options:["mi reunión","nuestra reunión","su reunión"],
      answer:1,
      feedback:"“Nuestra reunión” significa “our meeting”. Usamos nuestra porque reunión es un nombre femenino singular."
    },
    frases: [
      {group:"Hablar de tu trabajo", text:"Mi equipo trabaja con clientes internacionales.", en:"My team works with international clients.", why:"Usa mi + nombre singular para hablar de algo relacionado contigo."},
      {group:"Hablar de varias tareas", text:"Mis responsabilidades incluyen preparar los informes.", en:"My responsibilities include preparing the reports.", why:"Usa mis porque responsabilidades está en plural."},
      {group:"Hablar con otra persona", text:"Tu presentación está en la carpeta compartida.", en:"Your presentation is in the shared folder.", why:"Tu se usa con una persona a la que tratas de tú."},
      {group:"Hablar con un cliente", text:"Su pedido está listo para envío.", en:"Your order is ready to ship.", why:"Su puede usarse para hablar formalmente con usted."},
      {group:"Hablar del equipo", text:"Nuestro proyecto termina el viernes.", en:"Our project ends on Friday.", why:"Nuestro concuerda con proyecto, que es masculino singular."},
      {group:"Hablar de la empresa", text:"Nuestra empresa tiene tres oficinas.", en:"Our company has three offices.", why:"Nuestra concuerda con empresa, que es femenino singular."}
    ],
    builder: {
      instruction:"Construye una frase para presentar una responsabilidad o un recurso de trabajo.",
      fields:[
        {label:"Posesivo", key:"pos", options:["Mi","Tu","Su","Nuestro","Nuestra","Mis","Tus","Sus","Nuestros","Nuestras"]},
        {label:"Nombre", key:"noun", options:["equipo","empresa","proyecto","reunión","responsabilidades","documentos","clientes","propuestas"]}
      ],
      predicates:{
        "equipo":"trabaja con clientes internacionales.",
        "empresa":"tiene una reunión con un proveedor hoy.",
        "proyecto":"empieza el lunes.",
        "reunión":"es a las diez.",
        "responsabilidades":"incluyen revisar los pedidos.",
        "documentos":"están en la carpeta compartida.",
        "clientes":"necesitan una respuesta hoy.",
        "propuestas":"están listas para la reunión."
      },
      note:"Comprueba que el posesivo combine con el nombre: nuestra empresa, nuestro proyecto, mis responsabilidades, nuestros clientes."
    },
    gramatica: {
      intro:"Situación: necesitas decir claramente de quién es algo en el trabajo. Intención: identificar relación o pertenencia sin repetir nombres.",
      rules:[
        {title:"1. mi / mis", body:"Usa <b>mi</b> con un nombre singular y <b>mis</b> con un nombre plural. Ejemplos: <b>mi informe</b>, <b>mis informes</b>. El posesivo cambia por el número de la cosa, no por tu género."},
        {title:"2. tu / tus", body:"Usa <b>tu</b> o <b>tus</b> cuando hablas con una persona de tú. Ejemplos: <b>tu proyecto</b>, <b>tus tareas</b>."},
        {title:"3. su / sus", body:"Usa <b>su</b> o <b>sus</b> con usted, él, ella, ustedes, ellos o ellas. Ejemplos: <b>su propuesta</b>, <b>sus comentarios</b>. El contexto indica de quién hablamos."},
        {title:"4. nuestro / nuestra / nuestros / nuestras", body:"Este posesivo cambia en género y número según el nombre: <b>nuestro proyecto</b>, <b>nuestra empresa</b>, <b>nuestros clientes</b>, <b>nuestras reuniones</b>."}
      ],
      table:[
        ["Yo","mi proyecto","mis proyectos"],
        ["Tú","tu tarea","tus tareas"],
        ["Usted / él / ella / ustedes / ellos / ellas","su informe","sus informes"],
        ["Nosotros/as","nuestro proyecto / nuestra empresa","nuestros proyectos / nuestras empresas"]
      ],
      tip:"En español latinoamericano profesional es frecuente usar ustedes; por eso aquí priorizamos su / sus para ustedes."
    },
    registro: {

function chooseSpanishVoice(){
  if(!("speechSynthesis" in window)) return null;
  const voices=window.speechSynthesis.getVoices();
  const spanish=voices.filter(v=>/^es([-_]|$)/i.test(v.lang));
  const priorities=[/es[-_]CO/i,/es[-_](MX|US|AR|CL|PE|VE|EC|UY|CR|PA|DO|GT|HN|SV|NI|PR|BO|PY)/i,/es/i];
  for(const re of priorities){const found=spanish.find(v=>re.test(v.lang));if(found)return found;}
  return spanish[0]||null;
}
function speak(text,slow=false){
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){showToast("El audio no está disponible en este navegador.");return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="es-CO";u.rate=slow?0.72:0.96;u.pitch=1;
  const voice=chooseSpanishVoice();if(voice){u.voice=voice;u.lang=voice.lang;}
  window.speechSynthesis.speak(u);
}

function goTo(id){const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});markSection(id);}}
function markSection(id){if(!sectionSeen.has(id)){sectionSeen.add(id);markAction("section:"+id);}document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.go===id));}
function observeSections(){
  if(!("IntersectionObserver" in window))return;
  const obs=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting)markSection(en.target.id);});},{rootMargin:"-25% 0px -60% 0px",threshold:.01});
  document.querySelectorAll(".section").forEach(s=>obs.observe(s));
}
function buildMessage(){
  const vals=[...document.querySelectorAll("[data-builder-key]")].map(s=>s.value);
  let out="";
  let builderFeedback="";
  if(nivel==="a2"){
    const pos=vals[0], noun=vals[1];
    const predicate=contenido.a2.builder.predicates[noun]||"";
    out=`${pos} ${noun} ${predicate}`.replace(/\s+/g," ").trim();
    const allowed={
      equipo:["Mi","Tu","Su","Nuestro"], empresa:["Mi","Tu","Su","Nuestra"], proyecto:["Mi","Tu","Su","Nuestro"], reunión:["Mi","Tu","Su","Nuestra"],
      responsabilidades:["Mis","Tus","Sus","Nuestras"], documentos:["Mis","Tus","Sus","Nuestros"], clientes:["Mis","Tus","Sus","Nuestros"], propuestas:["Mis","Tus","Sus","Nuestras"]
    };
    if(!(allowed[noun]||[]).includes(pos)){
      builderFeedback=" Revisa la concordancia del posesivo con el nombre antes de continuar.";
    } else {
      builderFeedback=" La concordancia del posesivo es adecuada.";
    }
  } else {
    out=(vals[0]+" "+vals[1]+" "+vals[2]).replace(/\s+/g," ").trim();
  }
  document.getElementById("builtOutput").textContent=out+builderFeedback;
  const aud=document.getElementById("builtAudio");if(aud)aud.innerHTML=audioButtons(out,"built");
  if(aud)aud.querySelectorAll(".js-audio").forEach(btn=>btn.addEventListener("click",()=>{speak(btn.dataset.text,btn.dataset.slow==="1");markAction("audio:built");}));
  markAction("builder-created");
}

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñü\s]/g,"").replace(/\s+/g," ").trim();}
function checkQuiz(idx){
  const q=contenido[nivel].ejercicios[idx];const box=document.querySelector(`.quiz-question[data-q="${idx}"]`);const fb=document.getElementById(`qfb-${idx}`);let ok=false;
  if(q.type==="mc"){const selected=box.querySelector(`input[name="q-${idx}"]:checked`);if(!selected){fb.textContent="Selecciona una opción.";return;}ok=Number(selected.value)===q.answer;}
  else if(q.type==="mc-multi"){const selected=[...box.querySelectorAll(`input[name="q-${idx}"]:checked`)].map(x=>Number(x.value)).sort();ok=JSON.stringify(selected)===JSON.stringify([...q.answers].sort());}
  else {const val=norm(box.querySelector(".text-answer").value);const ans=norm(q.answer);ok=q.contains?val.includes(ans):val===ans;}
  fb.textContent=(ok?"Bien. ":"Revisa esta idea. ")+q.explain;fb.style.color=ok?"var(--ok)":"var(--warn)";if(ok)markAction("quiz:"+idx);
}
function resetQuiz(idx){const box=document.querySelector(`.quiz-question[data-q="${idx}"]`);box.querySelectorAll("input").forEach(x=>{if(x.type==="radio"||x.type==="checkbox")x.checked=false;else x.value="";});const fb=document.getElementById(`qfb-${idx}`);fb.textContent="";}
function checkRecall(){const d=contenido.a2.recall;const selected=document.querySelector('input[name="recall"]:checked');const fb=document.getElementById("recallFeedback");if(!selected){fb.className="feedback show neutral";fb.textContent="Elige una opción.";return;}const ok=Number(selected.value)===d.answer;fb.className="feedback show "+(ok?"good":"neutral");fb.textContent=(ok?"Bien. ":"Inténtalo otra vez. ")+d.feedback;if(ok)markAction("recall-correct");}
function updateChecklistReady(){const boxes=[...document.querySelectorAll("#checklistBox input")];const all=boxes.length&&boxes.every(b=>b.checked);document.getElementById("readyBox")?.classList.toggle("show",all);if(all)markAction("checklist-complete");}

function selectLevel(newLevel){
  if(!["a2","b1","b2"].includes(newLevel))return;
  nivel=newLevel;actionsDone=new Set();sectionSeen=new Set();
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
  levelGate.classList.add("hidden");app.classList.remove("hidden");renderAll();window.scrollTo({top:0,behavior:"auto"});markAction("level-selected");
}
document.querySelectorAll(".level-choice").forEach(btn=>btn.addEventListener("click",()=>selectLevel(btn.dataset.level)));
document.getElementById("changeLevel").addEventListener("click",()=>{if("speechSynthesis" in window)window.speechSynthesis.cancel();app.classList.add("hidden");levelGate.classList.remove("hidden");window.scrollTo({top:0,behavior:"auto"});});
</script>
</body>
</html>

const $=s=>document.querySelector(s);

function totalActions(){return level==='a2'?39:38;}

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function mark(id){completed.add(id);updateProgress();}
function updateProgress(){
  const pct=Math.min(100,Math.round((completed.size/totalActions())*100));
  $("#progressBar").style.width=pct+"%";$("#progressText").textContent=pct+"%";
  const track=$('.progress-track'); if(track) track.setAttribute('aria-valuenow',String(pct));
}
function speakText(text,slow=false){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    showAudioStatus('Tu navegador no ofrece Speech Synthesis. El resto del módulo funciona normalmente.');return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='es-CO';u.rate=slow?.72:.95;u.pitch=1;
  if(audioVoice)u.voice=audioVoice;
  u.onstart=()=>showAudioStatus(slow?'Reproduciendo lentamente…':'Reproduciendo…');
  u.onend=()=>hideAudioStatus();u.onerror=()=>showAudioStatus('No fue posible reproducir este audio en el navegador.');
  window.speechSynthesis.speak(u);
}
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length)return;
  const prefs=[/es[-_]CO/i,/es[-_](MX|US|AR|CL|PE|VE|EC|UY)/i,/^es/i];
  for(const p of prefs){const v=voices.find(x=>p.test(x.lang));if(v){audioVoice=v;break;}}
}
if('speechSynthesis' in window){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice;}
function showAudioStatus(msg){const el=$('#audioStatus');el.textContent=msg;el.classList.remove('hidden');}
function hideAudioStatus(){setTimeout(()=>$('#audioStatus').classList.add('hidden'),350);}
function audioButtons(text){

}

  sections.push(sectionShell(9,contenido.meta.secciones[9],`<p>${esc(d.practica.situacion)}</p><h3>Requisitos</h3><ul>${d.practica.requisitos.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>${d.practica.apoyo?`<div class="support-list">${d.practica.apoyo.map(a=>`<button class="support-chip" type="button" data-support="${esc(a)}">${esc(a)}</button>`).join('')}</div>${level==='a2'?`<p class="section-intro">Puedes pulsar los bloques para escucharlos antes de escribir.</p>`:''}`:''}<label for="practiceText">Tu respuesta</label><textarea id="practiceText" placeholder="Escribe aquí tu respuesta…"></textarea><p class="section-intro">No se evalúa automáticamente. El objetivo es que construyas una respuesta que puedas utilizar.</p>`));
  sections.push(sectionShell(10,contenido.meta.secciones[10],`<p><strong>Primero intenta tu propia respuesta.</strong></p><button id="showModel" class="btn" type="button">Ver una posible respuesta</button><div id="modelBox" class="model"><p><strong>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</strong></p><p>${esc(d.modelo)}</p>${audioButtons(d.modelo)}</div>`));
  sections.push(sectionShell(11,contenido.meta.secciones[11],`<p>Antes de terminar, comprueba:</p><div id="checkProgress" class="check-progress">0 de ${d.checklist.length}</div><div class="checklist">${d.checklist.map((c,i)=>`<label class="check-item"><input type="checkbox" data-check="${i}"><span>${esc(c)}</span></label>`).join('')}</div><div id="readyBox" class="ready"><h3>🎯 Ya estás listo para practicar</h3><p>No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p><!-- Sustituir # por la URL real del reto diario cuando esté disponible. --><a class="challenge" href="#">🔥 Ir al reto de hoy</a></div>`));
  $('#sections').innerHTML=sections.join('');
}
function renderBuilder(d){
  const b=d.builder;
  const fields=b.campos.map((c,i)=>`<label>${esc(c.label)}<select data-builder="${i}">${c.opciones.map(o=>{const [lab,val]=o.split('|');return`<option value="${esc(val)}">${esc(lab)}</option>`}).join('')}</select></label>`).join('');
  return `<div class="builder"><p><strong>${esc(b.label)}</strong></p><div class="builder-grid">${fields}</div><div id="builderOutput" class="output"></div><div id="builderAudio"></div></div>`;
}
function builderSentence(){
  const vals=$$('[data-builder]').map(s=>s.value);let out='';
  if(level==='a2')out=`${vals[0].charAt(0).toUpperCase()+vals[0].slice(1)} ${vals[1]} ${vals[2]}.`;
  if(level==='b1')out=`Se ${vals[1]} ${vals[2]} ${vals[0]}.`;
  if(level==='b2')out=`${vals[0]} ${vals[1]} ${vals[2]}.`;
  $('#builderOutput').textContent=out;
  $('#builderAudio').innerHTML=audioButtons(out);bindAudioButtons($('#builderAudio'));
  return out;
}
function renderExample(d){
  let txt=esc(d.ejemplo.texto).replace(/\n/g,'<br>');
  d.ejemplo.anotaciones.forEach((a,i)=>{const target=esc(a[0]);txt=txt.replace(target,`<button class="annot" type="button" data-ann="${i}">${target}</button>`);});
  return `<div class="example-full"><p>${txt}</p>${audioButtons(d.ejemplo.texto)}<div id="annotationBox" class="annotation">Pulsa una parte subrayada para ver qué función cumple.</div></div>`;
}
function bindDynamic(){
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>showSection(+b.dataset.index)));
  $$('.prev').forEach((b,i)=>b.addEventListener('click',()=>showSection(Math.max(0,i-1))));
  $$('.next').forEach((b,i)=>b.addEventListener('click',()=>showSection(Math.min(11,i+1))));
  $$('.flip-toggle').forEach(btn=>btn.addEventListener('click',()=>{
    const card=btn.closest('.flip');card.classList.toggle('open');btn.setAttribute('aria-expanded',card.classList.contains('open')?'true':'false');
    if(card.classList.contains('open'))mark('vocab-'+card.dataset.vocab);
  }));
  $$('.details-btn').forEach(b=>b.addEventListener('click',()=>{const d=b.nextElementSibling;d.classList.toggle('show');if(d.classList.contains('show'))mark('phrase-'+b.dataset.phrase);}));
  $$('[data-builder]').forEach(s=>s.addEventListener('change',()=>{builderSentence();mark('builder');}));builderSentence();
  $$('.register').forEach(b=>b.addEventListener('click',()=>handleRegister(b)));
  $$('.quiz-opt').forEach(b=>b.addEventListener('click',()=>handleQuiz(b)));
  $$('.retry').forEach(b=>b.addEventListener('click',()=>retryQuiz(+b.dataset.retry)));
  $$('.annot').forEach(b=>b.addEventListener('click',()=>{const a=contenido[level].ejemplo.anotaciones[+b.dataset.ann];$('#annotationBox').textContent=a[1];mark('annotation');}));
  const ta=$('#practiceText');ta.addEventListener('input',()=>{if(ta.value.trim().length>=20)mark('practice');});
  $$('.support-chip').forEach(b=>b.addEventListener('click',()=>{if(level==='a2')speakText(b.dataset.support,false);}));
  $('#showModel').addEventListener('click',()=>{$('#modelBox').classList.add('show');mark('model');});
  $$('[data-check]').forEach(c=>c.addEventListener('change',updateChecklist));
  $$('.recovery').forEach(b=>b.addEventListener('click',()=>{const fb=$('#recoveryFb');fb.classList.add('show');if(b.dataset.ok==='1'){fb.className='feedback show good';fb.textContent='Sí. “La factura” = the invoice.';}else{fb.className='feedback show warn';fb.textContent='Intenta otra vez. Busca la palabra que corresponde a “invoice”.';}mark('recovery');}));
  bindAudioButtons(document);
}
function bindAudioButtons(root){
  root.querySelectorAll('[data-speak]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.addEventListener('click',e=>{e.stopPropagation();speakText(b.dataset.speak,false);});});
  root.querySelectorAll('[data-slow]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.addEventListener('click',e=>{e.stopPropagation();speakText(b.dataset.slow,true);});});
}
function handleRegister(b){
  $$('.register').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
  const o=contenido[level].registro.opciones[+b.dataset.reg];const fb=$('#registerFb');fb.className='feedback show '+o.tipo;fb.textContent=o.fb;mark('register');
}
function handleQuiz(b){
  const qi=+b.dataset.q,oi=+b.dataset.o;const box=b.closest('.quiz');box.querySelectorAll('.quiz-opt').forEach(x=>{x.classList.remove('selected');x.disabled=true;});b.classList.add('selected');
  const q=contenido[level].quizzes[qi],fb=box.querySelector('.quiz-fb');fb.classList.add('show');
  if(oi===q.ok){fb.className='feedback quiz-fb show good';fb.textContent='Funciona. '+q.fb;mark('quiz-'+qi);}else{fb.className='feedback quiz-fb show warn';fb.textContent='Revisa esta elección. '+q.fb;box.querySelector('.retry').classList.remove('hidden');}
}
function retryQuiz(qi){
  const box=$(`.quiz[data-quiz="${qi}"]`);box.querySelectorAll('.quiz-opt').forEach(x=>{x.disabled=false;x.classList.remove('selected');});box.querySelector('.quiz-fb').className='feedback quiz-fb';box.querySelector('.retry').classList.add('hidden');
}
function updateChecklist(){
  const checks=$$('[data-check]'),n=checks.filter(c=>c.checked).length;$('#checkProgress').textContent=`${n} de ${checks.length}`;
  checks.forEach(c=>{if(c.checked)mark('check-'+c.dataset.check);});
  $('#readyBox').classList.toggle('show',n===checks.length);if(n===checks.length)mark('ready');
}
function showSection(i){
  current=i;$$('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));$$('.nav-btn').forEach((b,j)=>b.classList.toggle('active',j===i));mark('section-'+i);
  const target=$('.panel.active');if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
}
$$('.level-card').forEach(b=>b.addEventListener('click',()=>chooseLevel(b.dataset.level)));
$('#changeLevel').addEventListener('click',()=>{
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  $('#app').classList.add('hidden');$('#levelScreen').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>

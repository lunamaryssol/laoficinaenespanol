function chooseVoice(){const voices=speechSynthesis.getVoices(); const prefs=[/es[-_]CO/i,/es[-_](MX|US|419|AR|CL|PE)/i,/^es/i]; for(const p of prefs){const v=voices.find(x=>p.test(x.lang)); if(v)return v;} return voices.find(v=>/^es/i.test(v.lang))||null}

 $("#studentText").addEventListener("input",()=>{if($("#studentText").value.trim().length>30) mark("practice")});
}
function answerQuiz(qi,oi,text){const q=contenido[currentLevel].quizzes[qi], fb=$("#qfb"+qi), retry=$("#retry"+qi); const ok=oi===q.ans; fb.innerHTML=`<span class="${ok?"ok":"warn"}">${ok?"Funciona.":"Revísalo."}</span> ${esc(q.why)}`; retry.classList.toggle("hidden",ok); if(currentLevel==="a2") speak(text,false); if(ok){quizDone.add("q"+qi);updateProgress()}}
function updateChecklist(){const boxes=[...document.querySelectorAll("[data-check]")], n=boxes.filter(x=>x.checked).length, total=boxes.length; $("#checkBar").style.width=(n/total*100)+"%"; $("#checkText").textContent=`${n} de ${total} completados`; if(n===total){$("#readyBox").classList.add("show"); mark("checklist")}else $("#readyBox").classList.remove("show")}
function observeSections(){const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){visited.add(e.target.id); const btn=document.querySelector(`[data-jump="${e.target.id}"]`); if(btn)btn.classList.add("visited"); updateProgress()}})},{threshold:.35}); sections.forEach(([id])=>{const el=document.getElementById(id);if(el)obs.observe(el)})}
function selectLevel(level){currentLevel=level; done.clear();visited.clear();quizDone.clear();selectedReg=false; $("#levelScreen").classList.add("hidden"); $("#app").classList.remove("hidden"); render(); window.scrollTo({top:0})}
document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>selectLevel(b.dataset.level)));
$("#changeLevel").addEventListener("click",()=>{if("speechSynthesis" in window)speechSynthesis.cancel(); $("#app").classList.add("hidden"); $("#levelScreen").classList.remove("hidden"); window.scrollTo({top:0})});
</script>
</body>

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function audioButtons(text){
  if(level!=="a2") return "";
  return `<div class="audio-row">
    <button class="audio-btn" data-speak="${esc(text)}" data-rate="1" aria-label="Escuchar: ${esc(text)}">🔊 Escuchar / Listen</button>
    <button class="audio-btn" data-speak="${esc(text)}" data-rate=".78" aria-label="Escuchar lento: ${esc(text)}">🐢 Lento / Slow</button>
  </div>`;
}
function speakSpanish(text,rate=1){
  if(!("speechSynthesis" in window)){
    alert("La función de voz no está disponible en este navegador.");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const prefs=["es-CO","es-MX","es-US","es-419","es-ES"];
  let voice=null;
  for(const lang of prefs){voice=voices.find(v=>v.lang===lang)||voice;if(voice)break}
  if(!voice) voice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("es"));
  if(voice)u.voice=voice;
  u.lang=voice?.lang||"es-CO";u.rate=Number(rate)||1;u.pitch=1;
  speechSynthesis.speak(u);
}
window.speechSynthesis?.addEventListener?.("voiceschanged",()=>window.speechSynthesis.getVoices());

function progressPlan(){
  const plan = [
    ...secciones.map((_,i)=>"section-"+i),

    ...contenido[level].ejercicios.map((_,i)=>"exercise-"+i),
    "practice","model","checklist-complete"
  ];
  if(level==="a2") plan.push("recall");
  return plan;
}
function mark(action){progressActions.add(action);updateProgress()}
function updateProgress(){
  const plan=progressPlan();
  const done=plan.filter(k=>progressActions.has(k)).length;
  const pct=Math.round(done/plan.length*100);
  document.getElementById("progressBar").style.width=pct+"%";
  document.getElementById("progressBar").setAttribute("aria-valuenow",String(pct));
  document.getElementById("progressText").textContent=pct+"% completado";
}

  });
  document.querySelectorAll(".check").forEach(ch=>ch.addEventListener("change",()=>{
    if(ch.checked)mark("check-"+ch.dataset.i);else{progressActions.delete("check-"+ch.dataset.i);updateProgress()}
    const checks=[...document.querySelectorAll(".check")];
    const checked=checks.filter(x=>x.checked).length;
    const status=document.getElementById("checkStatus");
    if(status)status.textContent=`${checked} de ${checks.length} completados`;
    const all=checked===checks.length;
    document.getElementById("finalBanner").classList.toggle("show",all);
    if(all)mark("checklist-complete");
    else{progressActions.delete("checklist-complete");updateProgress()}
  }));
}
document.querySelectorAll(".level-option").forEach(b=>b.addEventListener("click",()=>setLevel(b.dataset.level)));
document.getElementById("changeLevel").addEventListener("click",()=>{
  window.speechSynthesis?.cancel?.();
  document.getElementById("app").classList.add("hidden");
  document.getElementById("levelScreen").classList.remove("hidden");
  window.scrollTo({top:0});
});
</script>
</body>
</html>

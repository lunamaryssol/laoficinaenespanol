<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Tema 5 · Presente de indicativo | La Oficina en Español</title>
<style>
:root{
  --blue:#003893;
  --blue-2:#0b4bb3;
  --yellow:#FCD116;
  --red:#CE1126;
  --white:#FFFFFF;
  --black:#000000;
  --ink:#17233b;
  --muted:#5f6f86;
  --bg:#f4f7fb;
  --line:#d9e1ee;
  --soft:#eef4ff;
  --good:#0d6f4b;
  --warn:#8a5b00;
  --shadow:0 18px 45px rgba(0,56,147,.10);
  --radius:18px;
  --radius-sm:12px;
  --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Montserrat,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  line-height:1.55;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid rgba(252,209,22,.9);outline-offset:3px}
.hidden{display:none!important}
.screen{min-height:100vh}
.level-screen{
  display:grid;
  place-items:center;
  padding:28px 18px;
  background:
    radial-gradient(circle at 15% 15%, rgba(252,209,22,.28), transparent 24%),
    radial-gradient(circle at 85% 82%, rgba(206,17,38,.10), transparent 22%),
    linear-gradient(135deg,#eef4ff 0%,#ffffff 55%,#f8fbff 100%);
}
.level-panel{
  width:min(1080px,100%);
  background:rgba(255,255,255,.96);
  border:1px solid #dfe7f5;
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:34px;
}
.brand{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:900;letter-spacing:.01em}
.brand-dot{width:15px;height:15px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 5px rgba(0,56,147,.07)}
.level-panel h1{font-size:clamp(2rem,4vw,3.6rem);line-height:1.05;margin:18px 0 10px;color:var(--blue);letter-spacing:-.03em}
.intro{color:var(--muted);max-width:760px;font-size:1.06rem;margin:0 0 26px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.level-btn{
  text-align:left;
  border:2px solid var(--line);
  background:#fff;
  border-radius:20px;
  padding:22px;
  min-height:220px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  color:var(--ink);
}
.level-btn:hover,.level-btn:focus-visible{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 12px 28px rgba(0,56,147,.12)}
.level-btn strong{display:block;font-size:1.23rem;color:var(--blue);margin-bottom:10px}
.level-btn p{margin:0;color:#42516a}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{width:min(var(--max),calc(100% - 28px));margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 0}
.route-badge{font-weight:800;color:var(--blue);background:var(--soft);border:1px solid #cfe0ff;border-radius:999px;padding:8px 12px;white-space:nowrap}
.change-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--ink);font-weight:700}
.progress-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:190px}
.progress-track{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden;flex:1}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-2));transition:width .25s ease}
.progress-label{font-size:.88rem;color:var(--muted);font-weight:800;min-width:44px;text-align:right}
.layout{width:min(var(--max),calc(100% - 28px));margin:20px auto 42px;display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.sidebar{position:sticky;top:73px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 20px rgba(21,48,90,.05)}
.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;color:#46556c;font-size:.93rem}
.nav-btn:hover{background:#f4f7fb}.nav-btn.active{background:var(--soft);color:var(--blue);font-weight:900}.nav-btn.done::after{content:" ✓";color:var(--good);font-weight:900}
.main{min-width:0}
.hero{background:linear-gradient(135deg,var(--blue),#174fa6);color:#fff;border-radius:24px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(252,209,22,.16);right:-70px;top:-80px}
.eyebrow{font-size:.83rem;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:#dbe8ff}
.hero h2{font-size:clamp(1.8rem,3.2vw,2.8rem);line-height:1.1;margin:7px 0 8px;max-width:850px;position:relative;z-index:1}
.hero p{margin:0;color:#e8efff;max-width:860px;position:relative;z-index:1}
.section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:0 10px 26px rgba(24,52,92,.05)}
.section h3{font-size:1.55rem;line-height:1.2;color:var(--blue);margin:0 0 8px}
.section-lead{color:var(--muted);margin:0 0 18px}
.callout{border-left:5px solid var(--yellow);background:#fffbea;border-radius:10px;padding:13px 15px;margin:14px 0}
.info-grid,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.info-card,.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px}
.info-card strong{color:var(--blue)}
.pill{display:inline-block;border-radius:999px;background:var(--soft);color:var(--blue);font-weight:800;padding:5px 9px;font-size:.84rem;margin:2px 4px 2px 0}
.reveal-btn,.audio-btn,.primary-btn,.secondary-btn,.retry-btn,.next-btn,.prev-btn,.action-btn{
  border-radius:10px;padding:9px 12px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--ink)
}
.primary-btn,.next-btn{background:var(--blue);border-color:var(--blue);color:#fff}
.primary-btn:hover,.next-btn:hover{background:#002f79}
.secondary-btn:hover,.reveal-btn:hover,.audio-btn:hover,.retry-btn:hover,.prev-btn:hover,.action-btn:hover{border-color:var(--blue);color:var(--blue)}
.audio-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.audio-btn{font-size:.9rem;background:#f8fbff}
.audio-note{font-size:.88rem;color:var(--muted);margin-top:8px}
.details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.details.open{display:block}
.vocab-word{font-size:1.13rem;font-weight:900;color:var(--blue)}
.translation{font-weight:800;color:#42516a}
.example{background:#f7f9fc;border-radius:10px;padding:10px 12px;margin-top:9px}
.stress{font-weight:900;color:var(--red)}
.function-block{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 0}
.function-title{padding:11px 14px;background:var(--soft);color:var(--blue);font-weight:900}
.phrase{padding:13px 14px;border-top:1px solid var(--line)}
.phrase:first-of-type{border-top:0}
.phrase-text{font-weight:800}
.phrase-explain{display:none;color:#4f5f78;margin-top:8px}.phrase-explain.open{display:block}
.builder{border:1px solid var(--line);background:#f9fbfe;border-radius:15px;padding:16px}
.builder-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.builder label{font-size:.86rem;font-weight:800;color:#52627a}.builder select,.builder input{width:100%;margin-top:5px;border:1px solid #cbd5e4;border-radius:10px;padding:10px;background:#fff}
.builder-output{background:#fff;border:2px solid #cfe0ff;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:800;color:var(--blue);min-height:56px}
.accordion{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}
.accordion button{width:100%;border:0;background:#f7f9fc;text-align:left;padding:13px 14px;font-weight:900;color:var(--blue);display:flex;justify-content:space-between;gap:10px}
.accordion-content{display:none;padding:14px}.accordion-content.open{display:block}
.rule-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}.rule-table th,.rule-table td{border:1px solid var(--line);padding:9px;text-align:left}.rule-table th{background:#f4f7fb;color:var(--blue)}
.activity-box{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.option-list{display:grid;gap:9px;margin:12px 0}.option{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);padding:10px;border-radius:10px;background:#fff}.option:hover{border-color:#9eb7df}.option input{margin-top:4px}
.feedback{display:none;border-radius:10px;padding:11px 12px;margin-top:10px}.feedback.show{display:block}.feedback.good{background:#eaf7f1;color:#0b5f41}.feedback.neutral{background:#fff7df;color:#744f00}.feedback.bad{background:#fff0f2;color:#8d1730}
.example-block{border:1px solid var(--line);border-radius:15px;padding:17px;background:#fbfcfe}
.example-line{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:8px;color:var(--ink)}
.example-line:hover,.example-line:focus-visible{background:var(--soft)}
.example-function{display:none;margin:-2px 9px 8px;padding:9px 11px;background:#fffbea;border-left:4px solid var(--yellow);border-radius:8px;color:#5c4a00}.example-function.open{display:block}
.exercise{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.exercise h4{margin:0 0 6px;color:var(--blue)}
.exercise input[type="text"]{width:100%;border:1px solid #cbd5e4;border-radius:10px;padding:11px;margin:8px 0}
.exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{width:100%;min-height:180px;border:1px solid #bcc9dd;border-radius:12px;padding:13px;resize:vertical;background:#fff}
.support-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.support-chip{border:1px solid #cfe0ff;background:var(--soft);color:var(--blue);border-radius:999px;padding:7px 10px;font-weight:800;font-size:.9rem}
.model{display:none;margin-top:13px;border:1px solid #cfe0ff;border-radius:13px;padding:15px;background:#f7faff}.model.open{display:block}
.checklist{display:grid;gap:10px}.check-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px}.check-item input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue)}
.check-progress{margin:15px 0 4px}.check-track{height:11px;border-radius:999px;background:#e8edf5;overflow:hidden}.check-bar{height:100%;width:0;background:var(--yellow);transition:width .25s ease}
.ready{display:none;margin-top:18px;background:linear-gradient(135deg,#f5f9ff,#fffbe4);border:1px solid #cbd9ef;border-radius:16px;padding:20px}.ready.show{display:block}.cta-link{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:900;padding:11px 16px;border-radius:11px;margin-top:8px}.cta-link:hover{background:#aa0e20}
.meta{font-size:.91rem;color:var(--muted)}
.section-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.section-actions button{min-width:112px}
.footer{width:min(var(--max),calc(100% - 28px));margin:0 auto 30px;text-align:center;color:var(--muted);font-size:.9rem}.footer a{font-weight:800}
.meaning-blocks{display:grid;gap:6px;margin:10px 0}.meaning-block{background:#f7f9fc;border-radius:8px;padding:7px 10px}
@media(max-width:900px){
  .level-grid{grid-template-columns:1fr}.level-btn{min-height:auto}.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:6px;padding:8px}.nav-btn{width:auto;white-space:nowrap}.info-grid,.cards{grid-template-columns:1fr}.topbar-inner{flex-wrap:wrap}.progress-wrap{order:3;flex-basis:100%}.builder-row{grid-template-columns:1fr}.level-panel{padding:24px}.hero,.section{padding:20px}
}
@media(max-width:520px){
  .level-screen{padding:14px}.level-panel{border-radius:20px;padding:20px}.route-badge{white-space:normal}.change-btn{margin-left:auto}.hero{border-radius:18px}.section{border-radius:15px}.section-actions button{min-width:0;flex:1}.audio-row{gap:6px}.audio-btn{flex:1 1 145px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<section id="levelScreen" class="screen level-screen" aria-labelledby="levelTitle">
  <div class="level-panel">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>La Oficina en Español</div>
    <h1 id="levelTitle">¿Cuál es tu nivel de español?</h1>
    <p class="intro">Selecciona tu ruta para adaptar el apoyo, las expresiones, los ejercicios y la dificultad de este módulo.</p>
    <div class="level-grid">
      <button class="level-btn" data-level="a2"><strong>🌱 A2 — Principiante</strong><p>Ya puedo comprender y usar expresiones frecuentes y frases sencillas. Necesito vocabulario, estructuras, ejemplos y apoyo para comunicarme en situaciones profesionales.</p></button>
      <button class="level-btn" data-level="b1"><strong>💼 B1 — Intermedio</strong><p>Ya puedo comunicarme en situaciones habituales y quiero responder con más precisión, libertad y naturalidad en el trabajo.</p></button>
      <button class="level-btn" data-level="b2"><strong>🚀 B2 — Avanzado</strong><p>Puedo comunicarme con bastante autonomía y quiero trabajar precisión, matiz, registro, reacción y situaciones profesionales más exigentes.</p></button>
    </div>
  </div>
</section>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div id="routeBadge" class="route-badge"></div>
      <button id="changeLevel" class="change-btn" type="button">Cambiar nivel</button>
      <div class="progress-wrap" aria-label="Progreso del módulo">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="progressLabel" class="progress-label">0%</div>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="sectionNav" class="sidebar" aria-label="Secciones del módulo"></nav>
    <main class="main">
      <section class="hero" aria-labelledby="moduleTitle">
        <div class="eyebrow">Tema 5 · Herramientas lingüísticas</div>
        <h2 id="moduleTitle"></h2>
        <p id="moduleSubtitle"></p>
      </section>
      <div id="sectionHost"></div>
    </main>
  </div>

  <footer class="footer">La Oficina en Español · <a href="https://laoficinaenespanol.com" target="_blank" rel="noopener">Español para trabajar</a></footer>
</div>

<script>
'use strict';

// ===== CONTENIDO EDITABLE DE LA SEMANA =====
const contenido = {

    situacion: {

    vocabulario: [
      {term:'responsabilidad', translation:'responsibility', meaning:'Una tarea o función que debes hacer en tu trabajo.', example:'Mi responsabilidad principal es revisar los pedidos.', extra:'Colocación útil: responsabilidad principal.', stress:'res-pon-sa-bi-li-DAD'},
      {term:'tarea', translation:'task', meaning:'Una actividad concreta de trabajo.', example:'Completo tres tareas antes de la reunión.', extra:'Colocaciones: hacer una tarea · completar una tarea.', stress:'TA-rea'},

    gramatica:[

        {text:'Mi compañera recibe las confirmaciones y yo hago seguimiento con los proveedores.',fn:'Distribuyes responsabilidades.'},

let totalActions = 1;
let voices = [];

const qs = (sel, root=document) => root.querySelector(sel);
const qsa = (sel, root=document) => [...root.querySelectorAll(sel)];
const escapeHTML = (str='') => String(str).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const norm = (str='') => str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function chooseSpanishVoice(){
  const list = voices.length ? voices : (window.speechSynthesis?.getVoices?.() || []);
  const scores = [
    v => /es[-_](CO|MX|US|AR|CL|PE|VE|EC|BO|PY|UY|CR|PA|GT|HN|SV|NI|DO|PR|CU|419)/i.test(v.lang),
    v => /^es[-_]/i.test(v.lang),
    v => /^es/i.test(v.lang)
  ];
  for(const test of scores){
    const found = list.find(test);
    if(found) return found;
  }
  return null;
}

function speak(text, slow=false){
  if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){
    alert('La síntesis de voz no está disponible en este navegador. El resto del módulo funciona normalmente.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-419';
  const voice = chooseSpanishVoice();
  if(voice){
    u.voice = voice;
    u.lang = voice.lang || 'es-419';
  }
  u.rate = slow ? 0.72 : 0.96;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
  if(level === 'a2') mark('audio-first');
}

function audioControls(text){
  if(level !== 'a2') return '';
  const safe = escapeHTML(text);
  return `<div class="audio-row">
    <button type="button" class="audio-btn js-speak" data-text="${safe}" data-slow="false" aria-label="Escuchar: ${safe}">🔊 Escuchar / Listen</button>
    <button type="button" class="audio-btn js-speak" data-text="${safe}" data-slow="true" aria-label="Escuchar lento: ${safe}">🐢 Lento / Slow</button>
  </div>`;
}

function mark(key){
  if(!completed.has(key)){
    completed.add(key);
    updateProgress();
  }
}

function computeTotalActions(){
  totalActions = 12 + 1 + 1 + 1 + 1 + 1 + 1 + data.ejercicios.length + 1 + 1 + data.checklist.length + (level === 'a2' ? 1 : 0);
}

function updateProgress(){
  const pct = Math.min(100, Math.round((completed.size / totalActions) * 100));
  qs('#progressBar').style.width = pct + '%';
  qs('#progressLabel').textContent = pct + '%';
  qsa('.nav-btn').forEach((btn,i) => btn.classList.toggle('done', completed.has('section-'+i)));
}

function selectLevel(newLevel){
  level = newLevel;
  data = contenido[level];
  currentSection = 0;
  completed = new Set();
  computeTotalActions();
  qs('#levelScreen').classList.add('hidden');
  qs('#app').classList.remove('hidden');
  qs('#routeBadge').textContent = 'Tu ruta: ' + data.label;
  qs('#moduleTitle').textContent = contenido.meta.habilidad;
  qs('#moduleSubtitle').textContent = data.subtitle;
  renderNav();
  renderSection();
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderNav(){
  qs('#sectionNav').innerHTML = sectionMeta.map((s,i)=>`<button type="button" class="nav-btn ${i===currentSection?'active':''}" data-section="${i}">${i+1}. ${s[0]} ${s[1]}</button>`).join('');
}

function renderSection(){
  qsa('.nav-btn').forEach((b,i)=>b.classList.toggle('active',i===currentSection));
  const renderers = [renderObjective,renderSituation,renderVocab,renderPhrases,renderBuilder,renderGrammar,renderRegister,renderExample,renderExercises,renderPractice,renderModel,renderChecklist];
  qs('#sectionHost').innerHTML = renderers[currentSection]();
  mark('section-'+currentSection);
  bindDynamic();
  const heading = qs('#sectionHost h3');
  if(heading) heading.setAttribute('tabindex','-1');
  if(heading) heading.focus({preventScroll:true});
}

function sectionShell(index, body, lead=''){
  const prevDisabled = index === 0 ? 'disabled' : '';
  const nextDisabled = index === sectionMeta.length-1 ? 'disabled' : '';
  return `<section class="section" aria-labelledby="sectionTitle${index}">
    <h3 id="sectionTitle${index}">${sectionMeta[index][0]} ${sectionMeta[index][1]}</h3>
    ${lead ? `<p class="section-lead">${lead}</p>`:''}
    ${body}
    <div class="section-actions">
      <button type="button" class="prev-btn" ${prevDisabled}>Anterior</button>
      <button type="button" class="next-btn" ${nextDisabled}>Siguiente</button>
    </div>
  </section>`;
}

function renderObjective(){
  return sectionShell(0,`
    <div class="callout"><strong>${escapeHTML(data.objetivo)}</strong></div>
    <p>Al final del módulo comprobarás si ya puedes hacerlo.</p>
    <p class="meta">Tema lingüístico de apoyo: <strong>${escapeHTML(contenido.meta.tema)}</strong>.</p>
  `,'Esta semana usarás el presente de indicativo para realizar una acción profesional concreta.');
}

function renderSituation(){
  const s = data.situacion;
  return sectionShell(1,`<div class="info-grid">
    <div class="info-card"><strong>Quién habla</strong><br>${escapeHTML(s.quien)}</div>
    <div class="info-card"><strong>Con quién</strong><br>${escapeHTML(s.conQuien)}</div>
    <div class="info-card"><strong>Contexto</strong><br>${escapeHTML(s.contexto)}</div>
    <div class="info-card"><strong>Qué quieres conseguir</strong><br>${escapeHTML(s.objetivo)}</div>
  </div>
  <div class="callout"><strong>Dificultad que puede aparecer:</strong> ${escapeHTML(s.dificultad)}</div>`,`Lee la escena y piensa qué información tendría que entender la otra persona al terminar tu explicación.`);
}

function renderVocab(){
  const cards = data.vocabulario.map((v,i)=>`<article class="card">
    <div class="vocab-word">${escapeHTML(v.term)}</div>
    ${level==='a2' && v.stress ? `<div class="meta">Pronunciación útil: <span class="stress">${escapeHTML(v.stress)}</span></div>`:''}
    ${audioControls(v.term)}
    <button type="button" class="reveal-btn js-vocab" aria-expanded="false" data-target="vocab-${i}">Ver significado${level==='a2'?' / Show meaning':''}</button>
    <div id="vocab-${i}" class="details">
      ${v.translation?`<div class="translation">${escapeHTML(v.translation)}</div>`:''}
      <p>${escapeHTML(v.meaning)}</p>
      <div class="example"><strong>Ejemplo:</strong> ${escapeHTML(v.example)}${audioControls(v.example)}</div>
      <p class="meta">${escapeHTML(v.extra)}</p>
    </div>
  </article>`).join('');
  const recall = level==='a2' ? `<div class="activity-box" style="margin-top:14px">
    <strong>Recuperación rápida</strong>
    <p>Antes de abrir una tarjeta, intenta recordar en español la palabra que corresponde a: <strong>follow-up</strong>.</p>
    <button type="button" class="action-btn js-recall">Mostrar respuesta</button>
    <div id="recallAnswer" class="feedback neutral">La expresión es <strong>seguimiento</strong>. En este módulo usarás mucho <strong>hacer seguimiento</strong>.</div>
  </div>`:'';
  return sectionShell(2,`<div class="cards">${cards}</div>${recall}`,'Abre las tarjetas solo cuando necesites confirmar el significado o el uso.');
}

function renderPhrases(){
  const groups = data.frases.map((g,gi)=>`<div class="function-block"><div class="function-title">${escapeHTML(g.group)}</div>${g.items.map((p,pi)=>`<div class="phrase">
    <div class="phrase-text">${escapeHTML(p.text)}</div>
    ${audioControls(p.text)}
    <button type="button" class="reveal-btn js-phrase" data-target="phrase-${gi}-${pi}" aria-expanded="false">Ver cuándo usarla</button>
    <div id="phrase-${gi}-${pi}" class="phrase-explain">${escapeHTML(p.use)}</div>
  </div>`).join('')}</div>`).join('');
  return sectionShell(3,groups,'No memorices una lista completa. Identifica qué función cumple cada frase y qué parte podrías adaptar.');
}

function renderBuilder(){
  let controls='';
  if(data.builder.mode==='conjugation'){
    controls = `<div class="builder-row">
      <label>Quién realiza la acción<select id="builderSubject">${data.builder.subjects.map(s=>`<option value="${s.id}">${escapeHTML(s.label)}</option>`).join('')}</select></label>
      <label>Verbo<select id="builderVerb">${data.builder.verbs.map((v,i)=>`<option value="${i}">${escapeHTML(v.label)}</option>`).join('')}</select></label>
      <label>Complemento<select id="builderComp">${data.builder.complements.map((c,i)=>`<option value="${i}">${escapeHTML(c)}</option>`).join('')}</select></label>
    </div>`;
  } else {
    controls = `<div class="builder-row">${data.builder.labels.map((label,i)=>`<label>${escapeHTML(label)}<select class="builderSegment" data-index="${i}">${data.builder.options[i].map((o,j)=>`<option value="${j}">${escapeHTML(o)}</option>`).join('')}</select></label>`).join('')}</div>`;
  }
  return sectionShell(4,`<div class="builder">
    ${controls}
    <p class="meta">${escapeHTML(data.builder.note)}</p>
    <div id="builderOutput" class="builder-output" aria-live="polite"></div>
    <div id="builderAudio"></div>
  </div>`,'Construye una frase y observa qué cambia cuando modificas el responsable, la acción o el contexto.');
}

function renderGrammar(){
  const blocks = data.gramatica.map((g,i)=>`<div class="accordion">
    <button type="button" class="js-accordion" data-target="gram-${i}" aria-expanded="false"><span>${escapeHTML(g.title)}</span><span aria-hidden="true">＋</span></button>
    <div id="gram-${i}" class="accordion-content">
      <p><strong>Situación:</strong> ${escapeHTML(g.situation)}</p>
      <p><strong>Intención:</strong> ${escapeHTML(g.intention)}</p>
      <p><strong>Estructura:</strong> <span class="pill">${escapeHTML(g.structure)}</span></p>
      <p>${escapeHTML(g.explanation)}</p>
      ${g.table?`<table class="rule-table">${g.table.map((r,ri)=>`<tr>${r.map(c=>ri===0?`<th>${escapeHTML(c)}</th>`:`<td>${escapeHTML(c)}</td>`).join('')}</tr>`).join('')}</table>`:''}
      <div class="meaning-blocks">${g.examples.map(ex=>`<div class="meaning-block">${escapeHTML(ex)}${audioControls(ex)}</div>`).join('')}</div>
    </div>
  </div>`).join('');
  return sectionShell(5,blocks,'Abre solo las explicaciones que necesites para usar mejor el presente dentro de esta situación profesional.');
}

function renderRegister(){
  const r = data.registro;
  return sectionShell(6,`<div class="activity-box">
    <p><strong>Contexto:</strong> ${escapeHTML(r.context)}</p>
    <p><strong>${escapeHTML(r.prompt)}</strong></p>
    <div class="option-list">${r.options.map((o,i)=>`<label class="option"><input type="radio" name="register" value="${i}"><div>${escapeHTML(o.text)}${audioControls(o.text)}</div></label>`).join('')}</div>
    <button type="button" class="primary-btn" id="checkRegister">Comprobar</button>
    <div id="registerFeedback" class="feedback"></div>
  </div>`,'Elige según claridad, relación profesional y efecto probable, no solo según gramática.');
}

function renderExample(){
  const e = data.ejemplo;
  return sectionShell(7,`<div class="example-block">
    <p><strong>${escapeHTML(e.intro)}</strong></p>
    ${level==='a2'?audioControls(e.lines.map(x=>x.text).join(' ')):''}
    ${e.lines.map((l,i)=>`<button type="button" class="example-line js-example-line" data-target="exfn-${i}">${escapeHTML(l.text)}</button><div id="exfn-${i}" class="example-function">${escapeHTML(l.fn)}${level==='a2'?audioControls(l.text):''}</div>`).join('')}
  </div>`,'Pulsa cada parte para descubrir qué función cumple dentro de la explicación.');
}

function renderExercises(){
  const html = data.ejercicios.map((ex,i)=>{
    let body='';
    if(ex.type==='fill'){
      body = `<label for="fill-${i}">Tu respuesta</label><input id="fill-${i}" type="text" autocomplete="off">${level==='a2'?audioControls(ex.prompt):''}`;
    } else {
      const inputType = ex.type==='multi' ? 'checkbox' : 'radio';
      body = `<div class="option-list">${ex.options.map((o,j)=>`<label class="option"><input type="${inputType}" name="ex-${i}" value="${j}"><div>${escapeHTML(o)}${level==='a2'?audioControls(o):''}</div></label>`).join('')}</div>`;
    }
    return `<div class="exercise" data-ex="${i}"><h4>${escapeHTML(ex.title)}</h4><p>${escapeHTML(ex.prompt)}</p>${body}<div class="exercise-actions"><button type="button" class="primary-btn js-check-ex" data-index="${i}">Comprobar</button><button type="button" class="retry-btn js-retry-ex" data-index="${i}">Volver a intentar</button></div><div id="ex-feedback-${i}" class="feedback"></div></div>`;
  }).join('');
  return sectionShell(8,html,'Prueba primero. Después compara el feedback y vuelve a intentar si lo necesitas.');
}

function renderPractice(){
  const p = data.practica;
  return sectionShell(9,`<div class="activity-box">
    <p><strong>Situación:</strong> ${escapeHTML(p.situation)}</p>
    <p><strong>Interlocutor:</strong> ${escapeHTML(p.interlocutor)}</p>
    <p><strong>Objetivo:</strong> ${escapeHTML(p.objetivo)}</p>
    <p><strong>Incluye:</strong></p><ul>${p.requisitos.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>
    <div class="support-list">${p.supports.map(s=>`<span class="support-chip">${escapeHTML(s)}</span>`).join('')}</div>
    ${level==='a2'?p.supports.map(s=>audioControls(s)).join(''):''}
    <label for="practiceText"><strong>Escribe tu respuesta</strong></label>
    <textarea id="practiceText" placeholder="Escribe aquí tu versión..."></textarea>
    <p class="meta">No se evalúa automáticamente. El objetivo es preparar una versión que puedas comparar y adaptar.</p>
  </div>`,'Ahora construye una respuesta propia con el nivel de autonomía correspondiente a tu ruta.');
}

function renderModel(){
  return sectionShell(10,`<p>Compara el modelo solo después de haber intentado tu propia respuesta.</p>
    <button type="button" class="primary-btn" id="showModel">Ver una posible respuesta</button>
    <div id="modelBox" class="model"><strong>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</strong><p>${escapeHTML(data.practica.model)}</p>${audioControls(data.practica.model)}</div>`,'El modelo sirve para comparar decisiones lingüísticas, no para copiar una única respuesta correcta.');
}

function renderChecklist(){
  return sectionShell(11,`<div class="checklist">${data.checklist.map((item,i)=>`<label class="check-item"><input type="checkbox" data-check="${i}"><span>${escapeHTML(item)}</span></label>`).join('')}</div>
    <div class="check-progress"><div class="check-track"><div id="checkBar" class="check-bar"></div></div><div id="checkLabel" class="meta">0 de ${data.checklist.length} completados</div></div>
    <div id="readyBox" class="ready">
      <h3 style="margin-top:0">🎯 Ya estás listo para practicar</h3>
      <p>No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p>
      <p>Durante los próximos siete días encontrarás retos relacionados con esta habilidad.</p>
      <!-- Inserta aquí la URL real del reto de hoy cuando esté disponible. -->
      <a class="cta-link" href="#">🔥 Ir al reto de hoy</a>
    </div>`,'Marca solo lo que realmente puedes hacer ahora. Si algo todavía no está claro, vuelve a la sección correspondiente.');
}

function updateBuilder(userAction=false){
  const out = qs('#builderOutput');
  const aud = qs('#builderAudio');
  if(!out) return;
  let text='';
  if(data.builder.mode==='conjugation'){
    const subject = qs('#builderSubject').value;
    const verb = data.builder.verbs[Number(qs('#builderVerb').value)];
    const comp = data.builder.complements[Number(qs('#builderComp').value)];
    const subjectLabel = data.builder.subjects.find(s=>s.id===subject).label;
    text = `${subjectLabel} ${verb.forms[subject]} ${comp}`;
  } else {
    const parts = qsa('.builderSegment').map((sel,i)=>data.builder.options[i][Number(sel.value)]);
    text = parts.join(' ').replace(/\s+([,.])/g,'$1');
  }
  out.textContent = text;
  aud.innerHTML = audioControls(text);
  bindAudio(aud);
  if(userAction) mark('builder');
}

function checkRegister(){
  const chosen = qs('input[name="register"]:checked');
  const fb = qs('#registerFeedback');
  if(!chosen){
    fb.className='feedback show neutral';
    fb.textContent='Selecciona una opción antes de comprobar.';
    return;
  }
  const opt = data.registro.options[Number(chosen.value)];
  fb.className='feedback show ' + (opt.tone==='good'?'good':opt.tone==='bad'?'bad':'neutral');
  fb.textContent=opt.feedback;
  mark('register');
}

function checkExercise(i){
  const ex=data.ejercicios[i];
  const root=qs(`[data-ex="${i}"]`);
  const fb=qs(`#ex-feedback-${i}`);
  let ok=false;
  if(ex.type==='fill'){
    const val=norm(qs('input[type="text"]',root).value);
    ok=ex.accepted.map(norm).includes(val);
  } else {
    const chosen=qsa(`input[name="ex-${i}"]:checked`,root).map(x=>Number(x.value)).sort((a,b)=>a-b);
    const correct=[...ex.correct].sort((a,b)=>a-b);
    ok=chosen.length===correct.length && chosen.every((v,idx)=>v===correct[idx]);
  }
  fb.className='feedback show '+(ok?'good':'neutral');
  fb.textContent=ok?ex.feedbackGood:ex.feedbackBad;
  mark('exercise-'+i);
}

function resetExercise(i){
  const root=qs(`[data-ex="${i}"]`);
  qsa('input',root).forEach(x=>{if(x.type==='text')x.value='';else x.checked=false;});
  const fb=qs(`#ex-feedback-${i}`);fb.className='feedback';fb.textContent='';
}

function updateChecklist(){
  const checks=qsa('[data-check]');
  const count=checks.filter(x=>x.checked).length;
  const pct=Math.round((count/checks.length)*100);
  qs('#checkBar').style.width=pct+'%';
  qs('#checkLabel').textContent=`${count} de ${checks.length} completados`;
  checks.forEach((x,i)=>{ if(x.checked) mark('check-'+i); });
  qs('#readyBox').classList.toggle('show',count===checks.length);
}

function bindAudio(root=document){
  qsa('.js-speak',root).forEach(btn=>{
    if(btn.dataset.bound) return;
    btn.dataset.bound='1';
    btn.addEventListener('click',()=>speak(btn.dataset.text,btn.dataset.slow==='true'));
  });
}

function bindDynamic(){
  bindAudio();
  qsa('.js-vocab').forEach(btn=>btn.addEventListener('click',()=>{
    const box=qs('#'+btn.dataset.target);const open=box.classList.toggle('open');btn.setAttribute('aria-expanded',open);mark('vocab-reveal');
  }));
  qsa('.js-phrase').forEach(btn=>btn.addEventListener('click',()=>{
    const box=qs('#'+btn.dataset.target);const open=box.classList.toggle('open');btn.setAttribute('aria-expanded',open);mark('phrase-reveal');
  }));
  qsa('.js-accordion').forEach(btn=>btn.addEventListener('click',()=>{
    const box=qs('#'+btn.dataset.target);const open=box.classList.toggle('open');btn.setAttribute('aria-expanded',open);btn.lastElementChild.textContent=open?'−':'＋';mark('grammar-reveal');
  }));
  qsa('.js-example-line').forEach(btn=>btn.addEventListener('click',()=>{
    qs('#'+btn.dataset.target).classList.toggle('open');mark('example-analyze');
  }));
  qsa('.prev-btn').forEach(btn=>btn.addEventListener('click',()=>{if(currentSection>0){currentSection--;renderNav();renderSection();window.scrollTo({top:0,behavior:'smooth'});}}));
  qsa('.next-btn').forEach(btn=>btn.addEventListener('click',()=>{if(currentSection<sectionMeta.length-1){currentSection++;renderNav();renderSection();window.scrollTo({top:0,behavior:'smooth'});}}));
  const recall=qs('.js-recall');if(recall)recall.addEventListener('click',()=>{qs('#recallAnswer').classList.add('show');mark('vocab-reveal');});
  if(qs('#builderOutput')){
    qsa('#builderSubject,#builderVerb,#builderComp,.builderSegment').forEach(el=>el.addEventListener('change',()=>updateBuilder(true)));
    updateBuilder();
  }
  if(qs('#checkRegister'))qs('#checkRegister').addEventListener('click',checkRegister);
  qsa('.js-check-ex').forEach(btn=>btn.addEventListener('click',()=>checkExercise(Number(btn.dataset.index))));
  qsa('.js-retry-ex').forEach(btn=>btn.addEventListener('click',()=>resetExercise(Number(btn.dataset.index))));
  if(qs('#practiceText'))qs('#practiceText').addEventListener('input',e=>{if(e.target.value.trim().length>=20)mark('practice');});
  if(qs('#showModel'))qs('#showModel').addEventListener('click',()=>{qs('#modelBox').classList.add('open');mark('model');});
  qsa('[data-check]').forEach(ch=>ch.addEventListener('change',updateChecklist));
}

qsa('.level-btn').forEach(btn=>btn.addEventListener('click',()=>selectLevel(btn.dataset.level)));
qs('#changeLevel').addEventListener('click',()=>{
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  qs('#app').classList.add('hidden');
  qs('#levelScreen').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});
qs('#sectionNav').addEventListener('click',e=>{
  const btn=e.target.closest('[data-section]');
  if(!btn)return;
  currentSection=Number(btn.dataset.section);
  renderNav();renderSection();window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Manejar objeciones y dar seguimiento comercial | La Oficina en Español</title>
<style>
:root{
  --azul:#003893;--amarillo:#FCD116;--rojo:#CE1126;--blanco:#FFFFFF;--negro:#000000;
  --texto:#172033;--muted:#5b6578;--borde:#d9e1ef;--fondo:#f4f7fb;--panel:#ffffff;
  --ok:#126b45;--ok-bg:#e9f7f0;--warn:#7a5200;--warn-bg:#fff6d9;--danger-bg:#fff0f2;
  --sombra:0 14px 35px rgba(0,56,147,.10);--radio:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:linear-gradient(180deg,#edf3ff 0,#f7f9fc 28%,#f4f7fb 100%);color:var(--texto);line-height:1.55}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--azul)}
.hidden{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* Selector inicial */
#levelScreen{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:
radial-gradient(circle at 10% 10%,rgba(252,209,22,.28),transparent 30%),
radial-gradient(circle at 90% 85%,rgba(0,56,147,.16),transparent 36%),#f7f9fc}
.level-shell{width:min(980px,100%)}
.brand-lockup{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--azul);font-weight:800}
.brand-mark{width:48px;height:48px;border-radius:14px;background:var(--azul);display:grid;place-items:center;color:var(--amarillo);font-size:26px;box-shadow:var(--sombra)}
.level-panel{background:rgba(255,255,255,.96);border:1px solid var(--borde);border-radius:28px;box-shadow:var(--sombra);padding:clamp(24px,4vw,44px)}
.level-panel h1{font-family:"Archivo Black",Arial Black,sans-serif;color:var(--azul);font-size:clamp(30px,5vw,50px);line-height:1.05;margin:0 0 10px}
.level-panel .intro{color:var(--muted);max-width:760px;margin:0 0 24px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.level-btn{border:2px solid var(--borde);background:#fff;border-radius:18px;padding:22px;text-align:left;min-height:210px;transition:.2s transform,.2s border-color,.2s box-shadow;display:flex;flex-direction:column;gap:8px;color:var(--texto)}
.level-btn:hover,.level-btn:focus-visible{transform:translateY(-2px);border-color:var(--azul);box-shadow:0 10px 25px rgba(0,56,147,.13);outline:none}
.level-btn .emoji{font-size:34px}.level-btn strong{font-size:20px;color:var(--azul)}.level-btn span:last-child{color:var(--muted)}

/* App */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--borde)}
.topbar-inner{max-width:1180px;margin:auto;padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.mini-brand{font-weight:900;color:var(--azul);white-space:nowrap}.route{font-size:14px;color:var(--texto)}
.change-level{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:8px 12px;color:var(--azul);font-weight:700}
.progress-wrap{max-width:1180px;margin:auto;padding:0 18px 10px;display:flex;gap:12px;align-items:center}
.progress-track{height:9px;background:#e6ebf4;border-radius:999px;overflow:hidden;flex:1}.progress-bar{height:100%;width:0;background:var(--azul);transition:width .25s ease}.progress-label{font-size:12px;font-weight:800;color:var(--azul);min-width:44px;text-align:right}

.hero{background:var(--azul);color:#fff;padding:34px 18px 30px;border-bottom:8px solid var(--amarillo)}
.hero-inner{max-width:1180px;margin:auto}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--amarillo)}
.hero h1{font-family:"Archivo Black",Arial Black,sans-serif;font-size:clamp(30px,5vw,54px);line-height:1.05;margin:8px 0 10px;max-width:950px}.hero p{margin:0;max-width:780px;color:#dce8ff}

.layout{max-width:1180px;margin:24px auto 50px;padding:0 18px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.sidebar{position:sticky;top:94px;background:#fff;border:1px solid var(--borde);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,56,147,.06)}
.sidebar h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 8px 10px}.section-nav{display:grid;gap:4px}.nav-btn{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;color:#475269;font-size:13px}.nav-btn:hover,.nav-btn:focus-visible{background:#eef4ff;color:var(--azul);outline:none}.nav-btn.active{background:#e8f0ff;color:var(--azul);font-weight:800}

.section{display:none;background:#fff;border:1px solid var(--borde);border-radius:var(--radio);box-shadow:0 8px 30px rgba(0,56,147,.06);padding:clamp(20px,3vw,34px);min-height:470px}.section.active{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-kicker{color:var(--azul);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.section h2{font-family:"Archivo Black",Arial Black,sans-serif;color:var(--azul);font-size:clamp(25px,4vw,36px);line-height:1.15;margin:5px 0 14px}.section h3{color:var(--azul);margin:22px 0 10px}.lead{font-size:18px}.muted{color:var(--muted)}
.section-footer{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--borde)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}.btn-primary{background:var(--azul);color:#fff}.btn-secondary{background:#edf3ff;color:var(--azul)}.btn-yellow{background:var(--amarillo);color:#1b1b1b}.btn:focus-visible,.audio-btn:focus-visible,.card-btn:focus-visible,.choice:focus-visible{outline:3px solid rgba(0,56,147,.28);outline-offset:2px}

.info-box{border-left:5px solid var(--amarillo);background:#fff9da;padding:16px 18px;border-radius:12px;margin:18px 0}.situation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{background:#f6f8fc;border:1px solid var(--borde);border-radius:12px;padding:14px}.mini strong{display:block;color:var(--azul);margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.vocab-card,.phrase-card{border:1px solid var(--borde);border-radius:15px;overflow:hidden;background:#fff}.card-btn{width:100%;border:0;background:#f8faff;padding:16px;text-align:left;font-weight:850;color:var(--azul);display:flex;justify-content:space-between;align-items:center;gap:10px}.card-detail{display:none;padding:16px;border-top:1px solid var(--borde)}.card-detail.open{display:block}.example{background:#f2f6fd;border-radius:10px;padding:11px 12px;margin-top:10px}.english{color:#555f71;font-style:italic}.pron{display:inline-block;background:#eef4ff;color:var(--azul);padding:3px 8px;border-radius:999px;font-weight:800;font-size:13px;margin:6px 0}
.audio-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.audio-btn{border:1px solid #c7d5ee;background:#fff;color:var(--azul);border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800}.audio-status{font-size:12px;color:var(--muted);margin-top:8px}

.function-group{border-top:1px solid var(--borde);padding-top:18px;margin-top:18px}.function-group:first-of-type{border-top:0;padding-top:0}.function-label{display:inline-block;background:#e8f0ff;color:var(--azul);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;margin-bottom:10px}
.builder{background:#f8faff;border:1px solid var(--borde);border-radius:16px;padding:18px}.builder-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}.field label{font-size:13px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}.field select,.field input,.practice textarea{width:100%;border:1px solid #bdc9dc;border-radius:10px;padding:11px;background:#fff;color:var(--texto)}.built-output{border:2px solid var(--azul);background:#fff;border-radius:12px;padding:14px;font-weight:800;color:var(--azul);margin-top:13px}

.grammar-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.flow-step{background:#f5f8fd;border:1px solid var(--borde);padding:12px;border-radius:12px}.flow-step strong{color:var(--azul);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.reveal{border:1px solid var(--borde);border-radius:12px;margin-top:10px;overflow:hidden}.reveal button{width:100%;border:0;background:#f8faff;padding:12px;text-align:left;color:var(--azul);font-weight:850}.reveal-content{display:none;padding:14px}.reveal-content.open{display:block}

.scenario{background:#f8faff;border:1px solid var(--borde);border-radius:15px;padding:18px}.choices{display:grid;gap:9px;margin-top:14px}.choice{border:1px solid #bdc9dc;background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--texto)}.choice:hover{border-color:var(--azul)}.choice.selected{border-color:var(--azul);background:#edf3ff}.feedback{margin-top:12px;padding:12px;border-radius:10px}.feedback.good{background:var(--ok-bg);color:var(--ok)}.feedback.warn{background:var(--warn-bg);color:var(--warn)}.feedback.neutral{background:#edf3ff;color:#284c87}

.dialogue{border:1px solid var(--borde);border-radius:16px;overflow:hidden}.turn{padding:14px 16px;border-bottom:1px solid var(--borde)}.turn:last-child{border-bottom:0}.speaker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:var(--muted)}.seller{background:#f4f8ff}.client{background:#fff}.hotspot{border:0;border-bottom:2px dotted var(--azul);background:transparent;color:inherit;padding:0;font-weight:800}.annotation{display:none;background:#fff9da;border-left:4px solid var(--amarillo);padding:10px 12px;margin-top:8px;border-radius:8px}.annotation.open{display:block}

.quiz-list{display:grid;gap:16px}.quiz{border:1px solid var(--borde);border-radius:15px;padding:16px}.quiz h3{margin:0 0 8px;font-size:17px}.quiz .choices{margin-top:10px}.retry{margin-top:10px;border:0;background:#edf3ff;color:var(--azul);font-weight:800;border-radius:9px;padding:8px 10px}.token-bank,.answer-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.token{border:1px solid #bdc9dc;background:#fff;border-radius:999px;padding:8px 11px}.token.used{opacity:.35}.answer-line{min-height:44px;border:1px dashed #9aa9c1;border-radius:10px;padding:8px}.answer-token{background:#e8f0ff;color:var(--azul);border-radius:999px;padding:7px 10px}

.practice{background:#f8faff;border:1px solid var(--borde);border-radius:16px;padding:18px}.requirements{margin:10px 0 16px;padding-left:20px}.support-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{background:#fff;border:1px solid #bdc9dc;border-radius:999px;padding:7px 10px;font-size:13px}.char-count{text-align:right;color:var(--muted);font-size:12px;margin-top:4px}.model{display:none;margin-top:14px;border-left:5px solid var(--azul);background:#edf3ff;padding:16px;border-radius:12px}.model.open{display:block}

.checklist{display:grid;gap:10px}.check-item{display:flex;gap:11px;align-items:flex-start;background:#f8faff;border:1px solid var(--borde);border-radius:12px;padding:13px}.check-item input{width:20px;height:20px;margin-top:2px}.check-track{height:8px;background:#e6ebf4;border-radius:999px;overflow:hidden;margin-top:14px}.check-bar{height:100%;width:0;background:var(--azul);transition:width .2s ease}.check-progress{margin-top:7px;font-weight:800;color:var(--azul)}
.ready{display:none;margin-top:18px;background:linear-gradient(135deg,var(--azul),#0d54b5);color:#fff;border-radius:18px;padding:22px}.ready.open{display:block}.ready h3{color:#fff;margin-top:0}.ready p{color:#dce8ff}.challenge-link{display:inline-block;text-decoration:none;background:var(--amarillo);color:#111;font-weight:900;border-radius:12px;padding:12px 16px;margin-top:6px}

@media(max-width:900px){.level-grid{grid-template-columns:1fr}.level-btn{min-height:auto}.layout{grid-template-columns:1fr}.sidebar{position:static;overflow:auto}.section-nav{display:flex;overflow:auto;padding-bottom:3px}.nav-btn{white-space:nowrap;border:1px solid var(--borde)}.topbar-inner{grid-template-columns:1fr auto}.route{grid-column:1/-1;grid-row:2}.mini-brand{font-size:14px}.cards{grid-template-columns:1fr}.grammar-flow{grid-template-columns:1fr 1fr}.situation-grid{grid-template-columns:1fr}.builder-row{grid-template-columns:1fr}}
@media(max-width:560px){#levelScreen{padding:14px}.level-panel{padding:20px}.topbar-inner{gap:8px}.hero{padding-top:24px}.layout{padding:0 12px}.section{padding:18px}.grammar-flow{grid-template-columns:1fr}.section-footer{flex-direction:column-reverse}.section-footer .btn{width:100%}.audio-btn{flex:1}.hero h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="levelScreen" aria-labelledby="levelTitle">
  <div class="level-shell">
    <div class="brand-lockup"><span class="brand-mark">💼</span><span>La Oficina en Español</span></div>
    <div class="level-panel">
      <h1 id="levelTitle">¿Cuál es tu nivel de español?</h1>
      <p class="intro">Selecciona tu ruta para adaptar el apoyo, la dificultad y la práctica. Todos trabajan la misma habilidad profesional.</p>
      <div class="level-grid">
        <button type="button" class="level-btn" data-level="a2"><span class="emoji">🌱</span><strong>A2 — Principiante</strong><span>Ya puedo comprender y usar expresiones frecuentes y frases sencillas. Necesito vocabulario, estructuras, ejemplos y apoyo para comunicarme en situaciones profesionales.</span></button>
        <button type="button" class="level-btn" data-level="b1"><span class="emoji">💼</span><strong>B1 — Intermedio</strong><span>Ya puedo comunicarme en situaciones habituales y quiero responder con más precisión, libertad y naturalidad en el trabajo.</span></button>
        <button type="button" class="level-btn" data-level="b2"><span class="emoji">🚀</span><strong>B2 — Avanzado</strong><span>Puedo comunicarme con bastante autonomía y quiero trabajar precisión, matiz, registro, reacción y situaciones profesionales más exigentes.</span></button>
      </div>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="mini-brand">La Oficina en Español</div>
      <div id="routeLabel" class="route" aria-live="polite"></div>
      <button id="changeLevel" class="change-level" type="button">Cambiar nivel</button>
    </div>
    <div class="progress-wrap" aria-label="Progreso del módulo">
      <div class="progress-track"><div id="progressBar" class="progress-bar" role="progressbar" aria-label="Progreso del módulo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
      <div id="progressLabel" class="progress-label">0%</div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Habilidad profesional de la semana</div>
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
    </div>
  </section>

  <div class="layout">
    <aside class="sidebar" aria-label="Navegación del módulo">
      <h2>Secciones</h2>
      <nav id="sectionNav" class="section-nav"></nav>
    </aside>
    <main id="mainContent"></main>
  </div>
</div>

function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function keyText(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,70)}

function addTarget(id){progressTargets.add(id)}
function complete(id){if(progressTargets.has(id)){completed.add(id);updateProgress()}}
function updateProgress(){
  const total=Math.max(progressTargets.size,1); const pct=Math.min(100,Math.round(completed.size/total*100));
  const bar=document.getElementById("progressBar"); bar.style.width=pct+"%"; bar.setAttribute("aria-valuenow",String(pct)); bar.setAttribute("aria-valuetext",`${pct}% completado`); document.getElementById("progressLabel").textContent=pct+"%";
}

function loadVoices(){if("speechSynthesis" in window) voices=window.speechSynthesis.getVoices()||[]}
if("speechSynthesis" in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function spanishVoice(){
  const prefer=[/es[-_](CO|MX|US|419)/i,/es[-_][A-Z]{2}/i,/^es/i];
  for(const p of prefer){const v=voices.find(v=>p.test(v.lang||""));if(v)return v} return null;
}
function speakSpanish(text,slow=false,button=null){
  if(!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance==="undefined"){showAudioStatus(button,"Audio no disponible en este navegador / Audio unavailable.");return}
  if(activeAudioButton && activeAudioButton!==button)showAudioStatus(activeAudioButton,"");
  window.speechSynthesis.cancel();
  activeAudioButton=button;
  const u=new SpeechSynthesisUtterance(text); u.lang="es-CO"; u.rate=slow?.72:.92; u.pitch=1;
  const v=spanishVoice(); if(v)u.voice=v;
  u.onstart=()=>showAudioStatus(button,slow?"Reproduciendo lento… / Playing slowly…":"Reproduciendo… / Playing…");
  u.onend=()=>{showAudioStatus(button,"");if(activeAudioButton===button)activeAudioButton=null};
  u.onerror=(event)=>{if(event.error!=="interrupted"&&event.error!=="canceled")showAudioStatus(button,"No fue posible reproducir el audio.");else showAudioStatus(button,"");if(activeAudioButton===button)activeAudioButton=null};
  window.speechSynthesis.speak(u);
}
function showAudioStatus(button,msg){if(!button)return; const row=button.closest(".audio-wrap"); if(!row)return; const status=row.querySelector(".audio-status"); if(status)status.textContent=msg}
function audioControls(text){
  if(currentLevel!=="a2")return ""; const safe=encodeURIComponent(text);
  return `<div class="audio-wrap"><div class="audio-row"><button type="button" class="audio-btn" data-speak="${safe}" data-rate="normal" aria-label="Escuchar: ${esc(text)}">🔊 Escuchar / Listen</button><button type="button" class="audio-btn" data-speak="${safe}" data-rate="slow" aria-label="Escuchar lentamente: ${esc(text)}">🐢 Lento / Slow</button></div><div class="audio-status" aria-live="polite"></div></div>`;
}

function setupProgressTargets(data){

});

function handleChoiceQuiz(btn){
  const box=btn.closest(".quiz"), qi=Number(box.dataset.q), q=contenido[currentLevel].quiz[qi],j=Number(btn.dataset.j);box.querySelectorAll(".quiz-choice").forEach(x=>x.disabled=true);btn.classList.add("selected");
  const ok=j===q.correct;box.querySelector(".quiz-feedback").innerHTML=`<div class="feedback ${ok?"good":"warn"}">${ok?"Funciona. ":"Todavía no. "}${esc(q.explanation)}</div>`;box.querySelector(".retry-choice").classList.toggle("hidden",ok);if(ok)complete(`quiz-${qi}`)
}
function resetChoice(box){box.querySelectorAll(".quiz-choice").forEach(x=>{x.disabled=false;x.classList.remove("selected")});box.querySelector(".quiz-feedback").innerHTML="";box.querySelector(".retry-choice").classList.add("hidden")}
function handleJudgmentQuiz(btn){
  const box=btn.closest(".quiz"),qi=Number(box.dataset.q),q=contenido[currentLevel].quiz[qi],j=Number(btn.dataset.j),o=q.options[j];box.querySelectorAll(".judgment-choice").forEach(x=>x.classList.remove("selected"));btn.classList.add("selected");
  box.querySelector(".quiz-feedback").innerHTML=`<div class="feedback ${o.quality}">${esc(o.feedback)}</div>`;complete(`quiz-${qi}`)
}
function handleToken(btn){
  if(btn.classList.contains("used"))return;const box=btn.closest(".quiz"),line=box.querySelector(".answer-line"),span=document.createElement("button");span.type="button";span.className="answer-token";span.textContent=btn.textContent;span.dataset.source=btn.dataset.token;line.appendChild(span);btn.classList.add("used");
  span.addEventListener("click",()=>{btn.classList.remove("used");span.remove()});
}
function checkBuild(box){
  const qi=Number(box.dataset.q),q=contenido[currentLevel].quiz[qi],text=[...box.querySelectorAll(".answer-token")].map(x=>x.textContent).join(" ").replace(/\s+([.;,])/g,"$1");const ok=text===q.answer;
  box.querySelector(".quiz-feedback").innerHTML=`<div class="feedback ${ok?"good":"warn"}">${ok?"Bien organizado. ":"Revisa el orden. "}${esc(q.explanation)}${ok&&currentLevel==="a2"?audioControls(q.answer):""}</div>`;box.querySelector(".reset-build").classList.toggle("hidden",ok);if(ok)complete(`quiz-${qi}`)
}
function resetBuild(box){box.querySelectorAll(".token").forEach(x=>x.classList.remove("used"));box.querySelector(".answer-line").innerHTML="";box.querySelector(".quiz-feedback").innerHTML="";box.querySelector(".reset-build").classList.add("hidden")}

document.addEventListener("input",e=>{
  if(e.target.id==="practiceText"){
    const n=e.target.value.trim().length;document.getElementById("charCount").textContent=e.target.value.length;const min={a2:40,b1:120,b2:220}[currentLevel]||40;if(n>=min){complete("practice");document.getElementById("practiceHint").textContent="Ya tienes suficiente desarrollo para comparar tu respuesta con el modelo cuando quieras."}else{completed.delete("practice");updateProgress();document.getElementById("practiceHint").textContent=`Continúa desarrollando tu respuesta. Orientación mínima para esta ruta: ${min} caracteres.`}
  }
});
document.addEventListener("change",e=>{
  if(e.target.classList.contains("final-check")){
    const checks=[...document.querySelectorAll(".final-check")],done=checks.filter(c=>c.checked).length;checks.forEach(c=>{const id=`check-${c.dataset.i}`;if(c.checked)complete(id);else completed.delete(id)});updateProgress();
    const cpct=Math.round(done/checks.length*100);document.getElementById("checkBar").style.width=cpct+"%";document.getElementById("checkProgress").textContent=`${done} de ${checks.length} completados (${cpct}%)`;document.getElementById("readyBox").classList.toggle("open",done===checks.length)
  }
});

// Evita que el enlace de reto con href="#" lleve al inicio mientras no exista URL real.
document.addEventListener("click",e=>{const a=e.target.closest(".challenge-link");if(a&&a.getAttribute("href")==="#")e.preventDefault()});
</script>

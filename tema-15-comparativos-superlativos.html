<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Tema 15 | Comparativos y superlativos | La Oficina en Español</title>
<meta name="description" content="Módulo interactivo de Business Spanish para comparar opciones y propuestas usando comparativos y superlativos.">
<style>
:root{
  --azul:#003893; --azul2:#082d70; --amarillo:#FCD116; --rojo:#CE1126;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:linear-gradient(180deg,#eef4ff 0,#fff 260px);color:var(--texto);line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:var(--azul)}
.hidden{display:none!important}
.screen{min-height:100vh}
.level-screen{display:grid;place-items:center;padding:28px}
.level-wrap{max-width:980px;width:100%}
.brand{font-weight:900;letter-spacing:.02em;color:var(--azul);font-size:1.15rem}
.level-title{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin:.45rem 0 1rem;color:var(--azul2)}
.level-sub{max-width:720px;color:#536076;margin-bottom:24px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.level-card{background:#fff;border:2px solid var(--borde);border-radius:22px;padding:24px;text-align:left;box-shadow:var(--sombra);transition:.2s transform,.2s border-color}
.level-card:hover,.level-card:focus-visible{transform:translateY(-3px);border-color:var(--azul);outline:none}
.level-card .emoji{font-size:2rem}
.level-card h2{margin:.45rem 0;font-size:1.25rem;color:var(--azul)}
.level-card p{margin:0;color:#5f6b7f}
.app{max-width:1180px;margin:auto;padding:0 18px 60px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);margin:0 -18px;padding:10px 18px}
.topbar-inner{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.route{font-weight:800;color:var(--azul)}
.change-level{border:1px solid var(--borde);background:#fff;color:var(--azul);border-radius:999px;padding:8px 12px}
.progress-wrap{grid-column:1/-1}
.progress-label{display:flex;justify-content:space-between;font-size:.82rem;color:#647086;margin-bottom:5px}
.progress-track{height:9px;background:#e6ecf5;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--azul);transition:width .3s}
.hero{padding:38px 0 18px}
.eyebrow{display:inline-block;background:var(--amarillo);color:#171717;font-weight:900;padding:6px 10px;border-radius:999px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.hero h1{font-size:clamp(2rem,4vw,3.4rem);line-height:1.08;color:var(--azul2);margin:14px 0 12px}
.hero p{max-width:780px;color:#566277;font-size:1.08rem}
.nav-sections{display:flex;gap:8px;overflow-x:auto;padding:10px 0 18px;scrollbar-width:thin}
.nav-sections button{white-space:nowrap;border:1px solid var(--borde);background:#fff;border-radius:999px;padding:9px 13px;color:#435066}
.nav-sections button.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.section{display:none;background:#fff;border:1px solid var(--borde);border-radius:24px;padding:clamp(20px,3vw,34px);box-shadow:var(--sombra);margin-bottom:18px}
.section.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.section h2{color:var(--azul);font-size:1.55rem;margin-top:0}
.section h3{color:var(--azul2);margin-bottom:.4rem}
.callout{background:#f3f7ff;border-left:5px solid var(--azul);padding:16px;border-radius:14px;margin:14px 0}
.tip{background:#fff8cf;border-left:5px solid var(--amarillo);padding:14px;border-radius:14px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{border:1px solid var(--borde);border-radius:18px;padding:16px;background:#fbfdff}
.flip{width:100%;text-align:left;border:0;background:transparent;padding:0}
.flip strong{color:var(--azul2);font-size:1.05rem}
.reveal{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--borde)}
.card.open .reveal{display:block}
.audio-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.audio-btn{border:1px solid #cad5e6;background:#fff;color:var(--azul);border-radius:999px;padding:7px 10px;font-size:.87rem}
.audio-status{font-size:.86rem;color:#68758a;margin-top:8px}
.phrase-group{margin:18px 0}
.phrase{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;border:1px solid var(--borde);border-radius:16px;padding:14px;margin:9px 0;background:#fff}
.phrase .meta{font-size:.9rem;color:#637087}
.use-btn{border:0;background:#edf3ff;color:var(--azul);border-radius:10px;padding:7px 10px;font-size:.86rem}
.use-note{display:none;margin-top:8px;color:#4f5b70}
.phrase.show-note .use-note{display:block}
.builder{display:grid;gap:12px}
.builder-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.builder select,.builder input,.text-input,textarea{width:100%;border:1px solid #cfd9e8;border-radius:12px;padding:11px;background:#fff;color:var(--texto)}
.result{background:#eef5ff;border:1px solid #c9d9f4;border-radius:14px;padding:15px;font-weight:700}
.grammar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grammar-card{border:1px solid var(--borde);border-radius:16px;padding:15px}
.formula{display:inline-block;background:#edf3ff;color:var(--azul2);font-weight:900;padding:6px 9px;border-radius:8px}
.activity{border:1px solid var(--borde);border-radius:18px;padding:16px;margin:12px 0}
.options{display:grid;gap:8px;margin-top:10px}
.option{border:1px solid #ccd7e6;background:#fff;padding:11px;border-radius:12px;text-align:left}
.option.selected{border-color:var(--azul);background:#edf3ff}
.option.good{border-color:#2f8f61;background:#eefaf4}
.option.warn{border-color:#d99520;background:#fff8e8}
.feedback{margin-top:10px;padding:11px;border-radius:11px;background:#f5f7fa;display:none}
.feedback.show{display:block}
.example-box{border:1px solid var(--borde);border-radius:18px;padding:18px;background:#fbfdff}
.function-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:6px 9px;font-size:.85rem}
.exercise input[type="text"]{margin-top:8px}
.btn{border:0;background:var(--azul);color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}
.btn.secondary{background:#edf3ff;color:var(--azul)}
.btn.yellow{background:var(--amarillo);color:#171717}
.btn.red{background:var(--rojo)}
.btn-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.practice-box{display:grid;gap:12px}
.requirements{margin:0;padding-left:1.2rem}
textarea{min-height:160px;resize:vertical}
.model{display:none;margin-top:14px;border:1px solid var(--borde);background:#f7faff;border-radius:16px;padding:16px}
.model.show{display:block}
.checklist{display:grid;gap:10px}
.check-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borde);border-radius:14px;padding:12px}
.check-item input{width:20px;height:20px;margin-top:2px}
.final-ready{display:none;text-align:center;background:linear-gradient(135deg,#003893,#082d70);color:#fff;border-radius:22px;padding:26px;margin-top:18px}
.final-ready.show{display:block}
.challenge-link{display:inline-block;margin-top:12px;background:var(--amarillo);color:#111;text-decoration:none;font-weight:900;padding:12px 18px;border-radius:12px}
.section-footer{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.muted{color:#667388;font-size:.92rem}
.small{font-size:.86rem}
kbd{background:#eef1f5;border:1px solid #d3dae4;border-bottom-width:2px;border-radius:5px;padding:1px 5px}
@media(max-width:800px){
  .level-grid,.cards,.grammar-grid{grid-template-columns:1fr}
  .builder-row{grid-template-columns:1fr}
  .phrase{grid-template-columns:1fr}
  .topbar-inner{grid-template-columns:1fr auto}
  .section{border-radius:18px;padding:20px}
}
@media(max-width:520px){
  .level-screen{padding:18px}
  .level-card{padding:18px}
  .hero{padding-top:26px}
  .topbar{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>

<section id="levelScreen" class="screen level-screen" aria-labelledby="levelTitle">
  <div class="level-wrap">
    <div class="brand">LA OFICINA EN ESPAÑOL</div>
    <h1 id="levelTitle" class="level-title">¿Cuál es tu nivel de español?</h1>
    <p class="level-sub">Selecciona una ruta para adaptar el apoyo, la dificultad y las actividades. Puedes cambiarla después sin recargar la página.</p>
    <div class="level-grid">
      <button type="button" class="level-card" data-level="a2">
        <div class="emoji">🌱</div>

        <p>Ya puedo comprender y usar expresiones frecuentes y frases sencillas. Necesito vocabulario, estructuras, ejemplos y apoyo para comunicarme en situaciones profesionales.</p>
      </button>

        <div class="emoji">💼</div>
        <h2>B1 — Intermedio</h2>
        <p>Ya puedo comunicarme en situaciones habituales y quiero responder con más precisión, libertad y naturalidad en el trabajo.</p>
      </button>
      <button type="button" class="level-card" data-level="b2">
        <div class="emoji">🚀</div>
        <h2>B2 — Avanzado</h2>
        <p>Puedo comunicarme con bastante autonomía y quiero trabajar precisión, matiz, registro, reacción y situaciones profesionales más exigentes.</p>
      </button>
    </div>
  </div>
</section>

<main id="app" class="app hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div id="routeLabel" class="route"></div>
      <button type="button" id="changeLevel" class="change-level">Cambiar nivel</button>
      <div class="progress-wrap">
        <div class="progress-label"><span>Progreso del módulo</span><strong id="progressText">0%</strong></div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </div>
  </div>

  <header class="hero">
    <span class="eyebrow">Tema 15 · Herramientas lingüísticas</span>
    <h1 id="heroTitle"></h1>
    <p id="heroIntro"></p>
  </header>

  <nav id="sectionNav" class="nav-sections" aria-label="Secciones del módulo"></nav>
  <div id="sections"></div>
</main>

<script>
// ===== CONTENIDO EDITABLE DE LA SEMANA =====
const contenido = {
  a2: {
    route:"🌱 A2 — Principiante",
    habilidad:"Comparar opciones y propuestas antes de decidir",
    intro:"Usa comparativos y superlativos para explicar de forma sencilla qué opción es más rápida, menos costosa, mejor o la más conveniente en una situación de trabajo.",
    objetivo:"Al terminar esta semana podrás comparar dos o más opciones de trabajo y explicar cuál prefieres usando frases sencillas y claras.",
    situacion:{

    ],
    frases:[
      {grupo:"Comparar", text:"La opción A es más económica que la opción B.", uso:"Úsala para comparar una característica entre dos opciones."},

    ],
    builder:{
      labels:["Opción","comparación","referencia"],

      ]

    gramatica:[
      {titulo:"Más + adjetivo + que", formula:"A + es más + adjetivo + que + B", texto:"Compara dos opciones y muestra que A tiene una característica en mayor grado.", ejemplo:"La propuesta A es más flexible que la propuesta B."},
      {titulo:"Menos + adjetivo + que", formula:"A + es menos + adjetivo + que + B", texto:"Muestra que A tiene una característica en menor grado.", ejemplo:"El proveedor A es menos rápido que el proveedor B."},
      {titulo:"Igual de + adjetivo", formula:"A + es igual de + adjetivo + que + B", texto:"Indica que las dos opciones tienen el mismo grado de una característica.", ejemplo:"Las dos opciones son igual de seguras."},
      {titulo:"Superlativo", formula:"el / la + más + adjetivo", texto:"Sirve para destacar una opción dentro de un grupo.", ejemplo:"Esta es la opción más económica."},

    },
    ejemplo:{
      texto:"Tenemos dos propuestas. La opción A es más económica que la B, pero la opción B es más rápida. Para este proyecto, prefiero la opción B porque el plazo es más importante. Es la opción más conveniente.",
      partes:["Tenemos dos propuestas. → introduce las opciones","más económica que / más rápida → compara","prefiero... porque → recomienda y justifica","la más conveniente → destaca la mejor opción del grupo"]

    ejercicios:[
      {q:"Completa: La propuesta A es ___ económica que la B.", type:"mc", options:["más","muy","la más"], answer:0, fb:"Para comparar dos opciones usamos «más + adjetivo + que»."},
      {q:"Elige la frase correcta para dos opciones con la misma flexibilidad.", type:"mc", options:["A es la flexible que B.","A es igual de flexible que B.","A es más igual que B."], answer:1, fb:"«Igual de + adjetivo + que» expresa igualdad."},
      {q:"Completa: Este proveedor es ___ que el anterior. (bueno)", type:"text", answers:["mejor"], fb:"El comparativo de «bueno» es «mejor»."},

    ],
    practica:{
      situacion:"Tu equipo debe elegir entre dos servicios de entrega. Servicio A: USD 120, entrega en 2 días, pocos cambios. Servicio B: USD 145, entrega en 1 día, cambios flexibles.",

      objetivo:"Recomendar una opción.",

    checklist:[
      "Puedo comparar dos opciones con «más... que» o «menos... que».",
      "Puedo usar «mejor» y «peor» en una comparación.",
      "Puedo identificar una opción como «la más...» o «la menos...».",
      "Puedo explicar brevemente qué opción prefiero y por qué.",
      "Puedo recomendar una opción en una situación profesional sencilla."
    ]
  },
  b1: {
    route:"💼 B1 — Intermedio",
    habilidad:"Comparar opciones y propuestas antes de decidir",
    intro:"Compara alternativas con mayor precisión, organiza ventajas y desventajas y justifica una recomendación utilizando comparativos, superlativos y conectores.",

    situacion:{
      texto:"Participas en una reunión de proyecto. El equipo evalúa tres proveedores con diferencias de precio, plazo, soporte y flexibilidad. Debes presentar una comparación y recomendar una opción.",
      dificultad:"No basta con decir cuál es mejor: necesitas ordenar los criterios y explicar por qué una ventaja pesa más que otra."
    },
    vocab:[
      {term:"rentable", expl:"Que ofrece una buena relación entre coste y resultado.", ex:"La propuesta B parece más rentable a medio plazo.", extra:"Colocaciones: opción rentable, solución rentable."},
      {term:"competitivo/a", expl:"Que ofrece condiciones favorables frente a otras opciones.", ex:"El proveedor A tiene un precio más competitivo.", extra:"Frecuente con precio, oferta, condiciones."},
      {term:"fiable", expl:"Que ofrece seguridad o confianza en el cumplimiento.", ex:"El proveedor C es el más fiable en los plazos.", extra:"Alternativa: confiable, según variedad regional."},
      {term:"ventaja", expl:"Aspecto favorable frente a otra opción.", ex:"La principal ventaja de B es el soporte técnico.", extra:"Contraste útil: ventaja / desventaja."},
      {term:"condiciones", expl:"Términos de una propuesta o acuerdo.", ex:"C ofrece mejores condiciones de pago.", extra:"También: condiciones comerciales, contractuales, de entrega."},
      {term:"prioridad", expl:"Criterio que tiene más importancia en una decisión.", ex:"Si la prioridad es el plazo, B es la mejor alternativa.", extra:"Conector útil: si la prioridad es..., conviene..."}
    ],
    frases:[
      {grupo:"Contrastar", text:"La opción A es más económica, mientras que la B ofrece un plazo más corto.", uso:"«Mientras que» contrapone dos características sin presentar una como necesariamente superior."},
      {grupo:"Contrastar", text:"A tiene un precio más competitivo; en cambio, B ofrece mejores condiciones de soporte.", uso:"«En cambio» marca un contraste claro entre ventajas diferentes."},

      {grupo:"Matizar", text:"Aunque C es la opción más cara, también es la más fiable.", uso:"Permite reconocer una desventaja antes de destacar una ventaja."},

      ]
    },
    gramatica:[
      {titulo:"Comparación de superioridad e inferioridad", formula:"más / menos + adjetivo + que", texto:"Permite comparar un mismo criterio entre dos alternativas.", ejemplo:"B es menos costosa que C, pero también menos flexible."},

let nivel = null;
let currentSection = 0;
let completed = new Set();
let exerciseState = {};
let selectedVoice = null;

const levelScreen = document.getElementById("levelScreen");
const app = document.getElementById("app");
const sectionsEl = document.getElementById("sections");
const navEl = document.getElementById("sectionNav");
const routeLabel = document.getElementById("routeLabel");

document.querySelectorAll("[data-level]").forEach(btn=>{
  btn.addEventListener("click",()=>selectLevel(btn.dataset.level));
});
document.getElementById("changeLevel").addEventListener("click",()=>{
  speechSynthesisSafeCancel();
  app.classList.add("hidden");
  levelScreen.classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
});

function selectLevel(lvl){
  nivel=lvl; currentSection=0; completed=new Set(); exerciseState={};
  levelScreen.classList.add("hidden"); app.classList.remove("hidden");
  renderModule();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderModule(){
  const c=contenido[nivel];
  routeLabel.textContent="Tu ruta: "+c.route;
  document.getElementById("heroTitle").textContent=c.habilidad;
  document.getElementById("heroIntro").textContent=c.intro;
  navEl.innerHTML="";
  sectionsEl.innerHTML="";
  sectionDefs.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=`${i+1}. ${d[1]}`;
    b.title=d[2];
    b.addEventListener("click",()=>showSection(i));
    navEl.appendChild(b);
    sectionsEl.appendChild(renderSection(d[0],i,c));
  });
  showSection(0,false);
  updateProgress();
}

function renderSection(key,i,c){
  const sec=document.createElement("section");
  sec.className="section"; sec.id="sec-"+key; sec.dataset.index=i;
  const title=`<h2>${sectionDefs[i][1]} ${sectionDefs[i][2]}</h2>`;
  let body="";
  if(key==="objetivo"){
    body=`<div class="callout"><strong>${esc(c.objetivo)}</strong></div><p class="muted">Al final del módulo comprobarás si ya puedes hacerlo.</p>`;
  }
  if(key==="situacion"){
    body=`<p>${esc(c.situacion.texto)}</p><div class="tip"><strong>Dificultad:</strong> ${esc(c.situacion.dificultad)}</div>`;
  }
  if(key==="vocab"){
    body=`<div class="cards">${c.vocab.map((v,idx)=>`
      <article class="card vocab-card">
        <button class="flip" aria-expanded="false" onclick="toggleCard(this); markAction('vocab-${idx}')">
          <strong>${esc(v.term)}</strong><div class="muted small">Pulsa para revelar</div>
        </button>
        <div class="reveal">
          ${nivel==="a2"?`<p><strong>English:</strong> ${esc(v.en||"")}</p>`:""}
          <p>${esc(v.expl)}</p><p><strong>Ejemplo:</strong> ${esc(v.ex)}</p>
          ${v.extra?`<p class="muted">${esc(v.extra)}</p>`:""}
          ${nivel==="a2" && v.stress?`<p class="muted">Acento: <strong>${esc(v.stress)}</strong></p>`:""}
          ${audioControls(v.term+"."+v.ex,"vocab-"+idx)}
        </div>
      </article>`).join("")}</div>
      ${nivel==="a2"?renderRecall(c):""}`;
  }
  if(key==="frases"){
    const groups=[...new Set(c.frases.map(x=>x.grupo))];
    body=groups.map(g=>`<div class="phrase-group"><h3>${esc(g)}</h3>${c.frases.filter(x=>x.grupo===g).map((p,idx)=>`
      <div class="phrase">
        <div><strong>${esc(p.text)}</strong><div class="use-note">${esc(p.uso)}</div>${nivel==="a2"?audioControls(p.text,"phrase-"+idx):""}</div>
        <button class="use-btn" onclick="toggleUse(this); markAction('phrase-${slug(p.text)}')">Ver cuándo usarla</button>
      </div>`).join("")}</div>`).join("");
  }
  if(key==="builder"){
    body=`<p>Combina los bloques y observa cómo cambia el mensaje.</p>
      <div class="builder">
        <div class="builder-row">${c.builder.selects.map((arr,sidx)=>`<label>${esc(c.builder.labels[sidx])}<select data-builder="${sidx}">${arr.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>`).join("")}</div>
        <div id="builderResult" class="result"></div>
        <div class="btn-row">${nivel==="a2"?`<button class="audio-btn" id="builderListen">🔊 Escuchar / Listen</button><button class="audio-btn" id="builderSlow">🐢 Lento / Slow</button>`:""}<button class="btn secondary" id="builderNew">Probar combinación</button></div>
      </div>`;
  }
  if(key==="gramatica"){
    body=`<p>La gramática aparece aquí porque te ayuda a comparar y decidir en situaciones de trabajo.</p><div class="grammar-grid">${c.gramatica.map((g,idx)=>`
      <article class="grammar-card"><h3>${esc(g.titulo)}</h3><span class="formula">${esc(g.formula)}</span><p>${esc(g.texto)}</p><p><strong>Ejemplo:</strong> ${esc(g.ejemplo)}</p>${nivel==="a2"?audioControls(g.ejemplo,"grammar-"+idx):""}</article>`).join("")}</div>`;
  }
  if(key==="registro"){
    body=`<p><strong>Contexto:</strong> ${esc(c.registro.contexto)}</p><div class="activity"><p>Elige la formulación que funciona mejor en este contexto.</p><div class="options">${c.registro.opciones.map((o,idx)=>`
      <button class="option" onclick="chooseRegister(this,${idx})">${esc(o.text)}</button>${nivel==="a2"?audioControls(o.text,"reg-"+idx):""}`).join("")}</div><div id="registerFeedback" class="feedback"></div></div>`;
  }
  if(key==="ejemplo"){
    body=`<div class="example-box"><p style="font-size:1.08rem"><strong>${esc(c.ejemplo.texto)}</strong></p>${nivel==="a2"?audioControls(c.ejemplo.texto,"full-example"):""}<div class="function-tags">${c.ejemplo.partes.map(p=>`<button class="tag" onclick="this.nextElementSibling?.classList.toggle('hidden'); markAction('tag-${slug(p)}')">${esc(p.split("→")[0].trim())}</button><span class="hidden muted small">${esc(p)}</span>`).join("")}</div></div>`;
  }
  if(key==="ejercicios"){
    body=c.ejercicios.map((e,idx)=>renderExercise(e,idx)).join("");
  }
  if(key==="practica"){
    body=`<div class="practice-box"><div class="callout">${esc(c.practica.situacion)}</div><p><strong>Interlocutor:</strong> ${esc(c.practica.interlocutor)}</p><p><strong>Objetivo:</strong> ${esc(c.practica.objetivo)}</p><div><strong>Tu respuesta debe:</strong><ul class="requirements">${c.practica.requisitos.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>${c.practica.apoyos?.length?`<div class="tip"><strong>${nivel==="a2"?"Estructuras que puedes usar:":"Recursos útiles:"}</strong><ul>${c.practica.apoyos.map((a,idx)=>`<li>${esc(a)} ${nivel==="a2"?`<button class="audio-btn" onclick="speakText('${js(a)}',false); markAction('support-${idx}')">🔊 Escuchar</button>`:""}</li>`).join("")}</ul></div>`:""}<label for="practiceText"><strong>Escribe tu respuesta:</strong></label><textarea id="practiceText" placeholder="Escribe aquí..."></textarea><button class="btn" id="savePractice">He terminado mi respuesta</button><div id="practiceMsg" class="feedback"></div></div>`;
  }
  if(key==="modelo"){
    const modelBlocks = nivel==="a2" ? c.practica.modelo.split(/(?<=[.!?])\s+/).filter(Boolean) : [];
    body=`<p>Compara tu respuesta con una posibilidad. No necesitas escribir exactamente lo mismo.</p><button id="showModel" class="btn yellow">Ver una posible respuesta</button><div id="modelBox" class="model"><strong>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</strong><p>${esc(c.practica.modelo)}</p>${nivel==="a2"?audioControls(c.practica.modelo,"model")+`<div class="phrase-group"><h3>Escucha por bloques / Listen in chunks</h3>${modelBlocks.map((block,bi)=>`<div class="phrase"><div><strong>${esc(block)}</strong>${audioControls(block,"model-block-"+bi)}</div></div>`).join("")}</div>`:""}</div>`;
  }
  if(key==="checklist"){
    body=`<div class="checklist">${c.checklist.map((x,idx)=>`<label class="check-item"><input type="checkbox" data-check="${idx}"><span>${esc(x)}</span></label>`).join("")}</div><div id="checkProgress" class="muted" style="margin-top:10px"></div><div id="finalReady" class="final-ready"><h2 style="color:white">🎯 Ya estás listo para practicar</h2><p>No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p><!-- Reemplazar # por la URL real del reto diario --><a class="challenge-link" href="#">🔥 Ir al reto de hoy</a></div>`;
  }
  sec.innerHTML=title+body+sectionFooter(i);
  setTimeout(()=>wireSection(key,i,c),0);
  return sec;
}

function sectionFooter(i){
  return `<div class="section-footer"><button class="btn secondary" ${i===0?"disabled":""} onclick="showSection(${i-1})">Anterior</button><button class="btn" ${i===sectionDefs.length-1?"disabled":""} onclick="showSection(${i+1})">Siguiente</button></div>`;
}

function renderRecall(c){
  const item=c.vocab[0];
  return `<div class="activity"><h3>Recupera una palabra</h3><p>¿Qué palabra española corresponde a <strong>${esc(item.en)}</strong>?</p><div class="options">
    <button class="option" onclick="recallAnswer(this,true,'${js(item.term)}')">${esc(item.term)}</button>
    <button class="option" onclick="recallAnswer(this,false,'${js(item.term)}')">${esc(c.vocab[1].term)}</button>
    <button class="option" onclick="recallAnswer(this,false,'${js(item.term)}')">${esc(c.vocab[2].term)}</button>
  </div><div class="feedback"></div></div>`;
}

function renderExercise(e,idx){
  if(e.type==="mc"){
    return `<div class="activity exercise" data-ex="${idx}"><p><strong>${esc(e.q)}</strong></p>${nivel==="a2"?audioControls(e.q,"exercise-question-"+idx):""}<div class="options">${e.options.map((o,oi)=>`<div><button class="option" onclick="answerMC(this,${idx},${oi})">${esc(o)}</button>${nivel==="a2"?audioControls(o,"exercise-option-"+idx+"-"+oi):""}</div>`).join("")}</div><div class="feedback"></div><button class="btn secondary hidden retry" onclick="retryExercise(${idx})">Volver a intentar</button></div>`;
  }
  return `<div class="activity exercise" data-ex="${idx}"><p><strong>${esc(e.q)}</strong></p>${nivel==="a2"?audioControls(e.q,"exercise-question-"+idx):""}<label>Tu respuesta<input class="text-input" type="text" data-answer="${idx}"></label><div class="btn-row"><button class="btn" onclick="answerText(${idx})">Comprobar</button></div><div class="feedback"></div><button class="btn secondary hidden retry" onclick="retryExercise(${idx})">Volver a intentar</button></div>`;
}

function wireSection(key,i,c){
  if(key==="builder"){
    const sels=[...document.querySelectorAll("[data-builder]")];
    const result=document.getElementById("builderResult");
    const update=()=>{
      result.textContent=sels.map(s=>s.value).join(" ");
      markAction("builder");
    };
    sels.forEach(s=>s.addEventListener("change",update));
    document.getElementById("builderNew").addEventListener("click",()=>{sels.forEach(s=>s.selectedIndex=(s.selectedIndex+1)%s.options.length);update()});
    update();
    if(nivel==="a2"){
      document.getElementById("builderListen").onclick=()=>speakText(result.textContent,false);
      document.getElementById("builderSlow").onclick=()=>speakText(result.textContent,true);
    }
  }
  if(key==="practica"){
    document.getElementById("savePractice").addEventListener("click",()=>{
      const txt=document.getElementById("practiceText").value.trim();
      const fb=document.getElementById("practiceMsg");
      fb.classList.add("show");
      if(txt.length<20){fb.textContent="Tu respuesta todavía es muy breve. Añade al menos una comparación y una razón.";return}
      fb.textContent="Respuesta registrada para esta práctica. Compárala después con el modelo y revisa tus decisiones lingüísticas.";
      markAction("practice-final");
    });
  }
  if(key==="modelo"){
    document.getElementById("showModel").addEventListener("click",()=>{
      document.getElementById("modelBox").classList.add("show");
      markAction("model-view");
    });
  }
  if(key==="checklist"){
    document.querySelectorAll("[data-check]").forEach(ch=>ch.addEventListener("change",updateChecklist));
    updateChecklist();
  }
}

function showSection(i,scroll=true){
  if(i<0||i>=sectionDefs.length)return;
  currentSection=i;
  document.querySelectorAll(".section").forEach((s,idx)=>s.classList.toggle("active",idx===i));
  [...navEl.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));
  completed.add("section-"+i);
  updateProgress();
  if(scroll) document.getElementById("sec-"+sectionDefs[i][0]).scrollIntoView({behavior:"smooth",block:"start"});
}

function toggleCard(btn){
  const card=btn.closest(".card"); card.classList.toggle("open");
  btn.setAttribute("aria-expanded",card.classList.contains("open"));
}
function toggleUse(btn){btn.closest(".phrase").classList.toggle("show-note")}
function chooseRegister(btn,idx){
  const c=contenido[nivel].registro.opciones[idx];
  btn.parentElement.querySelectorAll(".option").forEach(x=>x.classList.remove("selected","good","warn"));
  btn.classList.add("selected",c.type);
  const fb=document.getElementById("registerFeedback"); fb.textContent=c.fb; fb.classList.add("show");
  markAction("register");
}
function recallAnswer(btn,ok,correct){
  const box=btn.closest(".activity"),fb=box.querySelector(".feedback");
  box.querySelectorAll(".option").forEach(x=>x.classList.remove("good","warn"));
  btn.classList.add(ok?"good":"warn"); fb.classList.add("show");
  fb.textContent=ok?"Sí. Esa es la palabra.":"Todavía no. La respuesta es «"+correct+"».";
  markAction("recall");
}
function answerMC(btn,idx,choice){
  const e=contenido[nivel].ejercicios[idx],box=btn.closest(".exercise"),fb=box.querySelector(".feedback");
  box.querySelectorAll(".option").forEach(x=>x.classList.remove("good","warn","selected"));
  const ok=choice===e.answer; btn.classList.add(ok?"good":"warn"); fb.classList.add("show"); fb.textContent=e.fb;
  box.querySelector(".retry").classList.remove("hidden");
  if(ok){exerciseState[idx]=true;markAction("exercise-"+idx)}
}
function answerText(idx){
  const e=contenido[nivel].ejercicios[idx],box=document.querySelector(`[data-ex="${idx}"]`),inp=box.querySelector("input"),fb=box.querySelector(".feedback");
  const val=normalize(inp.value),ok=e.answers.some(a=>normalize(a)===val);
  fb.classList.add("show"); fb.textContent=ok?e.fb:`Revisa la forma. ${e.fb}`;
  box.querySelector(".retry").classList.remove("hidden");
  if(ok){exerciseState[idx]=true;markAction("exercise-"+idx)}
}
function retryExercise(idx){
  const box=document.querySelector(`[data-ex="${idx}"]`); box.querySelector(".feedback").classList.remove("show");
  box.querySelectorAll(".option").forEach(x=>x.classList.remove("good","warn","selected"));
  const inp=box.querySelector("input"); if(inp) inp.value="";
}
function updateChecklist(){
  const checks=[...document.querySelectorAll("[data-check]")],done=checks.filter(x=>x.checked).length;
  checks.forEach((c,idx)=>{if(c.checked)completed.add("check-"+idx);else completed.delete("check-"+idx)});
  const cp=document.getElementById("checkProgress"); if(cp)cp.textContent=`${done} de ${checks.length} capacidades marcadas`;
  const final=document.getElementById("finalReady"); if(final) final.classList.toggle("show",done===checks.length);
  if(done===checks.length)completed.add("checklist-complete"); else completed.delete("checklist-complete");
  updateProgress();
}

function markAction(id){completed.add(id);updateProgress()}
function updateProgress(){
  // Acciones distintas, no clics repetidos.
  const c=contenido[nivel];
  const totalSections=sectionDefs.length;
  const activityTargets = nivel === "a2"
    ? ["builder","register","practice-final","model-view","recall"]
    : ["builder","register","practice-final","model-view"];
  const baseTargets=totalSections + c.ejercicios.length + c.checklist.length + activityTargets.length;
  let meaningful=[...completed].filter(x=>
    x.startsWith("section-")||x.startsWith("exercise-")||x.startsWith("check-")||
    activityTargets.includes(x)
  ).length;
  const pct=Math.min(100,Math.round((meaningful/baseTargets)*100));
  document.getElementById("progressText").textContent=pct+"%";
  document.getElementById("progressBar").style.width=pct+"%";
  document.querySelector(".progress-track").setAttribute("aria-valuenow",pct);
}

function audioControls(text,id){
  if(nivel!=="a2")return "";
  return `<div class="audio-row"><button class="audio-btn" aria-label="Escuchar pronunciación de ${attr(text)}" onclick="speakText('${js(text)}',false); markAction('audio-${id}')">🔊 Escuchar / Listen</button><button class="audio-btn" aria-label="Escuchar lentamente ${attr(text)}" onclick="speakText('${js(text)}',true); markAction('audio-${id}')">🐢 Lento / Slow</button></div>`;
}
function loadSpanishVoice(){
  if(!("speechSynthesis" in window))return null;
  const voices=window.speechSynthesis.getVoices();
  const prefs=["es-CO","es-US","es-MX","es-419","es-AR","es-CL","es-PE","es-ES"];
  for(const p of prefs){const v=voices.find(v=>v.lang&&v.lang.toLowerCase()===p.toLowerCase());if(v)return v}
  return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("es"))||null;
}
function speakText(text,slow=false){
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){alert("La síntesis de voz no está disponible en este navegador.");return}
  window.speechSynthesis.cancel();
  selectedVoice=loadSpanishVoice();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=selectedVoice?.lang||"es-CO"; if(selectedVoice)u.voice=selectedVoice;
  u.rate=slow?.72:.94; u.pitch=1;
  window.speechSynthesis.speak(u);
}
function speechSynthesisSafeCancel(){if("speechSynthesis" in window)window.speechSynthesis.cancel()}
if("speechSynthesis" in window){window.speechSynthesis.onvoiceschanged=()=>{selectedVoice=loadSpanishVoice()}}

function normalize(s){return s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function slug(s){return normalize(s).replace(/[^a-z0-9]+/g,"-").slice(0,28)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function attr(s){return esc(String(s)).replace(/"/g,"&quot;")}
function js(s){return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," ")}
</script>

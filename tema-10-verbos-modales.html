<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Tema 10 | Verbos modales para el trabajo</title>
<style>
:root{--blue:#003893;--blue2:#08285f;--yellow:#FCD116;--red:#CE1126;--white:#fff;--black:#000;--ink:#172033;--muted:#5c667a;--bg:#f4f7fb;--line:#dce3ef;--ok:#16794a;--warn:#9a5a00;--radius:18px;--shadow:0 12px 30px rgba(0,56,147,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.level-gate{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#eef4ff 0%,#fff 55%,#fff8cf 100%)}
.gate-card{width:min(980px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,48px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--blue);margin-bottom:20px}.brand-mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(180deg,var(--yellow) 0 45%,var(--blue) 45% 74%,var(--red) 74%)}
.gate-card h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;margin:0 0 12px;color:var(--blue2)}.lead{font-size:1.06rem;color:var(--muted);max-width:760px;margin:0 0 28px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.level-btn{border:2px solid var(--line);background:#fff;border-radius:20px;padding:22px;text-align:left;min-height:220px;transition:.2s}.level-btn:hover,.level-btn:focus-visible{border-color:var(--blue);transform:translateY(-2px);outline:3px solid rgba(0,56,147,.12)}.level-btn strong{display:block;font-size:1.18rem;color:var(--blue);margin:8px 0}.level-btn span{color:var(--muted);font-size:.95rem}.level-icon{font-size:2rem}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1180px;margin:auto;padding:12px 18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px}.route{font-weight:800;color:var(--blue);white-space:nowrap}.progress-wrap{display:flex;align-items:center;gap:10px}.progress-track{height:10px;background:#e6ebf3;border-radius:999px;overflow:hidden;flex:1}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#2e6fdb);transition:.3s}.progress-text{font-size:.86rem;color:var(--muted);min-width:42px;text-align:right}.change-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;color:var(--blue);font-weight:700}
.hero{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:50px 20px 44px}.hero-inner{max-width:1080px;margin:auto}.eyebrow{display:inline-block;background:var(--yellow);color:#172033;font-weight:900;border-radius:999px;padding:6px 11px;font-size:.8rem;letter-spacing:.03em}.hero h1{font-size:clamp(2.1rem,5vw,4.2rem);line-height:1.05;margin:16px 0 12px;max-width:920px}.hero p{max-width:800px;margin:0;color:#dce8ff;font-size:1.06rem}
.layout{max-width:1180px;margin:0 auto;padding:26px 18px 60px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px}.side{position:sticky;top:78px;align-self:start}.side-nav{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}.side-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;color:#344056;font-size:.9rem}.side-nav button:hover,.side-nav button.active{background:#eef4ff;color:var(--blue);font-weight:800}
.section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}.section-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.section-head h2{font-size:1.25rem;margin:0;color:var(--blue2)}.section-body{padding:22px}.kicker{font-size:.85rem;color:var(--muted);font-weight:700}.panel{background:#f8faff;border:1px solid #e3eaf5;border-radius:14px;padding:16px;margin:12px 0}.panel.yellow{background:#fffbe6;border-color:#f1df76}.panel.red{background:#fff2f4;border-color:#f3c1c9}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#edf3ff;color:var(--blue);font-size:.8rem;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.flip{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.flip-top{width:100%;border:0;background:#f8faff;text-align:left;padding:16px;font-weight:800;color:var(--blue2);display:flex;justify-content:space-between;gap:8px}.flip-body{padding:0 16px 16px}.audio-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.audio-btn{border:1px solid #b8c8e8;background:#fff;color:var(--blue);border-radius:999px;padding:7px 10px;font-size:.86rem;font-weight:700}.audio-note{font-size:.8rem;color:var(--muted);margin-top:6px}
.phrase{border-left:4px solid var(--blue);padding:12px 14px;background:#f8faff;border-radius:0 12px 12px 0;margin:10px 0}.phrase strong{display:block}.phrase .usage{display:none;color:var(--muted);margin-top:6px}.link-btn{border:0;background:transparent;color:var(--blue);font-weight:800;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.builder{display:grid;gap:12px}.builder label{font-weight:800}.builder select,.builder input,.practice textarea{width:100%;border:1px solid #bdc8d9;border-radius:12px;padding:12px;background:#fff}.result-box{border:2px dashed #a8bbe3;background:#f7faff;border-radius:14px;padding:16px;font-weight:800;color:var(--blue2)}
.grammar-card{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.grammar-card h3{margin:0 0 8px;color:var(--blue2)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#edf3ff;border-radius:10px;padding:10px;color:var(--blue2);font-weight:800}
.choice{display:grid;gap:10px;margin:12px 0}.choice button{border:1px solid #c8d2e2;background:#fff;border-radius:12px;padding:12px;text-align:left}.choice button:hover,.choice button:focus-visible{border-color:var(--blue);outline:2px solid rgba(0,56,147,.08)}.choice button.selected{border-color:var(--blue);background:#edf3ff}.feedback{margin-top:10px;padding:12px;border-radius:12px;background:#f4f7fb;color:#374258}.feedback.good{background:#ecf8f1;color:#145a38}.feedback.note{background:#fff8df;color:#704700}
.example{background:#102a5a;color:#fff;border-radius:16px;padding:18px}.example p{margin:.45rem 0}.example .mark{display:inline-block;border-bottom:2px dotted var(--yellow);cursor:pointer}.function-note{margin-top:12px;background:#fff;color:var(--ink);border-radius:10px;padding:10px}
.exercise{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.exercise h3{font-size:1rem;margin:0 0 10px}.retry{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;margin-top:8px}.text-answer{width:100%;padding:11px;border:1px solid #bdc8d9;border-radius:10px}
.practice textarea{min-height:170px;resize:vertical}.requirements{margin:0;padding-left:20px}.model{display:none;margin-top:12px;border-left:4px solid var(--yellow);background:#fffbe6;padding:15px;border-radius:0 12px 12px 0}.model.show{display:block}
.checklist{display:grid;gap:10px}.check-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px}.check-item input{margin-top:4px;transform:scale(1.2)}.check-progress{margin-top:14px}.check-progress-track{height:9px;background:#e6ebf3;border-radius:999px;overflow:hidden}.check-progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#2e6fdb);transition:.25s}.check-progress-text{margin-top:7px;font-size:.86rem;color:var(--muted);font-weight:700}.choice-audio{margin-top:7px}.final-ready{display:none;margin-top:16px;background:linear-gradient(135deg,#eef4ff,#fff9d7);border:1px solid #c9d6f0;border-radius:16px;padding:20px}.final-ready.show{display:block}.challenge-link{display:inline-block;margin-top:10px;background:var(--red);color:#fff;text-decoration:none;font-weight:900;border-radius:12px;padding:12px 16px}
.section-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.nav-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:800;color:var(--blue)}.nav-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
footer{max-width:1180px;margin:0 auto 40px;padding:0 18px;color:var(--muted);font-size:.88rem}footer a{color:var(--blue)}
@media(max-width:900px){.level-grid{grid-template-columns:1fr}.level-btn{min-height:auto}.layout{grid-template-columns:1fr}.side{position:static}.side-nav{display:flex;overflow:auto;gap:4px}.side-nav button{white-space:nowrap;width:auto}.topbar-inner{grid-template-columns:1fr auto}.progress-wrap{grid-column:1/-1;grid-row:2}.route{white-space:normal}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.cards,.grid2,.grid3{grid-template-columns:1fr}.section-head,.section-body{padding:16px}.topbar-inner{padding:10px 12px}.hero{padding:34px 16px 30px}.layout{padding:18px 12px 48px}.level-gate{padding:14px}.gate-card{padding:22px 16px}.change-btn{padding:8px 10px;font-size:.85rem}}
</style>
</head>
<body>
<div id="levelGate" class="level-gate">
  <div class="gate-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>La Oficina en Español</div>
    <h1>¿Cuál es tu nivel de español?</h1>
    <p class="lead">Selecciona tu ruta para adaptar el apoyo, los ejemplos y la dificultad. Trabajarás la misma habilidad profesional desde tu nivel actual.</p>
    <div class="level-grid">
      <button type="button" class="level-btn" data-level="a2"><span class="level-icon">🌱</span><strong>A2 — Principiante</strong><span>Ya puedo comprender y usar expresiones frecuentes y frases sencillas. Necesito vocabulario, estructuras, ejemplos y apoyo para comunicarme en situaciones profesionales.</span></button>
      <button type="button" class="level-btn" data-level="b1"><span class="level-icon">💼</span><strong>B1 — Intermedio</strong><span>Ya puedo comunicarme en situaciones habituales y quiero responder con más precisión, libertad y naturalidad en el trabajo.</span></button>
      <button type="button" class="level-btn" data-level="b2"><span class="level-icon">🚀</span><strong>B2 — Avanzado</strong><span>Puedo comunicarme con bastante autonomía y quiero trabajar precisión, matiz, registro, reacción y situaciones profesionales más exigentes.</span></button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div id="routeLabel" class="route"></div>
      <div class="progress-wrap" aria-label="Progreso del módulo"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="progressText" class="progress-text">0%</div></div>
      <button id="changeLevel" type="button" class="change-btn">Cambiar nivel</button>
    </div>
  </div>
  <header class="hero"><div class="hero-inner"><span class="eyebrow">TEMA 10 · HERRAMIENTAS LINGÜÍSTICAS</span><h1 id="heroTitle"></h1><p id="heroSubtitle"></p></div></header>
  <div class="layout">
    <aside class="side"><nav id="sideNav" class="side-nav" aria-label="Secciones del módulo"></nav></aside>
    <main id="content"></main>
  </div>
  <footer>La Oficina en Español · <a href="https://laoficinaenespanol.com" target="_blank" rel="noopener">Español para trabajar</a></footer>
</div>

<script>
// ===== CONTENIDO EDITABLE DE LA SEMANA =====
const contenido = {
  habilidad: "Usar poder, deber, querer y necesitar para actuar en el trabajo",
  subtitulo: "Expresa capacidad, obligación, intención y necesidad con precisión en reuniones, proyectos, clientes y coordinación de tareas.",
  a2: {
    ruta:"🌱 A2 — Principiante",
    objetivo:"Al terminar esta semana podrás decir qué puedes hacer, qué debes hacer, qué quieres hacer y qué necesitas hacer para avanzar una tarea o conversación profesional.",
    situacion:"Trabajas con un equipo que prepara una entrega para un cliente. En una reunión breve necesitas explicar qué puedes hacer hoy, qué debes terminar, qué quieres revisar con tu compañera y qué necesitas recibir antes de enviar la versión final.",
    vocabulario:[
      {t:"poder",en:"can / to be able to",exp:"Expresa capacidad, posibilidad o permiso.",ej:"Puedo enviar el informe esta tarde.",extra:"Estructura útil: poder + infinitivo.",pron:"PO-der"},
      {t:"deber",en:"should / must",exp:"Expresa obligación o recomendación.",ej:"Debemos revisar los datos antes de enviar el informe.",extra:"En trabajo, “deber + infinitivo” puede expresar una obligación clara.",pron:"de-BER"},
      {t:"querer",en:"want / to want",exp:"Expresa intención o preferencia.",ej:"Quiero hablar con el cliente antes de cambiar la fecha.",extra:"Estructura útil: querer + infinitivo.",pron:"que-RER"},
      {t:"necesitar",en:"need / to need",exp:"Expresa una necesidad.",ej:"Necesito recibir la aprobación hoy.",extra:"Puedes usar necesitar + sustantivo o necesitar + infinitivo.",pron:"ne-ce-si-TAR"},
      {t:"entregar",en:"to deliver / submit",exp:"Dar o enviar un trabajo, documento o producto terminado.",ej:"Podemos entregar la propuesta mañana.",extra:"Muy frecuente con proyecto, informe, propuesta y pedido.",pron:"en-tre-GAR"},
      {t:"pendiente",en:"pending",exp:"Algo que todavía no está terminado o resuelto.",ej:"Debemos revisar dos puntos pendientes.",extra:"Expresión útil: tarea pendiente / punto pendiente.",pron:"pen-DIEN-te"}
    ],
    frases:[
      {grupo:"Decir lo que puedes hacer",items:[{t:"Puedo revisar el documento ahora.",uso:"Capacidad o disponibilidad actual."},{t:"Podemos terminarlo hoy.",uso:"Capacidad del equipo."}]},
      {grupo:"Expresar obligación",items:[{t:"Debo enviar la respuesta antes de las cinco.",uso:"Responsabilidad personal."},{t:"Debemos confirmar la fecha con el cliente.",uso:"Obligación compartida."}]},
      {grupo:"Expresar intención",items:[{t:"Quiero revisar este punto contigo.",uso:"Intención profesional directa y clara."},{t:"Queremos proponer una fecha diferente.",uso:"Intención del equipo."}]},
      {grupo:"Expresar necesidad",items:[{t:"Necesito la aprobación del cliente.",uso:"Necesidad de una cosa."},{t:"Necesitamos hablar con el proveedor.",uso:"Necesidad de realizar una acción."}]}
    ],
    builder:{intro:"Construye un mensaje breve para una reunión de seguimiento.",fields:[
      {label:"1. Lo que puedes hacer",options:["Puedo revisar el informe hoy.","Podemos enviar la propuesta esta tarde.","Puedo llamar al proveedor ahora."]},
      {label:"2. Lo que debes hacer",options:["Debo confirmar la fecha.","Debemos corregir dos datos.","Debo terminar la presentación."]},
      {label:"3. Lo que necesitas",options:["Necesito la aprobación del cliente.","Necesitamos recibir el precio final.","Necesito hablar con el equipo técnico."]}
    ]},
    grammar:[
      {title:"Modal + infinitivo",situation:"Quieres decir qué acción puedes, debes, quieres o necesitas realizar.",intention:"Expresar capacidad, obligación, intención o necesidad.",structure:"poder / deber / querer / necesitar + infinitivo",explanation:"El segundo verbo va en infinitivo: revisar, enviar, hablar, confirmar. Solo conjugas el primer verbo.",examples:["Puedo revisar el contrato.","Debemos enviar la factura.","Quiero hablar con el cliente.","Necesito confirmar la fecha."]},
      {title:"Necesitar + sustantivo",situation:"No necesitas expresar una acción, sino una cosa o información.",intention:"Pedir o identificar un recurso necesario.",structure:"necesitar + sustantivo",explanation:"También puedes usar “necesitar” directamente con una cosa: información, aprobación, documento, tiempo.",examples:["Necesito la aprobación.","Necesitamos más información."]},
      {title:"Poder para posibilidad o disponibilidad",situation:"En una reunión quieres ofrecer una acción posible.",intention:"Decir qué opción está disponible.",structure:"puedo / podemos + infinitivo",explanation:"“Puedo” y “podemos” son muy útiles para ofrecer soluciones sencillas.",examples:["Puedo enviarlo hoy.","Podemos cambiar la reunión al jueves."]}
    ],
    register:{context:"Un cliente pregunta si puedes enviar la propuesta hoy.",prompt:"¿Qué respuesta funciona mejor con un cliente?",options:[
      {text:"Sí, puedo enviarla antes de las cinco.",quality:"good",feedback:"Es clara, profesional y confirma una acción y un plazo."},
      {text:"Quiero enviarla.",quality:"note",feedback:"Expresa intención, pero no confirma si realmente puedes hacerlo hoy."},
      {text:"Tengo que hacerlo.",quality:"note",feedback:"Expresa obligación personal, pero no responde de forma directa a la pregunta del cliente."}
    ]},
    example:{intro:"En una reunión de seguimiento, puedes organizar tu intervención con los cuatro verbos.",text:[
      {t:"Puedo revisar la versión final esta mañana.",f:"Poder: dices qué acción está dentro de tu capacidad o disponibilidad."},
      {t:"Debo confirmar dos datos con Finanzas.",f:"Deber: indicas una responsabilidad."},
      {t:"Quiero hablar con el cliente antes de hacer el cambio.",f:"Querer: expresas una intención."},
      {t:"Necesito recibir la aprobación antes de las tres.",f:"Necesitar: señalas una condición necesaria para avanzar."}
    ]},
    exercises:[
      {type:"mc",q:"Tienes disponibilidad para hacer una llamada esta tarde. ¿Qué frase expresa mejor esa capacidad?",ops:["Debo llamar esta tarde.","Puedo llamar esta tarde.","Necesito llamar esta tarde."],correct:1,exp:"“Puedo + infinitivo” expresa capacidad o disponibilidad."},
      {type:"mc",q:"El informe no puede salir sin la firma del gerente. ¿Qué frase expresa la necesidad?",ops:["Quiero la firma del gerente.","Necesito la firma del gerente.","Puedo la firma del gerente."],correct:1,exp:"“Necesito + sustantivo” expresa que algo hace falta para continuar."},
      {type:"mc",q:"Selecciona la frase correctamente construida.",ops:["Debemos revisamos el contrato.","Debemos revisar el contrato.","Debemos revisando el contrato."],correct:1,exp:"Después de “debemos”, el segundo verbo va en infinitivo: revisar."},
      {type:"input",q:"Completa con una forma de poder: “Yo ___ enviar el documento hoy.”",answer:"puedo",exp:"Con “yo”, el presente de poder es “puedo”."}
    ],
    practica:{situacion:"Estás en una reunión rápida con tu supervisora. El cliente quiere la propuesta hoy. Tú puedes terminar el texto, debes confirmar el precio, quieres revisar una condición con tu compañera y necesitas la aprobación final.",requisitos:["Di qué puedes hacer.","Di qué debes hacer.","Di qué quieres revisar.","Di qué necesitas antes de enviar."],apoyos:["Puedo + infinitivo…","Debo + infinitivo…","Quiero + infinitivo…","Necesito + sustantivo / infinitivo…"],modelo:"Puedo terminar el texto esta mañana. Debo confirmar el precio con Finanzas. Quiero revisar una condición con Marta. Necesito la aprobación final antes de enviar la propuesta."},
    checklist:["Puedo usar poder + infinitivo para hablar de capacidad o disponibilidad.","Puedo usar deber + infinitivo para expresar una obligación.","Puedo usar querer + infinitivo para expresar una intención.","Puedo usar necesitar + sustantivo o infinitivo para expresar una necesidad.","Puedo combinar estos verbos en un mensaje profesional breve."]
  },
  b1: {
    ruta:"💼 B1 — Intermedio",
    objetivo:"Al terminar esta semana podrás distinguir capacidad, obligación, intención y necesidad, y combinar poder, deber, querer y necesitar para organizar propuestas, responsabilidades y próximos pasos en conversaciones profesionales.",
    situacion:"Coordinas un proyecto con tu equipo y un cliente. Hay una fecha comprometida, una aprobación pendiente y varias tareas repartidas. En una reunión de seguimiento necesitas explicar qué es posible hacer, qué responsabilidades deben cumplirse, qué cambio quieres proponer y qué información necesitas para tomar una decisión.",
    vocabulario:[
      {t:"disponibilidad",exp:"Capacidad real de una persona o recurso para actuar en un momento determinado.",ej:"Tenemos disponibilidad para hacer la prueba el jueves.",extra:"Colocaciones: confirmar disponibilidad, tener disponibilidad."},
      {t:"compromiso",exp:"Responsabilidad o acuerdo asumido con otra persona o equipo.",ej:"Debemos cumplir el compromiso acordado con el cliente.",extra:"Colocaciones: asumir, cumplir, mantener un compromiso."},
      {t:"viable",exp:"Que puede realizarse de manera realista con los recursos y condiciones disponibles.",ej:"Podemos evaluar si la nueva fecha es viable.",extra:"Alternativas: factible, posible."},
      {t:"prioridad",exp:"Asunto que debe atenderse antes que otros.",ej:"Necesitamos definir cuál es la prioridad para esta semana.",extra:"Colocaciones: establecer, revisar, cambiar prioridades."},
      {t:"condición",exp:"Requisito o circunstancia que debe cumplirse para avanzar.",ej:"Podemos aceptar la propuesta con una condición.",extra:"Muy útil en negociación y coordinación."},
      {t:"margen",exp:"Tiempo o capacidad disponible para ajustar una decisión.",ej:"No tenemos mucho margen para cambiar la fecha.",extra:"Expresiones: tener margen, dejar margen, margen de maniobra."}
    ],
    frases:[
      {grupo:"Capacidad y posibilidad",items:[{t:"Podemos asumir esa tarea si recibimos los datos hoy.",uso:"Combina posibilidad con una condición."},{t:"No podemos comprometernos con esa fecha todavía.",uso:"Marca un límite sin cerrar la conversación."}]},
      {grupo:"Obligación y responsabilidad",items:[{t:"Debemos cerrar este punto antes del viernes.",uso:"Obligación compartida."},{t:"El equipo debe confirmar los requisitos técnicos.",uso:"Asigna una responsabilidad concreta."}]},
      {grupo:"Intención y propuesta",items:[{t:"Quiero proponer una alternativa que reduzca el riesgo.",uso:"Introduce una propuesta desde una intención clara."},{t:"Queremos revisar primero el impacto en el calendario.",uso:"Presenta la intención del equipo."}]},
      {grupo:"Necesidad y condición",items:[{t:"Necesitamos contar con la aprobación antes de avanzar.",uso:"Presenta una condición necesaria."},{t:"Necesito que me confirmen quién tomará la decisión final.",uso:"Formula una necesidad de información con mayor precisión."}]}
    ],
    builder:{intro:"Organiza una intervención de seguimiento. Elige una idea de cada bloque y adapta después el resultado.",fields:[
      {label:"Posibilidad",options:["Podemos mantener la fecha si recibimos los datos hoy.","Podemos mover la revisión al jueves.","No podemos confirmar el alcance todavía."]},

const sectionDefs=[
  ["objetivo","1. 🎯 Tu objetivo esta semana"],["situacion","2. 🏢 La situación"],["vocabulario","3. 🗣️ Vocabulario clave"],["frases","4. 💬 Frases que puedes usar"],["construye","5. 🧩 Construye tu mensaje"],["gramatica","6. 📚 Gramática que necesitas"],["registro","7. 🎭 Elige el registro"],["ejemplo","8. 💼 Mira cómo se hace"],["ejercicios","9. ✍️ Comprueba lo que aprendiste"],["practica","10. 🏢 Ahora te toca a ti"],["modelo","11. 💡 Ver modelo"],["checklist","12. ✅ Checklist final"]

let nivel=null;let state={actions:new Set(),checks:new Set(),exerciseDone:new Set()};
const gate=document.getElementById('levelGate'),app=document.getElementById('app'),contentEl=document.getElementById('content'),sideNav=document.getElementById('sideNav');

document.querySelectorAll('.level-btn').forEach(b=>b.addEventListener('click',()=>selectLevel(b.dataset.level)));
document.getElementById('changeLevel').addEventListener('click',()=>{window.speechSynthesis?.cancel?.();app.classList.add('hidden');gate.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});});

function selectLevel(l){nivel=l;state={actions:new Set(),checks:new Set(),exerciseDone:new Set()};gate.classList.add('hidden');app.classList.remove('hidden');render();window.scrollTo(0,0);}
function render(){const d=contenido[nivel];document.getElementById('routeLabel').textContent=`Tu ruta: ${d.ruta}`;document.getElementById('heroTitle').textContent=contenido.habilidad;document.getElementById('heroSubtitle').textContent=contenido.subtitulo;renderNav();contentEl.innerHTML=sectionDefs.map(([id,title],i)=>sectionHTML(id,title,i,d)).join('');bindInteractions();updateProgress();}
function renderNav(){sideNav.innerHTML=sectionDefs.map(([id,title],i)=>`<button data-target="${id}">${title.replace(/^\d+\.\s*/, '')}</button>`).join('');sideNav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>document.getElementById(`sec-${b.dataset.target}`).scrollIntoView({behavior:'smooth',block:'start'})));}
function sectionHTML(id,title,i,d){let body='';if(id==='objetivo')body=`<p>${d.objetivo}</p><div class="panel yellow"><strong>Al final del módulo comprobarás si ya puedes hacerlo.</strong></div>`;
if(id==='situacion')body=`<div class="panel"><span class="badge">Situación profesional</span><p>${d.situacion}</p></div>`;
if(id==='vocabulario')body=`<p class="kicker">Pulsa cada tarjeta para recuperar significado, uso y ejemplo.</p><div class="cards">${d.vocabulario.map((v,j)=>vocabCard(v,j)).join('')}</div>${nivel==='a2'?recallA2(d.vocabulario):''}`;
if(id==='frases')body=d.frases.map((g,gi)=>`<div class="panel"><h3>${g.grupo}</h3>${g.items.map((x,xi)=>phraseHTML(x,gi,xi)).join('')}</div>`).join('');
if(id==='construye')body=builderHTML(d.builder);
if(id==='gramatica')body=d.grammar.map((g,j)=>grammarHTML(g,j)).join('');
if(id==='registro')body=registerHTML(d.register);
if(id==='ejemplo')body=exampleHTML(d.example);
if(id==='ejercicios')body=d.exercises.map((e,j)=>exerciseHTML(e,j)).join('');
if(id==='practica')body=practiceHTML(d.practica);
if(id==='modelo')body=modelHTML(d.practica);
if(id==='checklist')body=checklistHTML(d.checklist);
return `<section id="sec-${id}" class="section" data-section="${id}"><div class="section-head"><h2>${title}</h2></div><div class="section-body">${body}<div class="section-nav">${i?`<button type="button" class="nav-btn" data-goto="${sectionDefs[i-1][0]}">← Anterior</button>`:'<span></span>'}${i<sectionDefs.length-1?`<button type="button" class="nav-btn primary" data-goto="${sectionDefs[i+1][0]}">Siguiente →</button>`:'<span></span>'}</div></div></section>`;}
function audioControls(text,label='frase'){if(nivel!=='a2')return'';const safe=escapeAttr(text);return `<div class="audio-row"><button type="button" class="audio-btn speak" data-text="${safe}" data-rate="1" aria-label="Escuchar ${escapeAttr(label)}">🔊 Escuchar / Listen</button><button type="button" class="audio-btn speak" data-text="${safe}" data-rate="0.78" aria-label="Escuchar lentamente ${escapeAttr(label)}">🐢 Lento / Slow</button></div>`;}
function vocabCard(v,j){return `<article class="flip"><button type="button" class="flip-top reveal-card" data-card="v${j}" aria-expanded="false"><span>${v.t}</span><span>+</span></button><div id="card-v${j}" class="flip-body hidden">${nivel==='a2'?`<div class="badge">${v.en}</div>${v.pron?`<div class="audio-note">Acento: ${v.pron}</div>`:''}`:''}<p>${v.exp}</p><p><strong>Ejemplo:</strong> ${v.ej}</p><p class="kicker">${v.extra}</p>${audioControls(v.t,'vocabulario '+v.t)}${audioControls(v.ej,'ejemplo '+v.ej)}</div></article>`;}
function recallA2(vs){const sample=vs.slice(0,4);return `<div class="panel yellow"><h3>Recupera antes de mirar</h3><p>Elige la palabra española que corresponde al significado en inglés.</p>${sample.map((v,i)=>`<div class="exercise"><strong>${v.en}</strong><div class="choice">${shuffle(sample.map(x=>x.t)).map(op=>`<button type="button" class="recall-opt" data-answer="${escapeAttr(v.t)}" data-selected="${escapeAttr(op)}">${op}</button>`).join('')}</div><div class="feedback hidden"></div></div>`).join('')}</div>`;}
function phraseHTML(x,gi,xi){return `<div class="phrase"><strong>${x.t}</strong>${audioControls(x.t,'frase '+x.t)}<button type="button" class="link-btn usage-btn" data-usage="u${gi}-${xi}">Ver cuándo usarla</button><div id="u${gi}-${xi}" class="usage">${x.uso}</div></div>`;}
function builderHTML(b){return `<p>${b.intro}</p><div class="builder">${b.fields.map((f,i)=>`<div><label for="builder-${i}">${f.label}</label><select id="builder-${i}" class="builder-select" data-index="${i}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>${nivel==='a2'?`<div class="audio-row"><button type="button" class="audio-btn builder-speak" data-index="${i}" data-rate="1" aria-label="Escuchar el bloque seleccionado ${i+1}">🔊 Escuchar / Listen</button><button type="button" class="audio-btn builder-speak" data-index="${i}" data-rate="0.78" aria-label="Escuchar lentamente el bloque seleccionado ${i+1}">🐢 Lento / Slow</button></div>`:''}</div>`).join('')}<div id="builderResult" class="result-box"></div><div id="builderAudio"></div></div>`;}
function grammarHTML(g,j){return `<article class="grammar-card"><h3>${g.title}</h3><p><span class="badge">Situación</span> ${g.situation}</p><p><strong>Intención:</strong> ${g.intention}</p><div class="formula">${g.structure}</div><p>${g.explanation}</p><div class="grid2">${g.examples.map(ex=>`<div class="panel"><strong>${ex}</strong>${audioControls(ex,'ejemplo gramatical')}</div>`).join('')}</div></article>`;}
function registerHTML(r){return `<div class="panel"><strong>Contexto:</strong> ${r.context}</div><p><strong>${r.prompt}</strong></p><div id="registerChoices" class="choice">${r.options.map((o,i)=>`<div><button type="button" data-reg="${i}">${o.text}</button>${nivel==='a2'?`<div class="choice-audio">${audioControls(o.text,'opción '+(i+1))}</div>`:''}</div>`).join('')}</div><div id="registerFeedback" class="feedback hidden" role="status" aria-live="polite"></div>`;}
function exampleHTML(e){return `<p>${e.intro}</p><div class="example">${e.text.map((x,i)=>`<p><span class="mark" tabindex="0" data-func="${escapeAttr(x.f)}">${x.t}</span></p>${nivel==='a2'?audioControls(x.t,'frase del ejemplo'):''}`).join('')}<div id="functionNote" class="function-note">Pulsa una frase para ver qué función cumple.</div>${nivel==='a2'?audioControls(e.text.map(x=>x.t).join(' '),'ejemplo profesional completo'):''}</div>`;}
function exerciseHTML(e,j){if(e.type==='mc')return `<div class="exercise" data-ex="${j}"><h3>${e.q}</h3>${nivel==='a2'?audioControls(e.q,'pregunta del ejercicio'):''}<div class="choice">${e.ops.map((op,i)=>`<div><button type="button" class="ex-opt" data-ex="${j}" data-opt="${i}">${op}</button>${nivel==='a2'?`<div class="choice-audio">${audioControls(op,'opción del ejercicio '+(i+1))}</div>`:''}</div>`).join('')}</div><div class="feedback hidden" role="status" aria-live="polite"></div><button type="button" class="retry hidden" data-retry="${j}">Volver a intentar</button></div>`;return `<div class="exercise" data-ex="${j}"><h3>${e.q}</h3>${nivel==='a2'?audioControls(e.q,'pregunta del ejercicio'):''}<input class="text-answer" data-exinput="${j}" aria-label="Respuesta del ejercicio"><button type="button" class="retry check-input" data-check="${j}">Comprobar</button><div class="feedback hidden" role="status" aria-live="polite"></div></div>`;}
function practiceHTML(p){return `<div class="panel"><strong>Situación:</strong><p>${p.situacion}</p></div><h3>Tu respuesta debe incluir:</h3><ul class="requirements">${p.requisitos.map(x=>`<li>${x}</li>`).join('')}</ul><div class="panel yellow"><strong>Recursos que puedes reutilizar:</strong>${p.apoyos.map(x=>`<div class="phrase"><strong>${x}</strong>${audioControls(x,'estructura de apoyo')}</div>`).join('')}</div><label for="practiceText"><strong>Escribe tu respuesta</strong></label><div class="practice"><textarea id="practiceText" placeholder="Escribe aquí una respuesta que puedas usar o adaptar en tu trabajo."></textarea></div><div id="practiceHint" class="feedback hidden"></div>`;}
function modelHTML(p){return `<p>Primero compara tu propia respuesta. Después abre el modelo.</p><button id="showModel" type="button" class="retry">Ver una posible respuesta</button><div id="modelBox" class="model"><strong>Esta es una posible respuesta. No necesitas escribir exactamente lo mismo.</strong><p>${p.modelo}</p>${audioControls(p.modelo,'respuesta modelo')}</div>`;}
function checklistHTML(items){return `<p>Antes de terminar, comprueba:</p><div class="checklist">${items.map((x,i)=>`<label class="check-item"><input type="checkbox" data-checkitem="${i}"><span>${x}</span></label>`).join('')}</div><div class="check-progress"><div class="check-progress-track" role="progressbar" aria-label="Progreso del checklist" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="checkProgressTrack"><div id="checkProgressBar" class="check-progress-bar"></div></div><div id="checkProgressText" class="check-progress-text">0 de ${items.length} completados</div></div><div id="readyBox" class="final-ready"><h3>🎯 Ya estás listo para practicar</h3><p>Durante los próximos siete días encontrarás retos relacionados con esta habilidad. No necesitas memorizar todo. Esta semana vas a usar estas estructuras varias veces en situaciones diferentes. La repetición y la adaptación forman parte del entrenamiento.</p><!-- Sustituir # por la URL real del reto diario cuando esté disponible --><a class="challenge-link" href="#">🔥 Ir al reto de hoy</a></div>`;}

function bindInteractions(){
  document.querySelectorAll('.reveal-card').forEach(b=>b.addEventListener('click',()=>{const el=document.getElementById('card-'+b.dataset.card);el.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!el.classList.contains('hidden')));mark('vocab-'+b.dataset.card);}));
  document.querySelectorAll('.usage-btn').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.usage).style.display='block';mark('usage-'+b.dataset.usage);}));
  document.querySelectorAll('.speak').forEach(b=>{const fn=e=>{e.stopPropagation();speak(b.dataset.text,Number(b.dataset.rate||1));mark('audio-'+hash(b.dataset.text));};b.addEventListener('click',fn);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e);}});});
  document.querySelectorAll('.recall-opt').forEach(b=>b.addEventListener('click',()=>{const f=b.closest('.exercise').querySelector('.feedback');const ok=b.dataset.answer===b.dataset.selected;f.textContent=ok?'Bien: recuperaste la palabra correcta.':`Todavía no. La palabra correcta es “${b.dataset.answer}”.`;f.className='feedback '+(ok?'good':'note');mark('recall-'+b.dataset.answer);}));
  const selects=[...document.querySelectorAll('.builder-select')];const updateBuilder=(count=true)=>{const text=selects.map(s=>s.value).join(' ');document.getElementById('builderResult').textContent=text;document.getElementById('builderAudio').innerHTML=nivel==='a2'?audioControls(text,'mensaje construido'):'';bindNewAudio(document.getElementById('builderAudio'));if(count)mark('builder');};selects.forEach(s=>s.addEventListener('change',()=>updateBuilder(true)));document.querySelectorAll('.builder-speak').forEach(b=>b.addEventListener('click',()=>{const sel=document.querySelector(`.builder-select[data-index="${b.dataset.index}"]`);if(sel){speak(sel.value,Number(b.dataset.rate||1));mark('audio-builder-'+b.dataset.index);}}));if(selects.length)updateBuilder(false);
  document.querySelectorAll('[data-reg]').forEach(b=>b.addEventListener('click',()=>{const o=contenido[nivel].register.options[Number(b.dataset.reg)];const f=document.getElementById('registerFeedback');f.textContent=o.feedback;f.className='feedback '+(o.quality==='good'?'good':'note');document.querySelectorAll('[data-reg]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mark('register');}));
  document.querySelectorAll('.mark').forEach(x=>{const show=()=>{document.getElementById('functionNote').textContent=x.dataset.func;mark('example-analysis');};x.addEventListener('click',show);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')show();});});
  document.querySelectorAll('.ex-opt').forEach(b=>b.addEventListener('click',()=>checkMC(b)));
  document.querySelectorAll('[data-retry]').forEach(b=>b.addEventListener('click',()=>{const box=b.closest('.exercise');box.querySelectorAll('.ex-opt').forEach(x=>x.disabled=false);box.querySelector('.feedback').classList.add('hidden');b.classList.add('hidden');}));
  document.querySelectorAll('.check-input').forEach(b=>b.addEventListener('click',()=>checkInput(Number(b.dataset.check))));
  const pt=document.getElementById('practiceText');pt.addEventListener('input',()=>{if(pt.value.trim().length >= (nivel==='a2' ? 40 : 80)){mark('practice-write');} if(pt.value.trim().length>25){const h=document.getElementById('practiceHint');h.textContent='Ya tienes una base. Revisa ahora si tu respuesta cumple todos los requisitos de la situación.';h.className='feedback good';}});
  document.getElementById('showModel').addEventListener('click',()=>{document.getElementById('modelBox').classList.add('show');mark('model');});
  document.querySelectorAll('[data-checkitem]').forEach(c=>c.addEventListener('change',()=>{if(c.checked)state.checks.add(c.dataset.checkitem);else state.checks.delete(c.dataset.checkitem);mark('check-'+c.dataset.checkitem,false);const all=document.querySelectorAll('[data-checkitem]').length;const checked=state.checks.size;const cpct=all?Math.round(checked/all*100):0;document.getElementById('checkProgressBar').style.width=cpct+'%';document.getElementById('checkProgressText').textContent=`${checked} de ${all} completados`;document.getElementById('checkProgressTrack').setAttribute('aria-valuenow',String(cpct));document.getElementById('readyBox').classList.toggle('show',checked===all);if(checked===all)mark('all-checks');updateProgress();}));
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>document.getElementById('sec-'+b.dataset.goto).scrollIntoView({behavior:'smooth',block:'start'})));
  observeSections();
}
function bindNewAudio(root){root.querySelectorAll('.speak').forEach(b=>b.addEventListener('click',()=>{speak(b.dataset.text,Number(b.dataset.rate||1));mark('audio-'+hash(b.dataset.text));}));}
function checkMC(b){const j=Number(b.dataset.ex),e=contenido[nivel].exercises[j],box=b.closest('.exercise'),f=box.querySelector('.feedback'),ok=Number(b.dataset.opt)===e.correct;f.textContent=(ok?'Funciona. ':'Revisa esta elección. ')+e.exp;f.className='feedback '+(ok?'good':'note');box.querySelectorAll('.ex-opt').forEach(x=>x.disabled=true);box.querySelector('[data-retry]').classList.remove('hidden');if(ok){state.exerciseDone.add(String(j));mark('exercise-'+j);}updateProgress();}
function checkInput(j){const e=contenido[nivel].exercises[j],box=document.querySelector(`.exercise[data-ex="${j}"]`),val=box.querySelector('[data-exinput]').value.trim().toLowerCase(),valid=[e.answer,...(e.alts||[])].map(x=>x.toLowerCase()),ok=valid.includes(val),f=box.querySelector('.feedback');f.textContent=(ok?'Funciona. ':'Todavía no. ')+e.exp;f.className='feedback '+(ok?'good':'note');if(ok){state.exerciseDone.add(String(j));mark('exercise-'+j);}updateProgress();}
function observeSections(){const obs=new IntersectionObserver(entries=>entries.forEach(en=>{if(en.isIntersecting){const id=en.target.dataset.section;mark('section-'+id);sideNav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.target===id));}}),{threshold:.28});document.querySelectorAll('.section').forEach(s=>obs.observe(s));}
function mark(key,auto=true){if(auto)state.actions.add(key);updateProgress();}
function updateProgress(){const d=contenido[nivel];const core=sectionDefs.length;const vocab=Math.min(d.vocabulario.length,4);const exercise=d.exercises.length;const total=core+vocab+exercise+1+1+1+d.checklist.length;let done=0;sectionDefs.forEach(([id])=>{if(state.actions.has('section-'+id))done++;});for(let i=0;i<Math.min(d.vocabulario.length,4);i++)if(state.actions.has('vocab-v'+i))done++;done+=state.exerciseDone.size;if(state.actions.has('builder'))done++;if(state.actions.has('register'))done++;if(state.actions.has('practice-write'))done++;done+=state.checks.size;const pct=Math.min(100,Math.round(done/total*100));document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressText').textContent=pct+'%';}
function speak(text,rate=1){if(!('speechSynthesis' in window)){alert('La síntesis de voz no está disponible en este navegador. El resto del módulo funciona normalmente.');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-CO';u.rate=rate;const voices=window.speechSynthesis.getVoices();const prefs=['es-CO','es-MX','es-US','es-419','es-ES'];let voice=null;for(const p of prefs){voice=voices.find(v=>v.lang&&v.lang.toLowerCase()===p.toLowerCase());if(voice)break;}if(!voice)voice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('es'));if(voice)u.voice=voice;window.speechSynthesis.speak(u);}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h)}
</script>
